@keyframes recp { 0%, 100% { box-shadow: 0 0 calc(1.4 * var(--u)) rgba(255,40,52,.2); } 50% { box-shadow: 0 0 calc(3.4 * var(--u)) rgba(255,40,52,.5); } }

.title .mlist button { transition: color .15s, letter-spacing .2s, text-shadow .2s; }

body.eyecur, body.eyecur * { cursor: none !important; }

.screen.over { background: radial-gradient(ellipse at 50% 46%, rgba(40,0,3,.5) 0%, rgba(14,0,1,.86) 55%, rgba(0,0,0,.97) 100%); }
.screen.over::before { content: ''; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 calc(34 * var(--u)) calc(6 * var(--u)) rgba(150,0,10,.55); animation: overpulse 1.9s ease-in-out infinite; }
.screen.over h1 { letter-spacing: calc(1.4 * var(--u)); text-shadow: calc(.5 * var(--u)) 0 0 rgba(255,0,30,.55), calc(-.5 * var(--u)) 0 0 rgba(0,200,255,.22), 0 0 calc(6 * var(--u)) rgba(255,20,30,.6); animation: overin 2.4s cubic-bezier(.1,.7,.2,1) both, overjit 3.7s steps(1) 2.4s infinite; }
@keyframes overpulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
@keyframes overin { 0% { opacity: 0; transform: scale(1.5); letter-spacing: calc(5 * var(--u)); filter: blur(calc(1.2 * var(--u))); } 60% { opacity: 1; filter: blur(0); } 100% { opacity: 1; transform: scale(1); } }

/* ---- редизайн-2 (11 ноя, владелец: «дизайн кнопок так и не поменял, анимаций нет»): язык пульта охраны.
   Кнопки — пластины со срезанными углами и красными уголками, а не скруглённые прямоугольники; по наведению по пластине проходит блик-развёртка,
   нажатие — вспышка; меню и варианты выезжают по очереди; активная камера — с полосой и мигающей точкой записи. Движение — только transform
   (без прозрачности: медленный кадр не должен оставить кнопку невидимой). body.calm — без анимаций. ---- */
:root { --cut: calc(2.2 * var(--u)); }
#choice button, .btn, .sh-act button:not(.sh-q), .set, .sh-cams button {
  position: relative; border-radius: 0 !important; overflow: hidden;
  -webkit-clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); }
#choice button, .btn, .sh-act button:not(.sh-q) {
  border: 0 !important; box-shadow: inset 0 0 0 calc(.35 * var(--u)) rgba(255,70,82,.55), inset 0 0 calc(5 * var(--u)) rgba(255,30,44,.12) !important;
  background:
    linear-gradient(135deg, var(--acc) 0, var(--acc) calc(1.1 * var(--u)), transparent calc(1.15 * var(--u))) top left / 50% 50% no-repeat,
    linear-gradient(315deg, var(--acc) 0, var(--acc) calc(1.1 * var(--u)), transparent calc(1.15 * var(--u))) bottom right / 50% 50% no-repeat,
    repeating-linear-gradient(0deg, rgba(255,255,255,.022) 0, rgba(255,255,255,.022) 1px, transparent 1px, transparent 3px),
    linear-gradient(180deg, rgba(44,9,13,.92), rgba(12,4,5,.94)) !important;
  letter-spacing: calc(.35 * var(--u)); transition: transform .12s cubic-bezier(.2,.8,.2,1), filter .15s, box-shadow .15s !important; }
#choice button::after, .btn::after, .sh-act button:not(.sh-q)::after, .set::after {   /* блик-развёртка */
  content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 45%; pointer-events: none;
  background: linear-gradient(100deg, transparent, rgba(255,120,128,.22) 45%, rgba(255,255,255,.16) 50%, rgba(255,120,128,.22) 55%, transparent);
  transform: translateX(-130%) skewX(-18deg); }
#choice button:hover::after, .btn:hover::after, .sh-act button:not(.sh-q):hover::after, .set:hover::after, .pfocus::after { animation: sweep .7s cubic-bezier(.3,.6,.3,1); }
@keyframes sweep { from { transform: translateX(-130%) skewX(-18deg); } to { transform: translateX(330%) skewX(-18deg); } }
#choice button:hover, .btn:hover, .sh-act button:not(.sh-q):hover {
  transform: translateX(calc(.8 * var(--u))); filter: brightness(1.25) drop-shadow(0 0 calc(1.6 * var(--u)) rgba(255,40,52,.55));
  box-shadow: inset 0 0 0 calc(.35 * var(--u)) rgba(255,110,120,.95), inset 0 0 calc(7 * var(--u)) rgba(255,30,44,.28) !important; }
#choice button:active, .btn:active, .sh-act button:not(.sh-q):active { transform: scale(.965) !important; filter: brightness(1.9) saturate(1.3); transition-duration: .04s !important; }
.screen .btn.ghost { box-shadow: inset 0 0 0 calc(.3 * var(--u)) rgba(236,232,220,.28) !important;
  background: linear-gradient(135deg, rgba(236,232,220,.7) 0, rgba(236,232,220,.7) calc(1.1 * var(--u)), transparent calc(1.15 * var(--u))) top left / 50% 50% no-repeat, linear-gradient(180deg, rgba(30,26,26,.7), rgba(10,8,8,.8)) !important; }
/* варианты ответа: номер — красная плашка слева, строки выезжают по очереди, под таймером кромка «горит» */
#choice button { text-align: left; padding-left: calc(15 * var(--u)); animation: optin .42s cubic-bezier(.16,.84,.3,1) backwards; }
#choice button b { position: absolute; left: 0; top: 0; bottom: 0; width: calc(11 * var(--u)); margin: 0; display: flex; align-items: center; justify-content: center; color: #fff !important;
  background: linear-gradient(180deg, rgba(200,24,36,.95), rgba(110,8,16,.95)); font-family: "Courier New", monospace; font-size: 1.15em; text-shadow: 0 0 calc(2 * var(--u)) rgba(0,0,0,.6); }
#choice button:nth-of-type(1) { animation-delay: .05s; } #choice button:nth-of-type(2) { animation-delay: .13s; } #choice button:nth-of-type(3) { animation-delay: .21s; } #choice button:nth-of-type(4) { animation-delay: .29s; }
@keyframes optin { from { transform: translateX(-14%) scaleX(.9); filter: brightness(2.2); } to { transform: none; filter: none; } }
#choice h2 { letter-spacing: calc(.5 * var(--u)); animation: h2in .5s cubic-bezier(.16,.84,.3,1) backwards; }
#choice h2::after { content: ''; display: block; width: calc(22 * var(--u)); height: calc(.45 * var(--u)); margin: calc(2 * var(--u)) auto 0; background: linear-gradient(90deg, transparent, var(--acc), transparent); animation: barin .6s .1s cubic-bezier(.16,.84,.3,1) backwards; }
@keyframes h2in { from { transform: translateY(40%); letter-spacing: calc(2 * var(--u)); } to { transform: none; } }
@keyframes barin { from { transform: scaleX(0); } to { transform: scaleX(1); } }
#timer { height: calc(1 * var(--u)); border-radius: 0; background: rgba(255,255,255,.1); }
#timer i { background: linear-gradient(90deg, #7a0a12, var(--acc)); box-shadow: 0 0 calc(2.5 * var(--u)) var(--acc); animation: tmp .5s steps(2) infinite; }
@keyframes tmp { 50% { filter: brightness(1.5); } }
/* экраны меню: кнопки и строки настроек входят по очереди снизу */
.screen .btn, .screen .set, .screen .vols { animation: rowin .4s cubic-bezier(.16,.84,.3,1) backwards; }
.screen .btn:nth-of-type(2), .screen .set:nth-of-type(2) { animation-delay: .05s; } .screen .btn:nth-of-type(3), .screen .set:nth-of-type(3) { animation-delay: .1s; }
.screen .btn:nth-of-type(4), .screen .set:nth-of-type(4) { animation-delay: .15s; } .screen .btn:nth-of-type(5), .screen .set:nth-of-type(5) { animation-delay: .2s; }
.screen .btn:nth-of-type(n+6), .screen .set:nth-of-type(n+6) { animation-delay: .25s; }
@keyframes rowin { from { transform: translateY(calc(5 * var(--u))) scale(.97); } to { transform: none; } }
.screen.sub h1, .screen.pz h1 { position: relative; padding-bottom: calc(2.4 * var(--u)); }
.screen.sub h1::after, .screen.pz h1::after { content: ''; position: absolute; left: 50%; bottom: 0; width: calc(26 * var(--u)); height: calc(.5 * var(--u)); margin-left: calc(-13 * var(--u)); background: linear-gradient(90deg, transparent, var(--acc), transparent); animation: barin .6s cubic-bezier(.16,.84,.3,1) backwards; }
/* строка настроек: тёмная пластина, слева красная планка — по наведению вырастает */
.set { border: 0 !important; background: linear-gradient(90deg, rgba(40,8,12,.78), rgba(14,6,7,.72)) !important; box-shadow: inset 0 0 0 calc(.25 * var(--u)) rgba(255,90,100,.2); transition: transform .12s, box-shadow .15s, filter .15s; }
.set::before { content: ''; position: absolute; left: 0; top: 18%; bottom: 18%; width: calc(.7 * var(--u)); background: var(--acc); transform: scaleY(.35); transform-origin: 50% 50%; transition: transform .18s cubic-bezier(.2,.8,.2,1); box-shadow: 0 0 calc(2 * var(--u)) var(--acc); }
.set:hover { transform: translateX(calc(.8 * var(--u))); box-shadow: inset 0 0 0 calc(.25 * var(--u)) rgba(255,110,120,.7); filter: brightness(1.15); }
.set:hover::before, .set.pfocus::before { transform: scaleY(1); }
.set:active { transform: scale(.98); filter: brightness(1.6); }
.set b.gfx i { transition: opacity .15s, transform .15s; } .set b.gfx i.on { transform: translateY(calc(-.3 * var(--u))); text-shadow: 0 0 calc(2 * var(--u)) rgba(255,40,52,.7); }
.vols { border: 0; border-radius: 0; background: linear-gradient(90deg, rgba(40,8,12,.78), rgba(14,6,7,.72)); box-shadow: inset 0 0 0 calc(.25 * var(--u)) rgba(255,90,100,.2); }
.vol input { height: calc(.8 * var(--u)); border-radius: 0; background: linear-gradient(90deg, rgba(255,59,71,.55), rgba(255,255,255,.14)); }
.vol input::-webkit-slider-thumb { width: calc(2.2 * var(--u)); height: calc(6.4 * var(--u)); border-radius: 0; box-shadow: 0 0 calc(2 * var(--u)) var(--acc); transition: transform .1s; }
.vol input::-moz-range-thumb { width: calc(2.2 * var(--u)); height: calc(6.4 * var(--u)); border-radius: 0; box-shadow: 0 0 calc(2 * var(--u)) var(--acc); }
.vol input:active::-webkit-slider-thumb { transform: scaleY(1.25); }
/* круглые кнопки (верх экрана, закрыть, «?», звук): восьмиугольник пульта, значок подрастает, на нажатии — кольцо-вспышка */
#hud button, .sx, .sh-act button.sh-q, .vol .mute { border-radius: 0 !important; position: relative;
  -webkit-clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%);
  border: 0 !important; background: linear-gradient(180deg, rgba(60,12,17,.9), rgba(14,5,6,.92)) !important; box-shadow: inset 0 0 0 calc(.4 * var(--u)) rgba(255,90,100,.4) !important; transition: transform .14s cubic-bezier(.2,.8,.2,1), filter .15s; }
#hud button .ic, .sx .ic { transition: transform .18s cubic-bezier(.2,.8,.2,1); }
#hud button:hover, .sx:hover, .sh-act button.sh-q:hover, .vol .mute:hover { filter: brightness(1.5) drop-shadow(0 0 calc(1.5 * var(--u)) rgba(255,40,52,.7)); transform: scale(1.08); }
#hud button:hover .ic { transform: scale(1.15); } .sx:hover .ic { transform: rotate(90deg) scale(1.1); }
#hud button:active, .sx:active, .sh-act button.sh-q:active { transform: scale(.9); filter: brightness(2.2); }
#hud button.on { background: linear-gradient(180deg, rgba(200,24,36,.9), rgba(96,8,14,.92)) !important; }
/* камеры: вкладки пульта. Активная — выше остальных, сверху красная полоса, рядом с номером мигает точка записи */
.sh-cams { gap: calc(.8 * var(--u)); align-items: flex-end; }
.sh-cams button { --cut: calc(1.6 * var(--u)); border: 0 !important; background: linear-gradient(180deg, rgba(30,10,12,.86), rgba(8,4,5,.9)) !important; box-shadow: inset 0 0 0 calc(.25 * var(--u)) rgba(255,90,100,.26); transition: transform .16s cubic-bezier(.2,.8,.2,1), filter .15s, box-shadow .15s !important; }
.sh-cams button::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: calc(.7 * var(--u)); background: var(--acc); transform: scaleX(0); transition: transform .22s cubic-bezier(.2,.8,.2,1); box-shadow: 0 0 calc(2 * var(--u)) var(--acc); }
.sh-cams button:hover { transform: translateY(calc(-1 * var(--u))); filter: brightness(1.35); }
.sh-cams button:active { transform: translateY(0) scale(.94); filter: brightness(2); }
.sh-cams button.on { transform: translateY(calc(-1.6 * var(--u))); background: linear-gradient(180deg, rgba(110,14,22,.92), rgba(26,6,8,.94)) !important; color: #fff; box-shadow: inset 0 0 0 calc(.3 * var(--u)) rgba(255,110,120,.85); animation: camon .28s steps(3); }
.sh-cams button.on::before { transform: scaleX(1); }
.sh-cams button.on b::after { content: ''; display: inline-block; width: calc(1.3 * var(--u)); height: calc(1.3 * var(--u)); margin-left: calc(1 * var(--u)); border-radius: 50%; background: #ff2030; box-shadow: 0 0 calc(1.6 * var(--u)) #ff2030; vertical-align: middle; animation: blink 1.1s steps(2) infinite; }
@keyframes camon { 0% { filter: brightness(3) contrast(1.6); } 60% { filter: brightness(.6); } 100% { filter: none; } }
/* «Записать» — главная кнопка смены: красная, дышит; остальные — тёмные пластины */
.sh-act { gap: calc(1.4 * var(--u)); }
.sh-act button#shLog { animation: none; background:
    linear-gradient(135deg, #fff 0, #fff calc(1.1 * var(--u)), transparent calc(1.15 * var(--u))) top left / 50% 50% no-repeat,
    linear-gradient(180deg, rgba(196,22,34,.95), rgba(92,8,14,.95)) !important; color: #fff; }
.sh-act button#shLog::before { content: ''; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 calc(6 * var(--u)) rgba(255,160,165,.55); animation: overpulse 2.2s ease-in-out infinite; }
/* главное меню: пункт подчёркивается растущей красной линией */
.title .mlist button { overflow: hidden; }
.title .mlist button::after { content: ''; position: absolute; left: 50%; bottom: calc(-.25 * var(--u)); width: 100%; height: calc(.4 * var(--u)); margin-left: -50%; background: linear-gradient(90deg, transparent, var(--acc) 30%, var(--acc) 70%, transparent); transform: scaleX(0); transition: transform .28s cubic-bezier(.2,.8,.2,1); }
.title .mlist button:hover::after, .title .mlist button.pfocus::after { transform: scaleX(1); }
.title .mlist button::before { border-radius: 0; width: calc(3 * var(--u)); height: calc(.5 * var(--u)); margin-top: calc(-.25 * var(--u)); transform: translateX(calc(-4 * var(--u))); transition: opacity .15s, transform .22s cubic-bezier(.2,.8,.2,1); }
.title .mlist button:hover::before, .title .mlist button:active::before { transform: none; }
.title .mlist button::before { display: none; }   /* метка слева залезала на первую букву длинных пунктов («Продолжить», «Начать заново») — убрана, выбранный пункт показывают подчёркивание и свечение (владелец, 12 ноя) */
.title.open .mlist button { animation: rowin .5s cubic-bezier(.16,.84,.3,1) backwards; }
.title.open .mlist button:nth-child(2) { animation-delay: .07s; } .title.open .mlist button:nth-child(3) { animation-delay: .14s; } .title.open .mlist button:nth-child(4) { animation-delay: .21s; } .title.open .mlist button:nth-child(n+5) { animation-delay: .28s; }
/* подсказка «нажми» и окно разговора */
#tap { border-radius: 0; border: 0; background: linear-gradient(90deg, transparent, rgba(40,6,10,.85) 18%, rgba(40,6,10,.85) 82%, transparent); letter-spacing: calc(.6 * var(--u)); }
/* геймпад, пульт ТВ, клавиатура: обводку срезанные углы обрезают — выделение рисуется внутри пластины и ярче */
body.pad .pfocus, .tvf, button:focus-visible { box-shadow: inset 0 0 0 calc(.8 * var(--u)) #fff, inset 0 0 calc(7 * var(--u)) rgba(255,40,52,.6) !important; filter: brightness(1.4) !important; }
body.pad .title .mlist button.pfocus { filter: none !important; }
body.calm #choice button, body.calm .screen .btn, body.calm .screen .set, body.calm .title.open .mlist button, body.calm .sh-cams button.on, body.calm #choice h2 { animation: none; }
body.calm #choice button:hover::after, body.calm .btn:hover::after, body.calm .set:hover::after { animation: none; }
#act.lock button, #choice.lock button { opacity: .55; transition: opacity .12s; } #act button, #choice button { transition: opacity .25s; }
</style>

<div id="eyecur" aria-hidden="true"><svg viewBox="0 0 34 34"><g class="lid"><path class="rim" d="M3 17 Q17 4 31 17 Q17 30 3 17 Z" fill="rgba(8,2,3,.72)" stroke="#ff3b47" stroke-width="1.6" stroke-linejoin="round"/><g class="iris"><circle cx="17" cy="17" r="5.4" fill="#c4121f"/><circle cx="17" cy="17" r="2.3" fill="#050001"/><circle cx="15.4" cy="15.3" r="1" fill="#fff" opacity=".85"/></g></g></svg></div>
<script>
/* курсор-глаз: только настоящая мышь (не палец, не пульт ТВ, не геймпад) */
(function () {
  var el = document.getElementById('eyecur'), on = false, x = 0, y = 0, raf = 0;
  if (window.nsTV || !window.matchMedia || !matchMedia('(pointer: fine)').matches) return;
  function draw() { raf = 0; el.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)'; }
  function hot(t) { for (var i = 0; t && t !== document && i < 6; i++, t = t.parentNode) { if (/^(BUTTON|A|INPUT|SELECT)$/.test(t.tagName) || (t.classList && (t.classList.contains('spot') || t.classList.contains('cam') || t.classList.contains('btn')))) return true; } return false; }
  document.addEventListener('pointermove', function (e) {
    if (e.pointerType && e.pointerType !== 'mouse') { if (on) { on = false; document.body.classList.remove('eyecur'); } return; }
    if (!on) { on = true; document.body.classList.add('eyecur'); }
    x = e.clientX; y = e.clientY; if (!raf) raf = requestAnimationFrame(draw);
    el.classList.toggle('hot', hot(e.target));
  }, { passive: true });
  document.addEventListener('pointerdown', function (e) { if (!e.pointerType || e.pointerType === 'mouse') el.classList.add('dn'); }, { passive: true });
  document.addEventListener('pointerup', function () { el.classList.remove('dn'); }, { passive: true });
  document.addEventListener('mouseleave', function () { on = false; document.body.classList.remove('eyecur'); });
})();
</script>
