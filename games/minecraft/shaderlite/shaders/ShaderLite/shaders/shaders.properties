# ShaderLite - lightweight shaderpack for weak PCs. Default profile: LOW.

profile.POTATO = !SHADOWS !BLOOM !GODRAYS !SHADOW_ENTITIES LIGHT_SCALE=50 SHADOW_FILTER=1 shadowMapResolution=512 shadowDistance=48.0 WATER_WAVES=2 SHARPEN=40
profile.LOW    = SHADOWS BLOOM !GODRAYS !SHADOW_ENTITIES LIGHT_SCALE=50 SHADOW_FILTER=1 shadowMapResolution=512 shadowDistance=48.0 WATER_WAVES=2 SHARPEN=40
profile.MEDIUM = SHADOWS BLOOM GODRAYS SHADOW_ENTITIES LIGHT_SCALE=50 SHADOW_FILTER=4 shadowMapResolution=1024 shadowDistance=80.0 WATER_WAVES=4 SHARPEN=40
profile.HIGH   = SHADOWS BLOOM GODRAYS SHADOW_ENTITIES LIGHT_SCALE=100 SHADOW_FILTER=8 shadowMapResolution=2048 shadowDistance=128.0 WATER_WAVES=4 SHARPEN=20

screen = <profile> <empty> [LIGHT] [WORLD] [IMAGE] <empty> SHADOWS LIGHT_SCALE
screen.LIGHT = SHADOWS SHADOW_ENTITIES shadowMapResolution shadowDistance SHADOW_FILTER LIGHT_SCALE sunPathRotation <empty> SUN_BRIGHTNESS AMBIENT_BRIGHTNESS TORCH_BRIGHTNESS MIN_LIGHT
screen.WORLD = WAVING_PLANTS WAVING_SPEED WATER_WAVES WATER_ALPHA FOG_DENSITY GODRAYS
screen.IMAGE = BLOOM BLOOM_STRENGTH SHARPEN EXPOSURE SATURATION CONTRAST WARMTH VIGNETTE
sliders = shadowMapResolution shadowDistance SHADOW_FILTER LIGHT_SCALE sunPathRotation SUN_BRIGHTNESS AMBIENT_BRIGHTNESS TORCH_BRIGHTNESS MIN_LIGHT WAVING_SPEED WATER_WAVES WATER_ALPHA FOG_DENSITY BLOOM_STRENGTH SHARPEN EXPOSURE SATURATION CONTRAST WARMTH VIGNETTE

oldLighting = false
separateAo = false
vignette = false
underwaterOverlay = false
sun = true
moon = true
dynamicHandLight = true
frustum.culling = true
shadow.culling = true
particles.ordering = after
shadowTranslucent = false

#ifndef SHADOWS
shadow.enabled = false
#endif
#ifndef SHADOW_ENTITIES
shadowEntities = false
shadowBlockEntities = false
shadowPlayer = false
#endif

# Main saving: shadow/light pass at half resolution (1/4 of the pixels)
#if LIGHT_SCALE == 50
scale.deferred = 0.5
#endif

# Bloom at 1/4 resolution (1/16 of the pixels)
scale.composite = 0.25
scale.composite1 = 0.25
scale.composite2 = 0.25
#ifndef BLOOM
#ifndef GODRAYS
program.composite.enabled = false
program.composite1.enabled = false
program.composite2.enabled = false
program.world-1/composite.enabled = false
program.world-1/composite1.enabled = false
program.world-1/composite2.enabled = false
program.world1/composite.enabled = false
program.world1/composite1.enabled = false
program.world1/composite2.enabled = false
#endif
#endif

blend.gbuffers_clouds.colortex2 = off
