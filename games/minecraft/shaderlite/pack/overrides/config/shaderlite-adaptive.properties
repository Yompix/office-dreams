# ShaderLite: Adaptive Quality / Адаптивное качество
# enabled - включить (true) / выключить (false)
# targetFps - какой FPS держать (20..240)
# minViewDistance - ниже этой дальности прорисовки (в чанках) мод не опускается
# adjustClouds / adjustParticles / adjustEntityDistance - что ещё можно временно снижать
# showMessages - писать над хотбаром, когда мод меняет качество
enabled=true
targetFps=40
minViewDistance=5
adjustClouds=true
adjustParticles=true
adjustEntityDistance=true
showMessages=false
