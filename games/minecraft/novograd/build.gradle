plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    maven { name = 'GeckoLib'; url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "novograd" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // GeckoLib (MIT): модели и покадровая анимация жителей; вшита в мод — ставить отдельно не нужно
    modImplementation "software.bernie.geckolib:geckolib-fabric-1.21.1:4.8.4"
    include "software.bernie.geckolib:geckolib-fabric-1.21.1:4.8.4"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21; it.options.encoding = 'UTF-8' }

java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }

jar { from("LICENSE") { rename { "${it}_${project.base.archivesName.get()}" } } }

// 0.8: ни один из 5000 сгенерированных жителей не похож на героя сюжета (life/LooksCheck)
tasks.register('lookalikeTest', JavaExec) {
    group = 'verification'
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.yompix.novograd.life.LooksCheck'
    args '5000'
    jvmArgs '-Dstdout.encoding=UTF-8', '-Dfile.encoding=UTF-8'
}

// 0.9.6: баланс денег — 30 игровых дней трёх типов игроков (gta/EconomySim)
tasks.register('economyTest', JavaExec) {
    group = 'verification'
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.yompix.novograd.gta.EconomySim'
    args '30'
    jvmArgs '-Dstdout.encoding=UTF-8', '-Dfile.encoding=UTF-8'
}

// 0.9.7: рынок — 90 дней трёх сценариев (gta/MacroSim): всё в пределах, без разгона; таблица build/macro.csv
tasks.register('macroTest', JavaExec) {
    group = 'verification'
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.yompix.novograd.gta.MacroSim'
    args '90'
    jvmArgs '-Dstdout.encoding=UTF-8', '-Dfile.encoding=UTF-8'
}
