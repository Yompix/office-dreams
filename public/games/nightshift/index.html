/* ПК: по бокам — размытый отсвет кадра, рамка с тенью и подсказка по клавишам */
#amb, #keys { display: none; }
@media (pointer: fine) and (min-aspect-ratio: 4/5) {
  #amb { display: block; position: fixed; inset: 0; width: 100%; height: 100%; filter: blur(5vh) brightness(.34) saturate(1.3); transform: scale(1.2); }
  #stage { box-shadow: 0 0 8vh 2vh #000; }
  #keys { display: block; position: fixed; left: 2.4vw; bottom: 4vh; font: 600 1.5vh/2.2 Inter, Arial, sans-serif; color: rgba(255,255,255,.42); letter-spacing: .05em; }
  #keys kbd { display: inline-block; min-width: 2.2em; padding: 0 .55em; margin-right: .7em; border: 1px solid rgba(255,255,255,.25); border-radius: .4em; font: 800 1.3vh/1.8 "Courier New", monospace; text-align: center; color: rgba(255,255,255,.7); }
}
@media (pointer: fine) and (max-aspect-ratio: 5/4) { #keys { display: none; } }

/* горизонтальный экран (ПК или телефон боком): интерфейс по центру, не растянут во всю ширину */
body.land #dlg { left: 50%; right: auto; width: calc(124 * var(--u)); transform: translateX(-50%); bottom: 4%; }
body.shifting #dlg { bottom: calc(20 * var(--u)); }   /* смена: субтитры над кнопками камер */
body.shifting:not(.land) #dlg { bottom: calc(56 * var(--u)); }
body.land #subs { left: 18%; right: 18%; bottom: 26%; }
body.land #rule, body.land #note div { left: 50%; right: auto; width: calc(92 * var(--u)); transform: translateX(-50%) rotate(-1.5deg); }
body.land #note div { position: relative; left: auto; transform: rotate(-1.5deg); }
body.land #choice { padding: 0 max(4%, calc(50% - 66 * var(--u))) 4%; }
body.land #choice h2 { margin-bottom: calc(3 * var(--u)); }
body.land .screen { padding: 4% 8%; }
body.land .screen p, body.land .gal, body.land .sets, body.land .spons { max-width: calc(120 * var(--u)); }
body.land .screen.sub { padding-top: 5%; }
body.land .screen.jr { flex-direction: row; align-items: flex-start; justify-content: center; padding: 3% 5% 4%; gap: calc(9 * var(--u)); }
body.land .jr-page { width: calc(112 * var(--u)); max-width: none; }
body.land .jr-side { width: calc(76 * var(--u)); padding-top: calc(1 * var(--u)); }
body.land .camgrid { left: 50%; right: auto; width: calc(150 * var(--u)); transform: translateX(-50%); grid-template-columns: repeat(4, 1fr); top: 30%; }
body.land .camgrid .cam { aspect-ratio: 3 / 4; }
body.land .tape { left: 26%; right: 26%; bottom: 10%; }
body.land .arrows { left: 50%; right: auto; width: calc(110 * var(--u)); transform: translateX(-50%); }
body.land .mghead.low { top: 8%; }
body.land .mghead.cam { top: 12%; }
body.land #sms { left: auto; right: 3%; width: calc(96 * var(--u)); top: 6%; }
body.land .title { padding: 6% 8% 3%; }
body.land .title .logo b { font-size: calc(23 * var(--u)); }
body.land .title .tts { margin-bottom: 8%; }
body.land .title .mlist { width: calc(76 * var(--u)); }
body.land .studio small { margin-top: calc(5 * var(--u)); }
body.land #amb { display: none; }
body.land #keys { display: none; }
</style>
</head>
<body>
<canvas id="amb" width="64" height="36"></canvas>
<div id="keys"><div><kbd>␣</kbd>дальше</div><div><kbd>1–4</kbd>выбор</div><div><kbd>мышь</kbd>свет и действия</div><div><kbd>ESC</kbd>меню</div><div><kbd>O</kbd>повернуть экран</div><div><kbd>V</kbd>озвучка</div></div>
<div id="stage">
  <canvas id="cv" width="1080" height="1920"></canvas>
  <div class="layer"><div id="rule" class="hide"></div><div id="chap" class="hide"></div><div id="tap" class="hide"></div>
    <div id="dlg" class="hide"><div class="nm"></div><div class="ln"></div><i class="nx">▼</i></div></div>
  <div id="mg" class="hide"></div>
  <div id="choice" class="hide"></div>
  <div id="clock" class="hide"></div>
  <div id="hud" class="hide"><button id="bRules" title="Правила" aria-label="Правила"><svg class="ic" viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><path d="M9 9h6M9 13h6M9 17h4"/></svg></button><button id="bAuto" title="Реплики сами" aria-label="Реплики сами"><svg class="ic" viewBox="0 0 24 24"><path class="f" d="M4 5l8 7-8 7zM12 5l8 7-8 7z"/></svg></button><button id="bMute" title="Звук" aria-label="Звук"><svg class="ic" viewBox="0 0 24 24"><path class="f" d="M3 9h4l5-4v14l-5-4H3z"/><path class="on1" d="M16 8.5a5 5 0 0 1 0 7M18.8 6a8.5 8.5 0 0 1 0 12"/><path class="off" d="M16 9l5 6M21 9l-5 6"/></svg></button><button id="bFull" class="hide" title="Во весь экран" aria-label="Во весь экран"><svg class="ic" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button><button id="bMenu" title="Меню" aria-label="Меню"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div>
  <div id="note" class="hide"></div>
  <div id="sms" class="hide"></div>
  <div id="ui"></div>
</div>
<script src="i18n.js?v=4"></script>
<script src="lib/three.min.js"></script>

<script src="story.js?v=16"></script>
<script src="engine.js?v=22"></script>
</body>
