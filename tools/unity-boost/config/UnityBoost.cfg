## Настройки Unity Boost RU. После правки сохраните файл и перезапустите игру.
## Пресет можно менять и в игре клавишей F9 (он запомнится здесь).

[1. Пресет]

## WeakLaptop = «Слабый ноутбук», Medium = «Средний», Off = «Выкл».
# Setting type: BoostPreset
# Default value: WeakLaptop
# Acceptable values: WeakLaptop, Medium, Off
Preset = WeakLaptop

## Ограничение FPS: 60 или 30 (30 — ноутбук меньше греется). 0 = без ограничения.
# Setting type: Int32
# Default value: 60
FpsLimit = 60
