.reno-stars { display: flex; gap: 6px; justify-content: center; font-size: 26px; }
.reno-stars span { color: rgba(255, 255, 255, 0.15); transition: transform 0.3s; }
.reno-stars span.on { color: var(--yel); text-shadow: 0 0 10px rgba(255, 210, 63, 0.9); }
.reno-stars span.new { opacity: 0; transform: scale(2.4); }
.reno-stars.lit span.new { opacity: 1; transform: none; transition: transform 0.45s cubic-bezier(.2,1.6,.4,1), opacity 0.2s; }
.reno-legend { font-weight: 800; color: var(--yel); text-shadow: 0 0 12px rgba(255, 210, 63, 0.7); margin: 0; }

function icoSVG(name, size, cls) {
  const rows = ICONS[name];
  if (!rows) return '';
  let rects = '';
  for (let y = 0; y < rows.length; y++) {
    const row = rows[y];
    let x = 0;
    while (x < row.length) {
      const ch = row[x];
      if (ch === '.') { x++; continue; }
      let x2 = x + 1;
      while (x2 < row.length && row[x2] === ch) x2++;
      const fill = ch === '#' ? 'currentColor' : ICON_PAL[ch];
      rects += `<rect x="${x}" y="${y}" width="${x2 - x}" height="1" fill="${fill}"/>`;
      x = x2;
    }
  }
  const px = size || 18;
  return `<svg class="ico ${cls || ''}" viewBox="0 0 11 11" width="${px}" height="${px}" shape-rendering="crispEdges" aria-hidden="true">${rects}</svg>`;
}

/* ---- src/i18n.js ---- */
/* ============================================================
   OFFICE DREAMS — i18n
   L('key', {param}) → text in the current language.
   Params that are strings starting with '$' are keys themselves
   (the engine stores '$role.prog.name' so the log is language-free).
   ============================================================ */
const LANGS = {};
const LANG_LIST = ['en', 'ru', 'uk'];
let LANG = 'en';

function setLang(code) {
  LANG = LANG_LIST.includes(code) ? code : 'en';
  if (typeof document !== 'undefined' && document.documentElement) document.documentElement.lang = LANG;
  return LANG;
}
function detectLang(tgCode) {
  const c = String(tgCode || (typeof navigator !== 'undefined' && navigator.language) || 'en').toLowerCase();
  if (c.startsWith('uk')) return 'uk';
  if (c.startsWith('ru') || c.startsWith('be') || c.startsWith('kk')) return 'ru';
  return 'en';
}
function hasKey(k) {
  return (LANGS[LANG] && LANGS[LANG][k] !== undefined) || (LANGS.en && LANGS.en[k] !== undefined);
}
function L(k, p) {
  let t = LANGS[LANG] && LANGS[LANG][k];
  if (t === undefined) t = LANGS.en && LANGS.en[k];
  if (t === undefined) return k;
  if (!p) return t;
  return t.replace(/\{(\w+)\}/g, (m, name) => {
    let v = p[name];
    if (v === undefined || v === null) return '';
    if (typeof v === 'string' && /^\$[a-z]/.test(v)) v = L(v.slice(1));
    return String(v);
  });
}

/* ============================================================

const TICK = 0.25; // seconds of game time per engine tick (fixed step => exact replay)

const TIERS = {
  mini: { pts: 1, rev: 1, rep: 0.6, need: 'b', fit: 1e9, w: 1 },

  aaa: { pts: 34, rev: 70, rep: 5, need: 'f5', fit: 1e9, w: 8 },

const TIER_ORDER = ['mini', 'indie', 'big', 'aaa'];

// texts for floors / items / boosts live in the language files (floor.<id>.name|sub|perk, item.<id>.name|perk, boost.<id>.name|perk)
const FLOORS = [
  { id: 'b', price: 0, fw: 0 },
  { id: 'f1', price: 1500, fw: 15 },
  { id: 'f2', price: 12000, fw: 25 },
  { id: 'f3', price: 80000, fw: 40 },
  { id: 'f4', price: 350000, fw: 60 },
  { id: 'f5', price: 1500000, fw: 100 },
];
const FLOOR_ORDER = ['b', 'f1', 'f2', 'f3', 'f4', 'f5'];
// renovation: every owned floor can be refitted up to ★5; each star strengthens that floor's speciality
const RENO = {
  b: { k: 'tap', v: 0.06, base: 900 },
  f1: { k: 'sal', v: 0.04, base: 1500 },
  f2: { k: 'wp', v: 0.04, base: 12000 },
  f3: { k: 'sales', v: 0.05, base: 80000 },
  f4: { k: 'wp', v: 0.04, base: 350000 },
  f5: { k: 'sales', v: 0.05, base: 1500000 },
};
const RENO_MAX = 5;
const RENO_COST = [0.6, 1.2, 2.4, 4.8, 9.6]; // × the floor's base price, by the current star count

const ITEMS = [
  { id: 'coffee', price: 350 },
  { id: 'chairs', price: 700 },
  { id: 'monitor2', price: 1200 },
  { id: 'lamp', price: 900 },
  { id: 'lounge', price: 3000 },
  { id: 'rack', price: 4500 },
];
const BOOSTS = [
  { id: 'turbo', price: 5 },
  { id: 'hype', price: 5 },
];

// airdrop-point weights (used by the server; exposed so the UI can explain them)
const PTS_W = { tap: 0.02, rel: 6, up: 1.5, ev: 3 };

/* ---------- hooks (set by UI) ---------- */
const hooks = { emit: function () {} };
const emit = (type, data) => hooks.emit(type, data);

/* ---------- helpers ---------- */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const round2 = (v) => Math.round(v * 100) / 100;
function fmt(n) {
  n = Math.floor(n);
  if (n >= 1e9) return (n / 1e9).toFixed(2).replace(/\.?0+$/, '') + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'M';
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}
// deterministic PRNG (mulberry32) — state lives in s.rng
function rand(s) {
  s.rng = (s.rng + 0x6d2b79f5) >>> 0;
  let t = s.rng;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rnd = (s, a, b) => a + rand(s) * (b - a);
const pick = (s, arr) => arr[Math.floor(rand(s) * arr.length)];
const fail = (err) => ({ ok: false, err });
const OK = { ok: true };
function cleanName(str) {
  const t = String(str == null ? '' : str).replace(/[^\p{L}\p{N} .'!?\-]/gu, '').replace(/\s+/g, ' ').trim().slice(0, 22);
  return t;
}

/* ---------- state ---------- */
function newState(seed) {
  return {
    v: STATE_V,
    t: 0,
    tk: 0,
    day: 1,
    clock: 0,
    cash: 250,
    gems: 3,
    rep: 0,
    energy: 40,
    earned: 0,
    you: { lvl: 1 },
    staff: {
      prog: { lvl: 0, mood: 85 },
      art: { lvl: 0, mood: 85 },
      mkt: { lvl: 0, mood: 85 },
      des: { lvl: 0, mood: 85 },
      qa: { lvl: 0, mood: 85 },
      snd: { lvl: 0, mood: 85 },
      prod: { lvl: 0, mood: 85 },
      cm: { lvl: 0, mood: 85 },
    },
    floors: { b: 1, f1: 0, f2: 0, f3: 0, f4: 0, f5: 0 },
    flv: { b: 0, f1: 0, f2: 0, f3: 0, f4: 0, f5: 0 }, // renovation stars per floor
    items: { coffee: 0, chairs: 0, monitor2: 0, lamp: 0, lounge: 0, rack: 0 },
    project: null,
    sel: { genre: 'puzzle', tier: 'mini', name: 'Block Dreams' }, // local UI preference, not synced
    auto: false,
    games: [],
    trend: { hot: 'plat', cold: 'horror' },
    buffs: { turbo: 0, hype: 0, invest: 0 },
    goals: {},
    // cumulative, monotone counters — the server prices airdrop points from their growth
    stats: { taps: 0, started: 0, released: 0, best: 0, relW: 0, evs: 0, ups: 0, flrW: 0, goalW: 0, dqW: 0 },
    dayIncome: 0,
    dayTaps: 0,
    income3: 0,
    pending: null,
    nextEventDay: 2,
    idea: null, // {role, ttl}: a light bulb over an employee — tap it for a burst of progress
    ideaCd: 30,
    bug: null, // {ttl, lane}: a bug crawling across the office — squash it before it eats progress
    bugCd: 50,
    evCool: {},
    log: [],
    legacy: 0,
    dk: 0,
    dq: { dk: 0, base: { taps: 0, released: 0, evs: 0, ups: 0 }, done: {} },
    settings: { sound: true }, // local, not synced
    ending: false,
    endingSeen: false,
    savedAt: 0,
    rev: 0,
    rng: seed === undefined ? (Math.floor(Math.random() * 4294967296) >>> 0) : seed >>> 0,
  };
}
function bump(s) {
  s.rev++;
}

/* ---------- derived values ---------- */
const floorOn = (s, id) => s.floors[id] > 0;
const hiredCount = (s) => ROLES.filter((r) => s.staff[r].lvl > 0).length;
const moodF = (m) => 0.7 + 0.3 * (m / 100);
// strength of a support role: level × mood factor (0 when not hired)
const roleK = (s, r) => (s.staff[r] && s.staff[r].lvl > 0 ? s.staff[r].lvl * moodF(s.staff[r].mood) : 0);
const roleLocked = (s, r) => !!(ROLE[r].need && !(s.floors[ROLE[r].need] > 0));
const qaBonus = (s) => 0.12 * roleK(s, 'qa');
const prodBonus = (s) => 0.04 * roleK(s, 'prod');
const sndBonus = (s) => 0.03 * roleK(s, 'snd');
const saleDecay = (s) => Math.min(0.8, SALE_DECAY + 0.01 * roleK(s, 'cm'));
const speedOf = (l) => 1 + 0.18 * (l - 1);
const legacyMult = (s) => 1 + 0.15 * s.legacy;
const renoLvl = (s, id) => (s.flv && s.flv[id]) || 0;
function renoBonus(s, k) {
  let b = 0;
  for (const id of FLOOR_ORDER) if (RENO[id].k === k) b += RENO[id].v * renoLvl(s, id);
  return b;
}
const renoStars = (s) => FLOOR_ORDER.reduce((n, id) => n + renoLvl(s, id), 0);
const renoCost = (s, id) => (renoLvl(s, id) >= RENO_MAX ? null : Math.round(RENO[id].base * RENO_COST[renoLvl(s, id)]));
function salaryOf(s, role, lvl) {
  const l = lvl === undefined ? s.staff[role].lvl : lvl;
  if (l <= 0) return 0;
  return Math.round(ROLE[role].sal * ECON.salK * Math.pow(1.3, l - 1) * (floorOn(s, 'f1') ? 0.9 : 1) * (1 - renoBonus(s, 'sal')));
}
function upCost(role, lvl) {
  return Math.round(ROLE[role].up * Math.pow(ECON.upGrowth, lvl - 1));
}
function youUpCost(lvl) {
  return Math.round(80 * Math.pow(ECON.upGrowth, lvl - 1));
}
function maxEnergy(s) {
  return 40 + 10 * (s.you.lvl - 1);
}
function energyRegen(s) {
  return 1.4 + (s.items.coffee ? 0.6 : 0);
}
function wpMult(s) {
  let m = 1;
  if (s.items.chairs) m *= 1.06;
  if (s.items.monitor2) m *= 1.1;
  if (floorOn(s, 'f4')) m *= 1.12;
  m *= 1 + renoBonus(s, 'wp');
  m *= 1 + prodBonus(s);
  if (s.buffs.turbo > 0) m *= 2;
  return m;
}
function wpRole(s, r) {
  const st = s.staff[r];
  if (st.lvl <= 0 || ROLE[r].wp === 0) return 0;
  let k = ROLE[r].wp * speedOf(st.lvl) * moodF(st.mood);
  if (floorOn(s, 'f2') && (r === 'art' || r === 'des')) k *= 1.1;
  return k * wpMult(s);
}
function wpTotal(s) {
  let sum = 0.35 * (1 + 0.08 * (s.you.lvl - 1)) * wpMult(s);
  for (const r of ['prog', 'art', 'des', 'snd']) sum += wpRole(s, r);
  return sum;
}
function tapPower(s) {
  const k = 1 + 0.18 * (s.you.lvl - 1);
  const boost = (s.items.monitor2 ? 1.2 : 1) * (s.buffs.turbo > 0 ? 1.5 : 1);
  return { pts: 3 * k * boost, cash: 1.4 * ECON.tapK * k * (1 + 0.05 * FLOOR_ORDER.filter((f) => floorOn(s, f)).length) * (1 + 0.1 * s.legacy) * (1 + renoBonus(s, 'tap')) };
}
function salaryTotal(s) {
  let t = 0;
  for (const r of ROLES) t += salaryOf(s, r);
  return t;
}
function salesMult(s, tier) {
  let m = 1 + s.rep / 1500;
  if (tier) m /= 1 + s.rep / TIERS[tier].fit;
  if (floorOn(s, 'f3')) m *= 1.2;
  if (floorOn(s, 'f5')) m *= 1.15;
  m *= 1 + renoBonus(s, 'sales');
  if (s.items.rack) m *= 1.06;
  if (s.items.lounge) m *= 1.04;
  const mk = s.staff.mkt;
  if (mk.lvl > 0) m *= 1 + 0.07 * mk.lvl * moodF(mk.mood);
  m *= 1 + sndBonus(s);
  return m * legacyMult(s);
}
function dailySalesRate(s) {
  let r = 0;
  for (const g of s.games) if (g.active) r += g.rate;
  return r;
}
function projectNeed(genre, tier) {
  return Math.round(GENRES[genre].pts * TIERS[tier].pts);
}
function tierUnlocked(s, tier) {
  return floorOn(s, TIERS[tier].need);
}
function effLevel(s, r) {
  const st = s.staff[r];
  const base = 0.5 * s.you.lvl;
  return st.lvl > 0 ? Math.max(base, st.lvl * (0.85 + 0.15 * (st.mood / 100))) : base;
}
function qualityFor(s, genre) {
  const g = GENRES[genre];
  let q = 0;
  for (const r of ['prog', 'art', 'des']) {
    const qr = clamp(0.12 + 0.088 * effLevel(s, r), 0, 1);
    q += g.w[r] * qr;
  }
  return q;
}
function scoreMult(score) {
  return clamp(Math.pow(score / 6, 1.9), 0.1, 3.5);
}
function expectedScore(s, genre) {
  const hot = s.trend.hot === genre ? 0.3 : 0;
  return clamp(3 + 7 * qualityFor(s, genre) + hot + qaBonus(s), 1, 10);
}
// language-independent rank id; UI shows L('rank.' + id)
function rankOf(s) {
  if (s.floors.f5) return 'owner';
  if (s.floors.f4) return 'director';
  if (s.floors.f2) return 'lead';
  if (s.stats.released > 0) return 'indie';
  return 'freelancer';
}
function dayMinutes(s) {
  return Math.floor((s.clock / DAY_SEC) * 720);
}
function clockText(s) {
  const m = 480 + dayMinutes(s);
  return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
}
function incomeEstimate(s) {
  return Math.max(s.income3, 40);
}
function newName(s, genre) {
  return pick(s, GENRES[genre].names);
}

/* ---------- log (language-independent: key + params) ---------- */
function addLog(s, k, p, kind, ev) {
  const e = { day: s.day, k, p: p || {}, kind: kind || 'info' };
  if (ev) e.ev = ev;
  s.log.unshift(e);
  if (s.log.length > 40) s.log.length = 40;
}
function giveGems(s, n) {
  s.gems = Math.max(0, Math.round(s.gems + n));
}
function giveCash(s, amount) {
  s.cash += amount;
  if (amount > 0) s.earned += amount;
}

/* ---------- actions ---------- */
function doTap(s) {
  const cost = 2;
  if (s.energy < cost) return null;
  s.energy -= cost;
  const p = tapPower(s);
  giveCash(s, p.cash);
  s.dayIncome += p.cash;
  s.stats.taps++;
  if (s.project) {
    s.project.pts += p.pts;
    if (s.project.pts >= s.project.need) release(s);
  }
  return p;
}
function hire(s, role) {
  const st = s.staff[role];
  if (st.lvl > 0) return fail('owned');
  if (roleLocked(s, role)) return fail('locked');
  const price = ROLE[role].hire;
  if (s.cash < price) return fail('cash');
  s.cash -= price;
  st.lvl = 1;
  st.mood = 90;
  s.stats.ups++;
  addLog(s, 'log.hire', { role: '$role.' + role + '.name' }, 'good');
  bump(s);
  checkGoals(s);
  emit('sfx', 'up');
  return OK;
}
function upgradeStaff(s, role) {
  const st = s.staff[role];
  if (st.lvl <= 0) return fail('hire_first');
  if (st.lvl >= MAX_LVL) return fail('max');
  const price = upCost(role, st.lvl);
  if (s.cash < price) return fail('cash');
  s.cash -= price;
  st.lvl++;
  st.mood = Math.min(100, st.mood + 5);
  s.stats.ups++;
  bump(s);
  checkGoals(s);
  emit('sfx', 'up');
  return OK;
}
function upgradeYou(s) {
  if (s.you.lvl >= MAX_LVL) return fail('max');
  const price = youUpCost(s.you.lvl);
  if (s.cash < price) return fail('cash');
  s.cash -= price;
  s.you.lvl++;
  s.energy = Math.min(maxEnergy(s), s.energy + 10);
  s.stats.ups++;
  bump(s);
  checkGoals(s);
  emit('sfx', 'up');
  return OK;
}
function buyItem(s, id) {
  const it = ITEMS.find((i) => i.id === id);
  if (!it || s.items[id]) return fail('owned');
  if (s.cash < it.price) return fail('cash');
  s.cash -= it.price;
  s.items[id] = 1;
  s.stats.ups++;
  addLog(s, 'log.item', { item: '$item.' + id + '.name' }, 'good');
  bump(s);
  checkGoals(s);
  emit('sfx', 'up');
  return OK;
}
function nextFloor(s) {
  for (const id of FLOOR_ORDER) if (!floorOn(s, id)) return id;
  return null;
}
function buyFloor(s, id) {
  const f = FLOORS.find((x) => x.id === id);
  if (!f || floorOn(s, id)) return fail('owned');
  if (nextFloor(s) !== id) return fail('prev_floor');
  if (s.cash < f.price) return fail('cash');
  s.cash -= f.price;
  s.floors[id] = 1;
  s.stats.ups++;
  s.stats.flrW += f.fw;
  addLog(s, 'log.floor', { name: '$floor.' + id + '.name', sub: '$floor.' + id + '.sub' }, 'good');
  if (id === 'f5') {
    s.ending = true;
    emit('ending', null);
  }
  bump(s);
  checkGoals(s);
  emit('sfx', 'floor');
  return OK;
}
function renovate(s, id) {
  const f = FLOORS.find((x) => x.id === id);
  if (!f || !RENO[id]) return fail('unavailable');
  if (!floorOn(s, id)) return fail('locked');
  const cost = renoCost(s, id);
  if (cost === null) return fail('max');
  if (s.cash < cost) return fail('cash');
  if (!s.flv) s.flv = { b: 0, f1: 0, f2: 0, f3: 0, f4: 0, f5: 0 };
  s.cash -= cost;
  s.flv[id] = renoLvl(s, id) + 1;
  s.stats.ups++;
  s.stats.flrW += Math.max(2, Math.round(f.fw * 0.15));
  addLog(s, 'log.reno', { name: '$floor.' + id + '.name', n: s.flv[id] }, 'good');
  bump(s);
  checkGoals(s);
  emit('reno', { id, lvl: s.flv[id] });
  emit('sfx', 'floor');
  return OK;
}
function buyBoost(s, id) {
  const b = BOOSTS.find((x) => x.id === id);
  if (!b) return fail('unavailable');
  if (s.gems < b.price) return fail('gems');
  s.gems -= b.price;

  emit('sfx', 'up');
  return OK;
}
function startProject(s, genre, tier, name) {
  if (s.project) return fail('busy');
  if (!GENRES[genre] || !TIERS[tier]) return fail('unavailable');
  if (!tierUnlocked(s, tier)) return fail('locked');
  const nm = cleanName(name) || newName(s, genre);
  s.project = { genre, tier, name: nm, pts: 0, need: projectNeed(genre, tier), day: s.day };
  s.stats.started++;
  addLog(s, 'log.start', { name: nm }, 'info');
  bump(s);
  checkGoals(s);
  emit('sfx', 'up');
  return OK;
}

  bump(s);
  return OK;
}
function release(s) {
  const p = s.project;
  if (!p) return;
  const g = GENRES[p.genre], t = TIERS[p.tier];
  const q = qualityFor(s, p.genre);
  const hot = s.trend.hot === p.genre, cold = s.trend.cold === p.genre;
  let score = 3 + 7 * q + rnd(s, -0.55, 0.55) + (hot ? 0.3 : 0) + qaBonus(s);
  score = Math.round(clamp(score, 1, 10) * 10) / 10;
  const trend = hot ? 1.5 : cold ? 0.75 : 1;
  const total = g.rev * t.rev * ECON.rev * scoreMult(score) * trend * salesMult(s, p.tier);
  const game = {
    id: s.stats.released + 1,
    name: p.name,
    genre: p.genre,
    tier: p.tier,
    score,
    total: Math.round(total),
    rate: total * (1 - SALE_DECAY),
    earned: 0,
    active: true,
    day: s.day,
  };
  s.games.unshift(game);
  if (s.games.length > 40) s.games.length = 40;
  s.stats.released++;
  s.stats.relW += t.w * clamp(score / 6, 0.3, 1.5);
  if (score > s.stats.best) s.stats.best = score;
  let repGain = Math.max(0, score - 5) * t.rep * (s.items.lamp ? 1.15 : 1);
  if (score < 4) repGain = -1;
  s.rep = Math.max(0, round2(s.rep + repGain));
  let gemGain = 0;
  if (score >= 9) {
    gemGain = 1;
    giveGems(s, 1);
  }
  addLog(s, 'log.release', { name: game.name, score: score.toFixed(1) }, score >= 7 ? 'good' : 'info');
  s.project = null;
  bump(s);
  emit('release', { game, repGain, gemGain });
  emit('sfx', score >= 7 ? 'hit' : 'release');
  checkGoals(s);
  if (s.auto && tierUnlocked(s, p.tier)) {
    startProject(s, p.genre, p.tier, newName(s, p.genre));
  }
}

function catchIdea(s) {
  if (!s.idea || !s.project) return fail('unavailable');
  const p = s.project;
  const bonus = Math.round(Math.max(20, p.need * 0.06));
  const cash = Math.round(tapPower(s).cash * 12);
  s.idea = null;
  p.pts += bonus;
  giveCash(s, cash);
  s.dayIncome += cash;
  s.stats.ideas = (s.stats.ideas || 0) + 1;
  bump(s);
  emit('sfx', 'coin');
  if (p.pts >= p.need) release(s);
  return { ok: true, bonus, cash };
}

function squashBug(s) {
  if (!s.bug) return fail('unavailable');
  const cash = Math.round(tapPower(s).cash * 8);
  s.bug = null;
  giveCash(s, cash);
  s.dayIncome += cash;
  s.stats.bugs = (s.stats.bugs || 0) + 1;
  bump(s);

}

/* ---------- long-term loop: IPO (prestige) ---------- */

}

  const n = newState(s.rng);
  n.gems = s.gems + 3 + s.legacy;
  n.goals = s.goals;
  n.stats = s.stats;
  n.legacy = s.legacy + 1;
  n.dk = s.dk;
  n.dq = s.dq;
  n.sel = s.sel;
  n.settings = s.settings;
  n.endingSeen = true;
  n.t = s.t;
  n.tk = s.tk;
  n.rev = s.rev + 1;

  Object.assign(s, n);
  addLog(s, 'log.ipo', { n: s.legacy }, 'good');
  checkGoals(s);
  emit('sfx', 'floor');
  emit('ipo', { n: s.legacy });
  return OK;
}

function eventView(s) {

    k: 'ev.' + s.pending.id,
    p: def.tp(v),
    choices: def.choices.map((c, i) => {
      const need = c.need ? c.need(s, v) : 0;
      const needEnergy = c.needEnergy || 0;
      return {
        i,
        style: c.style,
        tags: c.tags,
        lp: c.lp ? c.lp(v) : {},
        disabled: !!((need && s.cash < need) || (needEnergy && s.energy < needEnergy)),

        needEnergy,
      };
    }),

}
function spawnEvent(s, forceId) {

/* ============================================================

   Keeps the local prediction and the action log in step with the
   authoritative server state. Used by the browser and by the tests.
   ============================================================ */
function createSyncClient(S, EN) {
  const c = {
    S,
    seq: 0,
    queue: [], // [[dTicks, action, ...args]] not yet sent
    lastTk: S.tk, // tick of the last queued action (or of the last sync point)
    inflight: null,
    stats: { adopts: 0, same: 0, stale: 0, replayFails: 0 },
  };
  // run a player action locally (prediction) and log it for the server
  c.act = function (type, ...args) {
    const r = EN.applyAction(c.S, [type].concat(args));
    if (r.ok) {
      c.queue.push([Math.round(c.S.tk - c.lastTk), type].concat(args));
      c.lastTk = c.S.tk;
    }
    return r;
  };
  c.pending = function () {
    return c.queue.length;
  };
  // build the request body (null while a request is in flight)
  c.prepare = function () {
    if (c.inflight) return null;
    const tail = Math.round(c.S.tk - c.lastTk);
    const body = { seq: c.seq, batch: c.queue, tail, ck: EN.stateHash(c.S) };
    c.inflight = { batch: c.queue, tail, sentTk: c.S.tk };
    c.queue = [];
    c.lastTk = c.S.tk;
    return body;
  };
  // the request never produced a usable answer: put everything back
  c.fail = function () {
    const inf = c.inflight;
    if (!inf) return;
    c.inflight = null;
    if (c.queue.length) c.queue[0][0] += inf.tail;
    else c.lastTk = inf.sentTk - inf.tail;
    c.queue = inf.batch.concat(c.queue);
  };

    const keep = { sel: c.S.sel, settings: c.S.settings };
    const ns = EN.deserialize(stateObj);
    ns.sel = keep.sel || ns.sel;
    ns.settings = keep.settings || ns.settings;
    return ns;
  }
  // server answer. Returns {state: true} when c.S was replaced.
  c.apply = function (resp) {
    const inf = c.inflight;
    c.inflight = null;
    if (!resp || typeof resp !== 'object') return { state: false };
    if (resp.seq !== undefined) c.seq = resp.seq;
    if (resp.ok === false) {
      if (resp.state) {
        // stale / clock violation: the server wins, pending actions are dropped
        c.S = adopt(resp.state);
        c.queue = [];
        c.lastTk = c.S.tk;
        c.stats.stale++;
        return { state: true, dropped: true, err: resp.err };
      }
      if (inf) { c.inflight = inf; c.fail(); }
      return { state: false, err: resp.err };
    }
    if (resp.state) {
      const ns = adopt(resp.state);
      const flightTail = Math.round(c.S.tk - c.lastTk);
      c.stats.replayFails += EN.replay(ns, c.queue, flightTail);
      c.S = ns;
      c.lastTk = ns.tk - flightTail;
      c.stats.adopts++;
      return { state: true };
    }
    c.stats.same++;
    return { state: false };
  };

    const a = SKY_KEYS[i], b = SKY_KEYS[i + 1];
    if (f <= b[0]) {

      return { top: mixC(a[1], b[1], t), bot: mixC(a[2], b[2], t), dens: a[3] + (b[3] - a[3]) * t, night: f > 0.82 ? (f - 0.82) / 0.18 : 0 };

/* skyline (window-local columns) */
const WIN = { k0: 30, k1: 102, v0: 18, v1: 50 };
const SKYLINE = (() => {
  const w = WIN.k1 - WIN.k0 + 1;
  const far = new Array(w).fill(0), near = new Array(w).fill(0), farId = new Array(w).fill(0), nearId = new Array(w).fill(0);
  let x = 0, id = 1, s = 11;
  const rnd = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
  while (x < w) {
    const bw = 5 + Math.floor(rnd() * 7), bh = 8 + Math.floor(rnd() * 14);
    for (let i = 0; i < bw && x + i < w; i++) { far[x + i] = bh; farId[x + i] = id; }
    x += bw; id++;
  }
  x = 0;
  while (x < w) {
    const bw = 6 + Math.floor(rnd() * 8), bh = 3 + Math.floor(rnd() * 12);
    for (let i = 0; i < bw && x + i < w; i++) { near[x + i] = bh; nearId[x + i] = id; }

    const pts = [[94, 37], [97, 39], [100, 38], [103, 44], [105, 47]];
    for (let i = 0; i < pts.length - 1; i++) {
      const [ka, va] = pts[i], [kb, vb] = pts[i + 1];
      for (let k = ka; k <= kb; k++) wallPx(B, 'L', k, Math.round(va + ((vb - va) * (k - ka)) / (kb - ka)), PAL.grn);
    }
  } else if (d === 'palette') {
    // design: colour swatches + a painting
    box(92, 106, 36, 50, C('#fff8ec'), C('#ffd23f'));
    for (let k = 93; k <= 105; k++) for (let v = 37; v <= 49; v++) {
      const h = Math.hypot(k - 99, v - 43);
      if (h < 5) wallPx(B, 'L', k, v, h < 2.5 ? PAL.mag : PAL.cyan);
      else if (v < 40) wallPx(B, 'L', k, v, PAL.yel);
    }
    const sw = [PAL.red, PAL.org, PAL.yel, PAL.grn, PAL.cyan, PAL.blu, PAL.mag];
    sw.forEach((c, i) => { for (let v = 18; v <= 30; v++) { wallPx(B, 'L', 92 + i * 2, v, c); wallPx(B, 'L', 93 + i * 2, v, c); } });
  } else if (d === 'tv') {
    // marketing: a big screen with growth bars and a heart
    box(90, 107, 18, 48, C('#0a0c24'), C('#3a3f5a'));
    const bars = [6, 10, 8, 15, 21];
    bars.forEach((h, i) => { for (let v = 21; v < 21 + h; v++) { wallPx(B, 'L', 93 + i * 3, v, PAL.org); wallPx(B, 'L', 94 + i * 3, v, PAL.org); } });
    const heart = ['.11.11.', '1111111', '1111111', '.11111.', '..111..', '...1...'];
    heart.forEach((row, r) => [...row].forEach((ch, c) => { if (ch === '1') wallPx(B, 'L', 92 + c, 45 - r, PAL.red); }));
  } else if (d === 'invader') {
    // game dev: a pixel space invader poster
    box(91, 107, 16, 50, C('#03140f'), C('#2ee66b'));
    const inv = ['..1.....1..', '...1...1...', '..1111111..', '.11.111.11.', '11111111111', '1.1111111.1', '1.1.....1.1', '...11.11...'];
    inv.forEach((row, r) => [...row].forEach((ch, c) => { if (ch === '1') wallPx(B, 'L', 94 + c, 42 - r, PAL.grn); }));
    for (let k = 93; k <= 105; k += 2) wallPx(B, 'L', k, 22, PAL.cyan);
  } else if (d === 'trophy') {
    // CEO: a golden trophy in a frame and a gold-framed company portrait
    box(91, 107, 16, 50, C('#120e1c'), C('#ffd23f'));
    const cup = ['1111111', '1111111', '.11111.', '..111..', '...1...', '...1...', '..111..', '.11111.'];
    cup.forEach((row, r) => [...row].forEach((ch, c) => { if (ch === '1') wallPx(B, 'L', 96 + c, 44 - r, r < 2 ? C('#fff1a8') : PAL.yel); }));
    wallPx(B, 'L', 95, 43, PAL.yel); wallPx(B, 'L', 94, 42, PAL.yel); wallPx(B, 'L', 103, 43, PAL.yel); wallPx(B, 'L', 104, 42, PAL.yel);
    for (let k = 93; k <= 105; k++) wallPx(B, 'L', k, 24, PAL.yel);
  }
}

function drawFloor(B) {
  const N = SCN.N;
  // slab thickness
  const L = P(0, N, 0), Bt = P(N, N, 0), Rr = P(N, 0, 0);
  const T = 7;
  B.poly([L, Bt, [Bt[0], Bt[1] + T], [L[0], L[1] + T]], PAL.slab);
  B.poly([Bt, Rr, [Rr[0], Rr[1] + T], [Bt[0], Bt[1] + T]], shadeC(PAL.slab, 0.78));
  B.line(L[0], L[1] + 1, Bt[0], Bt[1] + 1, PAL.slabEdge);
  B.line(Bt[0], Bt[1] + 1, Rr[0], Rr[1] + 1, mixC(PAL.slabEdge, PAL.mag, 0.5));
  const kind = THEME.floor;
  if (kind === 'wood') {
    // parquet planks running along gx, staggered seams
    for (let j = 0; j < N * 3; j++) {
      const off = (j % 3) * 0.33;
      for (let i = -1; i < N; i++) {
        const a = Math.max(0, i + off), b = Math.min(N, i + 1 + off);
        if (b <= a) continue;
        const h = hash01(i * 13 + j * 7);
        isoQuad(B, a, j / 3, b, (j + 1) / 3, 0, mixC(PAL.floorA, PAL.floorB, h));
        const p = P(a, j / 3, 0), q = P(a, (j + 1) / 3, 0);
        B.line(p[0], p[1], q[0], q[1], PAL.grid);
      }
      const p = P(0, j / 3, 0), q = P(N, j / 3, 0);
      B.line(p[0], p[1], q[0], q[1], mixC(PAL.grid, PAL.floorA, 0.4));
    }
    return;
  }
  for (let i = 0; i < N; i++)
    for (let j = 0; j < N; j++) {
      let col = (i + j) & 1 ? PAL.floorA : PAL.floorB;
      if (kind === 'carpet') col = mixC(PAL.floorA, C('#000000'), hash01(i * 5 + j * 11) * 0.12);
      isoQuad(B, i, j, i + 1, j + 1, 0, col);
    }
  if (kind === 'carpet') {
    // soft fibre speckle, no grid
    for (let n = 0; n < 900; n++) {
      const gx = hash01(n * 3 + 1) * N, gy = hash01(n * 7 + 2) * N;
      const p = P(gx, gy, 0);
      B.blend(p[0], p[1], hash01(n) < 0.5 ? PAL.white : C('#000000'), 0.07);
    }
    return;
  }
  const gcol = kind === 'metal' ? mixC(PAL.floorB, PAL.grid, 0.35) : kind === 'marble' ? PAL.grid : mixC(PAL.floorB, PAL.grid, 0.55);
  for (let i = 0; i <= N; i++) {
    const a = P(i, 0, 0), b = P(i, N, 0), c = P(0, i, 0), d = P(N, i, 0);
    B.line(a[0], a[1], b[0], b[1], gcol);
    B.line(c[0], c[1], d[0], d[1], gcol);
  }
  if (kind === 'marble') {
    // thin grey veins across the stone
    for (let v = 0; v < 14; v++) {
      let gx = hash01(v * 5 + 3) * N, gy = hash01(v * 9 + 1) * N;
      for (let s = 0; s < 22; s++) {
        const p = P(gx, gy, 0);
        B.blend(p[0], p[1], C('#8a83b0'), 0.35);
        gx += 0.09 + (hash01(v * 31 + s) - 0.5) * 0.08; gy += (hash01(v * 17 + s * 3) - 0.5) * 0.12;
      }
    }
  } else if (kind === 'metal') {
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
      for (const [a, b] of [[0.15, 0.15], [0.85, 0.15], [0.15, 0.85], [0.85, 0.85]]) { const p = P(i + a, j + b, 0); B.px(p[0], p[1], C('#3a4560')); }
      if ((i * 3 + j) % 7 === 0) { const p = P(i + 0.5, j + 0.5, 0); B.glow(p[0], p[1], 5, PAL.grn, 0.12); }
    }
  }
}

function drawRug(B) {
  const r = THEME.rug, e1 = pc(r[2]), e2 = pc(r[3]);
  isoQuad(B, 3.9, 3.9, 8.3, 7.5, 0, C(r[0]));
  isoQuad(B, 4.1, 4.1, 8.1, 7.3, 0, C(r[1]));
  const a = P(3.9, 3.9, 0), b = P(8.3, 3.9, 0), c = P(8.3, 7.5, 0), d = P(3.9, 7.5, 0);
  B.line(a[0], a[1], b[0], b[1], e1);
  B.line(b[0], b[1], c[0], c[1], e2);
  B.line(c[0], c[1], d[0], d[1], e2);
  B.line(d[0], d[1], a[0], a[1], e1);
  if (THEME.id === 'f5') { // CEO rug: inner gold border
    const a2 = P(4.3, 4.3, 0), b2 = P(7.9, 4.3, 0), c2 = P(7.9, 7.1, 0), d2 = P(4.3, 7.1, 0);
    B.line(a2[0], a2[1], b2[0], b2[1], e1); B.line(b2[0], b2[1], c2[0], c2[1], e1); B.line(c2[0], c2[1], d2[0], d2[1], e1); B.line(d2[0], d2[1], a2[0], a2[1], e1);
  }
}

function drawBase(B, f) {
  // background
  for (let y = 0; y < B.h; y++) B.rect(0, y, B.w, 1, mixC(PAL.bg0, PAL.bg1, y / B.h));
  for (let i = 0; i < 70; i++) {
    const x = Math.floor(hash01(i * 3 + 1) * B.w), y = Math.floor(hash01(i * 5 + 2) * B.h);
    B.px(x, y, mixC(PAL.bg0, C('#6f7bd6'), 0.25 + hash01(i) * 0.4));
  }
  drawFloor(B);
  drawRug(B);
  drawWalls(B, f);
  // soft neon ambience on the floor
  B.glow(SCN.OX, SCN.OY + 70, 52, PAL[THEME.glow[0]], 0.10);
  B.glow(SCN.OX - 36, SCN.OY + 46, 40, PAL[THEME.glow[1]], 0.07);
}

function drawDesk(B, s) {
  const len = 2.0, dep = 1.0, H = 13;

  if (s.side === 'R') {
    // end panels
    isoBox(B, s.gx, s.gy, 0, 0.12, dep, H - 3, woodL, woodL, woodR);
    isoBox(B, s.gx + len - 0.12, s.gy, 0, 0.12, dep, H - 3, woodL, woodL, woodR);
    isoBox(B, s.gx, s.gy, 0, len, 0.08, H - 3, woodR, woodR, woodR); // modesty panel (back)
    isoBox(B, s.gx, s.gy, H - 3, len, dep, 3, woodT, woodL, woodR, PAL.woodE);
  } else {
    isoBox(B, s.gx, s.gy, 0, dep, 0.12, H - 3, woodL, woodL, woodR);
    isoBox(B, s.gx, s.gy + len - 0.12, 0, dep, 0.12, H - 3, woodL, woodL, woodR);
    isoBox(B, s.gx, s.gy, 0, 0.08, len, H - 3, woodR, woodR, woodR);
    isoBox(B, s.gx, s.gy, H - 3, dep, len, 3, woodT, woodL, woodR, PAL.woodE);

function drawMonitor(B, s, look, on, t, seed, kind, glowOn) {
  const w = 1.1, z0 = 15, z1 = 26;
  const bz = 13;
  if (s.side === 'R') {
    const cx = s.gx + 1.0, gyB = s.gy + 0.34;
    isoBox(B, cx - 0.09, gyB - 0.02, bz, 0.18, 0.14, 2, PAL.bezel, PAL.bezel, PAL.bezelR);
    isoBox(B, cx - w / 2, gyB - 0.06, z0, w, 0.1, z1 - z0, PAL.bezel, PAL.bezel, PAL.bezelR);
    const gyF = gyB + 0.04, x0 = cx - w / 2 + 0.07, x1 = cx + w / 2 - 0.07;
    faceGY(B, x0, x1, gyF, z0 + 1, z1 - 1, on ? C('#0a1230') : PAL.screenOff);
    if (on) screenContent(B, 'GY', x0, x1, gyF, z0 + 1, z1 - 1, look.screen, t, seed, kind);
    // keyboard
    isoBox(B, cx - 0.4, gyB + 0.32, bz, 0.8, 0.26, 1, C('#2b2f66'), C('#1a1d45'), C('#14163a'));
    if (glowOn) {
      const p = P(cx, gyB + 0.7, 14);
      B.glow(p[0], p[1], 12, look.screen, 0.14);
    }
  } else {
    const cy = s.gy + 1.0, gxB = s.gx + 0.34;
    isoBox(B, gxB - 0.02, cy - 0.09, bz, 0.14, 0.18, 2, PAL.bezel, PAL.bezel, PAL.bezelR);
    isoBox(B, gxB - 0.06, cy - w / 2, z0, 0.1, w, z1 - z0, PAL.bezel, PAL.bezel, PAL.bezelR);
    const gxF = gxB + 0.04, y0 = cy - w / 2 + 0.07, y1 = cy + w / 2 - 0.07;
    faceGX(B, y0, y1, gxF, z0 + 1, z1 - 1, on ? C('#0a1230') : PAL.screenOff);
    if (on) screenContent(B, 'GX', y0, y1, gxF, z0 + 1, z1 - 1, look.screen, t, seed, kind);
    isoBox(B, gxB + 0.32, cy - 0.4, bz, 0.26, 0.8, 1, C('#2b2f66'), C('#1a1d45'), C('#14163a'));
    if (glowOn) {
      const p = P(gxB + 0.7, cy, 14);
      B.glow(p[0], p[1], 12, look.screen, 0.14);
    }

}

function screenContent(B, plane, a0, a1, fixed, z0, z1, col, t, seed, kind) {
  const line = plane === 'GY' ? lineGY : lineGX;
  const step = Math.floor(t * 2.2);
  const span = a1 - a0;
  if (kind === 'mkt') {
    // bars
    for (let i = 0; i < 5; i++) {
      const hgt = 1.5 + hash01(seed * 7 + i * 13 + step) * (z1 - z0 - 3);
      const x0 = a0 + 0.08 + i * (span / 5.2), x1 = x0 + span / 8;
      if (plane === 'GY') faceGY(B, x0, x1, fixed, z0 + 0.6, z0 + 0.6 + hgt, i % 2 ? col : PAL.cyan);
      else faceGX(B, x0, x1, fixed, z0 + 0.6, z0 + 0.6 + hgt, i % 2 ? col : PAL.cyan);
    }
    return;
  }
  const rows = Math.max(2, Math.floor((z1 - z0) / 2));
  for (let i = 0; i < rows; i++) {
    const z = z1 - 1.2 - i * 2;
    if (z < z0 + 0.4) break;
    const len = (0.25 + hash01(seed * 11 + i * 17 + step * 3) * 0.7) * (span - 0.1);
    const ind = kind === 'prog' ? ((i + step) % 3) * 0.1 : 0;
    const c = kind === 'art' ? (i % 2 ? col : PAL.cyan) : kind === 'des' ? (i % 3 === 0 ? PAL.white : col) : i % 3 === 0 ? mixC(col, PAL.white, 0.5) : col;
    line(B, a0 + 0.05 + ind, a0 + 0.05 + ind + len, fixed, z, c);
  }
}

/* ============================================================
   HD characters (drawn at ×2 on the upscaled buffer): more pixels for faces, hair, clothes
   and motion. Each role has its own look: the coder in a hoodie, the artist with a bun
   and a pencil, the designer in headphones, the marketer with a ponytail and a blazer.
   ============================================================ */
// seated legs as small iso boxes (drawn with PS = 2): thighs on the seat, shins down to the floor, sneakers;
// dir = the way the person faces in grid units ([0,-1] right-wall desks, [-1,0] left-wall desks, [1,0] player)
const PANTS = { prog: '#2b4a8a', art: '#3a2a55', des: '#2a2e44', mkt: '#1e2240', you: '#232a5a', npc: '#262b66' };
function drawLegsHD(B, cx, cy, dir, pants, t, seed, tap) {
  const pc0 = C(pants), pT = shadeC(pc0, 1.25), pL = pc0, pR = shadeC(pc0, 0.7);
  const shoe = C('#f2f0ff'), shoeL = C('#c9c4ec'), shoeR = C('#9a94c8'), sole = C('#3a3f8a');
  const [dx, dy] = dir, px = -dy, py = dx; // perpendicular
  for (const side of [-1, 1]) {
    const o = side * 0.13, w = 0.15;
    const ox = cx + px * o, oy = cy + py * o;

/* ---------- life outside the window & small ambient touches ---------- */
function inGlass(k, v) { return k >= WIN.k0 + 2 && k <= WIN.k1 - 2 && v >= WIN.v0 + 1 && v <= WIN.v1 - 2; }
function glassPx(B, k, v, c, a) { if (inGlass(k, v)) { if (a === undefined) wallPx(B, 'R', k, v, c); else wallBlend(B, 'R', k, v, c, a); } }
function drawWindowLife(B, st, t) {
  const f = clampN(st.f || 0, 0, 1);
  const night = f > 0.8 || f < 0.04;
  const k0 = WIN.k0 + 2, k1 = WIN.k1 - 2, span = k1 - k0;
  // a plane crossing the sky, its light blinking
  {
    const P = 47, ph = (t % P) / P;
    if (ph < 0.55) {
      const k = Math.round(k1 - (ph / 0.55) * (span + 10));
      const v = 45 + Math.round(Math.sin(ph * 6) * 0.5);
      const body = night ? C('#9aa4d8') : C('#f4f6ff');
      for (let i = 0; i < 5; i++) glassPx(B, k + i, v, body);
      glassPx(B, k + 3, v + 1, body); glassPx(B, k + 2, v - 1, body); glassPx(B, k + 4, v + 1, body);
      if (Math.floor(t * 2.5) % 2) glassPx(B, k + 5, v, PAL.red);
      for (let i = 1; i < 10; i++) glassPx(B, k + 5 + i, v, PAL.white, 0.25 - i * 0.022); // contrail
    }
  }
  // birds by day, shooting stars by night
  if (!night) {
    const P = 29, ph = (t % P) / P;
    if (ph < 0.6) {
      const base = k0 + (ph / 0.6) * (span + 16) - 8;
      for (let b = 0; b < 3; b++) {
        const k = Math.round(base - b * 5), v = 38 + b * 2 + Math.round(Math.sin(t * 3 + b) * 1);
        const flap = Math.floor(t * 6 + b) % 2;
        const col = C('#1d1f4a');
        glassPx(B, k, v, col); glassPx(B, k - 1, v + flap, col); glassPx(B, k + 1, v + flap, col);
      }
    }
  } else {
    const P = 13, ph = (t % P) / P;
    if (ph < 0.12) {
      const q = ph / 0.12, k = Math.round(k0 + 12 + q * 40), v = Math.round(48 - q * 10);
      for (let i = 0; i < 6; i++) glassPx(B, k - i, v + Math.round(i / 4), PAL.white, 0.9 - i * 0.14);
    }
  }
  // rain on the glass while the rainy track plays
  if (st.rain) {
    for (let i = 0; i < 26; i++) {
      const k = k0 + Math.floor(hash01(i * 7 + 1) * span);
      const v = WIN.v1 - 2 - Math.floor(((t * (14 + hash01(i) * 10) + hash01(i * 3) * 40) % 34));
      glassPx(B, k, v, C('#bfe6ff'), 0.55); glassPx(B, k, v + 1, C('#bfe6ff'), 0.3);
    }
  }
}
// neon sign hum: now and then one word flickers
function drawNeonFlicker(B, t) {
  const w = Math.floor(t / 3.7) % wordsNow().length;
  const on = (t % 3.7) < 0.18 && Math.floor(t * 20) % 2 === 0;
  if (!on) return;
  const k0 = 22, k1 = 60;
  const word = wordsNow()[w][0];
  const tw = textWidth(word);
  const kk = k0 + 1 + Math.floor((k1 - k0 - 1 - tw) / 2);
  wallGlyphs(B, 'L', kk, 46 - w * 8 - 1, word, C('#1a1d4a'), null);
}
// golden dust floating in the window light by day
function drawDust(B, st, t) {
  const f = clampN(st.f || 0, 0, 1);
  if (f > 0.78) return;
  for (let i = 0; i < 14; i++) {
    const gx = 4.6 + hash01(i * 5) * 3.6, gy = 1.2 + hash01(i * 11) * 3.2;
    const z = 14 + ((t * (2 + hash01(i) * 3) + hash01(i * 2) * 30) % 30);
    const p = P(gx + Math.sin(t * 0.6 + i) * 0.15, gy, z);
    B.blend(p[0], p[1], C('#fff2c4'), 0.35 + 0.3 * Math.sin(t * 2 + i));
  }
}

/* ---------- dynamic layer ---------- */
function drawDynamic(B, st, t) {
  drawWindowLife(B, st, t);
  drawNeonFlicker(B, t);
  const items = st.items || {};
  const typingGlobal = !!st.working;
  const frame = Math.floor(t * 5) % 2;
  // clock hands (left wall)
  {
    const mins = Math.floor((st.f || 0) * 720) + 480;
    const hh = (mins / 60) % 12, mm = mins % 60;
    const kc = 82, vc = 38;
    const hand = (len, ang, col) => {
      for (let r = 0; r <= len; r++) wallPx(B, 'L', kc + Math.round(Math.sin(ang) * r), vc + Math.round(Math.cos(ang) * r), col);
    };
    hand(3, (hh / 12) * Math.PI * 2, PAL.white);
    hand(5, (mm / 60) * Math.PI * 2, PAL.mag);
  }
  const list = [];
  const add = (key, fn) => list.push({ key, fn });

  // stations
  const order = ['prog', 'art', 'des', 'mkt'];
  order.forEach((role, idx) => {
    const s = STATION[role];
    const info = (st.staff && st.staff[role]) || { lvl: 0, mood: 80 };
    const look = LOOK[role];
    const hired = info.lvl > 0;
    const key = (s.side === 'R' ? s.gx + 2 + s.chair[1] + 0.5 : s.gy + 2 + s.chair[0] + 0.5);
    add(key, () => {
      drawDesk(B, s);
      drawMonitor(B, s, look, hired, t, idx + 1, role, hired && typingGlobal);
      // mug
      if (s.side === 'R') isoBox(B, s.gx + 0.15, s.gy + 0.6, 13, 0.2, 0.2, 3, C('#ffffff'), C('#d9d9ff'), C('#aaaadd'));
      else isoBox(B, s.gx + 0.6, s.gy + 0.15, 13, 0.2, 0.2, 3, C('#ffffff'), C('#d9d9ff'), C('#aaaadd'));
      const chairAccent = items.chairs ? C('#22b8d6') : C('#3b3f99');
      drawChairParts(B, s, chairAccent);
      const a = P(s.chair[0], s.chair[1], 9);
      if (hired) {
        const badge = (BB) => {
          if (info.mood < 35) drawBadge(BB, a[0] + 8, a[1] - 22, 'warn', t);
          else if (st.turbo) drawBadge(BB, a[0] + 7, a[1] - 22, 'bolt', t);
          else if (!typingGlobal) drawBadge(BB, a[0] + 6, a[1] - 22, 'zz', t);
        };
        if (HDQ) {
          // a lower mesh backrest in HD so the shoulders and back of the worker show
          HDQ.push((H) => { PS = 2; drawLegsHD(H, s.chair[0], s.chair[1], s.side === 'R' ? [0, -1] : [-1, 0], PANTS[role], t, idx, typingGlobal); PS = 1; drawWorkerHD(H, a[0] * 2, a[1] * 2, look, role, typingGlobal, t, idx, info.mood); PS = 2; drawChairBack(H, s, shadeC(chairAccent, 0.6), 5.5); PS = 1; badge(up2(H)); });
        } else {
          drawWorkerBack(B, a[0], a[1], look, typingGlobal, frame, t);
          drawChairBack(B, s, chairAccent);
          badge(B);
        }
      } else {
        drawChairBack(B, s, chairAccent);
        if (st.canHire && st.canHire[role]) drawBadge(B, a[0], a[1] - 12, 'plus', t);
      }
    });
  });

  // player station (center)
  add(12.3, () => {
    const cx = 5.1, cy = 5.1;
    const chairAccent = items.chairs ? C('#22b8d6') : C('#3b3f99');
    isoQuad(B, cx - 0.5, cy - 0.5, cx + 0.5, cy + 0.5, 0, C('#241660'));
    isoBox(B, cx - 0.08, cy - 0.08, 0, 0.16, 0.16, 6, C('#252a66'), C('#1a1e4d'), C('#12163a'));
    // backrest (behind the player)
    isoBox(B, cx - 0.42, cy - 0.3, 9, 0.1, 0.6, 11, shadeC(chairAccent, 1.2), chairAccent, shadeC(chairAccent, 0.6));
    isoBox(B, cx - 0.36, cy - 0.36, 6, 0.72, 0.72, 3, chairAccent, shadeC(chairAccent, 0.78), shadeC(chairAccent, 0.6));
    const a = P(cx, cy, 9);
    const blink = (t % 4.2) > 4.0, typingP = typingGlobal || st.tapFlash > 0;
    const desk = (DB) => {
      const H = 13;
      isoBox(DB, 5.9, 4.4, 0, 0.1, 0.12, H - 3, PAL.woodL, PAL.woodL, PAL.woodR);
      isoBox(DB, 5.9, 6.52, 0, 1.2, 0.12, H - 3, PAL.woodL, PAL.woodL, PAL.woodR);
      isoBox(DB, 6.9, 4.4, 0, 0.1, 0.12, H - 3, PAL.woodL, PAL.woodL, PAL.woodR);
      isoBox(DB, 5.9, 4.4, H - 3, 1.2, 2.24, 3, PAL.woodT, PAL.woodL, PAL.woodR, PAL.woodE);
      // laptop (lid facing +gx)
      isoBox(DB, 6.05, 5.1, H, 0.45, 0.6, 1, C('#2b2f66'), C('#1a1d45'), C('#14163a'));
      isoBox(DB, 6.45, 5.1, H, 0.07, 0.6, 9, C('#3a3f8a'), C('#2a2e72'), C('#1d2058'));
      const lp = P(6.52, 5.4, H + 5);
      DB.rect(lp[0], lp[1], 2 * PS, PS, t % 1.6 < 0.9 ? PAL.cyan : PAL.mag);
      DB.glow(lp[0] - 9 * PS, lp[1] + 4 * PS, 14 * PS, PAL.cyan, 0.1);
      if (items.monitor2) drawMonitor2(DB, t);
      isoBox(DB, 6.1, 4.55, H, 0.2, 0.2, 3, C('#ffffff'), C('#d9d9ff'), C('#aaaadd'));
    };
    const cp = P(6.5, 6.1, 13);
    if (HDQ) {
      desk(B);
      HDQ.push((HB) => { PS = 2; drawLegsHD(HB, cx, cy, [1, 0], PANTS.you, t, 0, typingP); PS = 1; drawPlayerHD(HB, a[0] * 2, a[1] * 2, t, typingP, blink, st.tapFlash > 0); PS = 2; desk(HB); PS = 1; drawCatHD(HB, cp[0] * 2, cp[1] * 2, t); });
    } else {
      drawPlayerFront(B, a[0], a[1], t, typingP, frame, blink);
      desk(B);
      drawCat(B, cp[0], cp[1], t);
    }
  });

  // a courier walks around the office now and then (pure function of time)
  {
    const period = 34, ph = (t % period) / period;
    if (ph < 0.62) {
      const path = [[1.7, 8.35], [8.35, 8.35], [8.35, 3.2]];
      const q = ph / 0.62; // 0..1 along out-and-back
      const u = q < 0.5 ? q * 2 : (1 - q) * 2;
      const segA = Math.hypot(path[1][0] - path[0][0], path[1][1] - path[0][1]), segB = Math.hypot(path[2][0] - path[1][0], path[2][1] - path[1][1]);
      let d = u * (segA + segB), gx, gy;
      if (d < segA) { gx = path[0][0] + (path[1][0] - path[0][0]) * (d / segA); gy = path[0][1]; }
      else { d -= segA; gx = path[1][0]; gy = path[1][1] + (path[2][1] - path[1][1]) * (d / segB); }
      const pause = Math.abs(u - 1) < 0.04;
      add(gx + gy, () => {
        if (HDQ) { const p = P(gx, gy, 0); HDQ.push((H) => drawWalkerHD(H, p[0] * 2, p[1] * 2, t, pause)); }
        else drawWalker(B, gx, gy, pause ? 0 : Math.floor(t * 6) % 2, t, pause);
      });
    }
  }
  // the later hires at their own spots
  ['qa', 'snd', 'prod', 'cm'].forEach((role, i) => {
    const info = st.staff && st.staff[role];
    if (!info || info.lvl <= 0) return;
    const sp = STAND[role], look = LOOK[role];
    if (sp.pose === 'mix') add(sp.gx + sp.gy + 0.5, () => drawConsole(B, sp.gx, sp.gy, t));
    add(sp.gx + sp.gy, () => {
      const p = P(sp.gx, sp.gy, 0);
      if (HDQ) HDQ.push((H) => { drawStandHD(H, p[0] * 2, p[1] * 2, look, sp.pose, t, i * 1.7); if (sp.pose === 'mix') { PS = 2; drawConsole(H, sp.gx, sp.gy, t); PS = 1; } });
      else drawStandLow(B, p[0], p[1], look, sp.pose, t);
    });
  });
  // plants
  add(3.0, () => drawPlant(B, 0.55, 0.6, t, 1, true));
  add(20, () => drawPlant(B, 8.55, 0.6, t, 2, true));
  add(21, () => drawPlant(B, 0.6, 8.5, t, 3, true));
  if (items.coffee) add(2.6, () => drawCoffee(B, t));
  if (items.rack) add(3.1, () => drawRack(B, t));
  if (items.lamp) add(9.9, () => drawLamp(B, t));
  if (items.lounge) add(14.5, () => drawLounge(B, t));

  list.sort((a, b) => a.key - b.key);
  for (const o of list) o.fn();
  drawDust(B, st, t);
  drawParticles(B, st, t);
}

function drawWalker(B, gx, gy, frame, t, pause) {
  const p = P(gx, gy, 0);

/* ---------- ambient particles (pure function of time → no state) ---------- */
function drawParticles(B, st, t) {
  const cols = [PAL.cyan, PAL.mag, PAL.yel, PAL.grn];
  if (ERA && ERA.id === 'tokyo') { // cherry petals drifting through the office
    for (let i = 0; i < 16; i++) {
      const sp = 9 + hash01(i * 5) * 7, x = Math.round(((hash01(i * 13) * B.w + t * sp * 0.9) % (B.w + 20)) - 10 + Math.sin(t * 1.3 + i) * 4);
      const y = Math.round((hash01(i * 7 + 2) * B.h + t * sp) % B.h);
      const c = i % 3 ? C('#ffb0d8') : C('#ffd8ec');
      B.px(x, y, c); if ((Math.floor(t * 3) + i) % 2) B.px(x + 1, y, shadeC(c, 0.85));
    }
  }
  // code bits rising from the screens of employees who are working
  if (st.working) {
    ['prog', 'art', 'des', 'mkt'].forEach((role, ri) => {
      const info = st.staff && st.staff[role];
      if (!info || info.lvl <= 0) return;
      const s = STATION[role];
      const base = s.side === 'R' ? P(s.gx + 0.6, s.gy + 0.4, 24) : P(s.gx + 0.4, s.gy + 0.6, 24);
      const n = st.turbo ? 4 : 2;
      for (let i = 0; i < n; i++) {
        const ph = (t * (0.5 + 0.1 * i) + hash01(ri * 17 + i * 5)) % 1;
        const x = base[0] + Math.round((hash01(ri * 31 + i * 11 + Math.floor(t * 0.5 + i)) - 0.5) * 10);
        const y = base[1] - Math.round(ph * 20);
        const c = cols[(ri + i) % 4];
        B.blend(x, y, c, 1 - ph);
        B.blend(x + 1, y, c, (1 - ph) * 0.7);
        if (i % 2 === 0) B.blend(x, y - 1, c, (1 - ph) * 0.5);
      }
    });
  }
  // hype: golden coins float up across the floor
  if (st.hype) {
    for (let i = 0; i < 7; i++) {
      const ph = (t * 0.35 + hash01(i * 23)) % 1;
      const g = P(1 + hash01(i * 7) * 7, 1 + hash01(i * 13) * 7, Math.round(ph * 40));
      B.blend(g[0], g[1], PAL.yel, 1 - ph);
      B.blend(g[0] + 1, g[1], C('#c8841a'), 1 - ph);
      B.blend(g[0], g[1] + 1, C('#c8841a'), 1 - ph);
      B.blend(g[0] + 1, g[1] + 1, PAL.yel, (1 - ph) * 0.8);
    }
  }
  // tap: sparks around the founder's laptop
  if (st.tapFlash > 0) {
    const a = P(6.3, 5.4, 18);
    const k = st.tapFlash / 0.5;
    for (let i = 0; i < 6; i++) {
      const ang = i * 1.047 + t * 3;
      const r = 4 + (1 - k) * 10;
      B.blend(a[0] + Math.round(Math.cos(ang) * r), a[1] + Math.round(Math.sin(ang) * r * 0.6), cols[i % 4], k);
    }
    B.glow(a[0], a[1], 10, PAL.cyan, 0.25 * k);
  }
  // dust motes drifting in the window light
  for (let i = 0; i < 8; i++) {
    const ph = (t * 0.05 + hash01(i * 41)) % 1;
    const x = 140 + Math.round(hash01(i * 3) * 100 + Math.sin(t * 0.7 + i) * 3);
    const y = 40 + Math.round(ph * 70);
    B.blend(x, y, PAL.white, 0.25 * Math.sin(ph * Math.PI));
  }
}

/* ---------- scene object ---------- */
/* ============================================================
   HD pass: the room is drawn at 256×176, then upscaled ×2 with Scale2x (EPX) so diagonals
   and round shapes get smooth pixel-art edges, and lit: soft light from monitors, the window,
   lamps and neon, contact shadows, a vignette and a colour grade per office theme.
   ============================================================ */
function scale2x(S, D) {
  const w = S.w, h = S.h, s = S.d, d = D.d, W = D.w;
  for (let y = 0; y < h; y++) {
    const row = y * w, up = (y > 0 ? y - 1 : y) * w, dn = (y < h - 1 ? y + 1 : y) * w, o0 = 2 * y * W, o1 = o0 + W;
    for (let x = 0; x < w; x++) {
      const P0 = s[row + x], A = s[up + x], D0 = s[dn + x], Cl = s[row + (x > 0 ? x - 1 : x)], B0 = s[row + (x < w - 1 ? x + 1 : x)];
      const X = 2 * x;
      if (Cl !== B0 && A !== D0) {
        d[o0 + X] = Cl === A ? A : P0;
        d[o0 + X + 1] = A === B0 ? B0 : P0;
        d[o1 + X] = D0 === Cl ? Cl : P0;
        d[o1 + X + 1] = B0 === D0 ? D0 : P0;
      } else { d[o0 + X] = d[o0 + X + 1] = d[o1 + X] = d[o1 + X + 1] = P0; }
    }
  }
}
// light map (×2 resolution, values ~0..1.6): rebuilt only when the theme, hour or furniture change
function buildLight(L, W, H, st) {
  const sky = skyAt(st.f || 0), night = sky.night, day = 1 - Math.abs((st.f || 0) - 0.45) * 1.6;
  const amb = 0.62 + 0.22 * clampN(day, 0, 1) - 0.12 * night;
  L.fill(amb);
  const add = (cx, cy, rx, ry, k) => {
    const x0 = Math.max(0, Math.floor(cx - rx)), x1 = Math.min(W - 1, Math.ceil(cx + rx)), y0 = Math.max(0, Math.floor(cy - ry)), y1 = Math.min(H - 1, Math.ceil(cy + ry));
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const dx = (x - cx) / rx, dy = (y - cy) / ry, q = 1 - (dx * dx + dy * dy); if (q <= 0) continue;
      L[y * W + x] += k * q * q;
    }
  };
  const P2 = (gx, gy, z) => { const p = P(gx, gy, z); return [p[0] * 2, p[1] * 2]; };
  // daylight through the window, falling on the floor near the right wall
  const w = wallXY('R', 66, 34);
  add(w[0] * 2, w[1] * 2, 170, 70, 0.32 * clampN(day, 0.15, 1) * (1 - night * 0.8));
  { const f = P2(5.2, 1.8, 0); add(f[0], f[1], 150, 60, 0.26 * clampN(day, 0, 1) * (1 - night)); }
  // desk monitors and the player's laptop
  for (const role of ['prog', 'art', 'des', 'mkt']) {
    const sn = STATION[role], hired = st.staff && st.staff[role] && st.staff[role].lvl > 0;
    const m = sn.side === 'R' ? P2(sn.gx + 1.0, sn.gy + 0.9, 16) : P2(sn.gx + 0.9, sn.gy + 1.0, 16);
    add(m[0], m[1], 64, 40, hired ? 0.26 + 0.18 * night : 0.06);
  }
  { const l = P2(6.2, 5.3, 16); add(l[0], l[1], 70, 44, 0.24 + 0.2 * night); }
  // neon words on the left wall and the strip lights
  { const n = wallXY('L', 40, 34); add(n[0] * 2, n[1] * 2, 110, 80, 0.16 + 0.22 * night); }
  if (st.items && st.items.lamp) { const l = P2(1.2, 6.8, 24); add(l[0], l[1], 120, 80, 0.3 + 0.25 * night); }
  if (st.items && st.items.coffee) { const c = P2(1.1, 1.2, 14); add(c[0], c[1], 60, 36, 0.14 + 0.12 * night); }
  // vignette
  const cx = W / 2, cy = H * 0.52;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const dx = (x - cx) / (W * 0.62), dy = (y - cy) / (H * 0.62);
    L[y * W + x] *= 1 - 0.42 * Math.min(1, dx * dx + dy * dy);
  }
}
function applyLight(D, L, tint) {
  const d = D.d, n = d.length, tr = cR(tint) / 255, tg = cG(tint) / 255, tb = cB(tint) / 255;
  for (let i = 0; i < n; i++) {
    const c = d[i], l = L[i];
    let r = c & 255, g = (c >> 8) & 255, b = (c >> 16) & 255;
    // bright pixels (screens, neon, lamps) glow on their own: light them less
    const lum = (r * 3 + g * 6 + b) / 2550, self = lum > 0.62 ? (lum - 0.62) * 2.2 : 0;
    const k = l + (1 - l) * Math.min(1, self);
    // shadows lean towards the theme's accent colour, lights towards warm white
    const sh = l < 1 ? (1 - l) * 0.18 : 0;
    r = r * k + 255 * tr * sh * 0.35; g = g * k + 255 * tg * sh * 0.35; b = b * k + 255 * tb * sh * 0.35;
    if (l > 1) { const h = (l - 1) * 40; r += h; g += h * 0.9; b += h * 0.75; }
    d[i] = (0xff000000 | ((b > 255 ? 255 : b) << 16) | ((g > 255 ? 255 : g) << 8) | (r > 255 ? 255 : r)) >>> 0;
  }
}

function createScene() {
  const frame = new Buf(SCN.W, SCN.H), base = new Buf(SCN.W, SCN.H);
  const hi = new Buf(SCN.W * 2, SCN.H * 2), light = new Float32Array(SCN.W * 2 * SCN.H * 2);
  let baseKey = -1, lightKey = '';
  return {
    W: SCN.W,
    H: SCN.H,
    frame,
    hi,
    renderHD(st, t) {
      const q = [];
      HDQ = q;
      try { this.render(st, t); } finally { HDQ = null; }
      scale2x(frame, hi);
      for (const fn of q) { try { fn(hi); } finally { PS = 1; } }
      const lk = eraIndex(st.legacy) + ':' + themeTier(st.floors) + ':' + Math.round((st.f || 0) * 48) + ':' + JSON.stringify(st.items || {}) + ':' + ['prog', 'art', 'des', 'mkt'].map((r) => (st.staff && st.staff[r] && st.staff[r].lvl > 0 ? 1 : 0)).join('');
      if (lk !== lightKey) { buildLight(light, hi.w, hi.h, st); lightKey = lk; }
      applyLight(hi, light, PAL[THEME.glow[0]] || PAL.cyan);
      return hi;
    },
    render(st, t) {
      const tier = themeTier(st.floors), era = eraIndex(st.legacy);
      const fk = Math.round(clampN(st.f || 0, 0, 1) * 120);
      const key = era * 100000 + tier * 1000 + fk;
      if (key !== baseKey) {
        applyTheme(tier); applyEra(st.legacy);
        drawBase(base, fk / 120);
        baseKey = key;
      }
      applyTheme(tier); applyEra(st.legacy);
      frame.d.set(base.d);
      drawDynamic(frame, st, t || 0);
      return frame;
    },
  };
}

function drawPortrait(B, kind, mood) {

  const bgA = { prog: '#0e2b4a', art: '#3a0f45', des: '#3d3208', mkt: '#0f2c52', you: '#101a5a', boss: '#2a2308', inv: '#0b3a2a', npc: '#26104a', qa: '#0b3a1e', snd: '#22104a', prod: '#1a1a3a', cm: '#3a1a08' }[kind] || '#101a5a';
  const bgB = { prog: '#1a7a8f', art: '#b02a96', des: '#a8761a', mkt: '#2a6fcf', you: '#2a4be0', boss: '#a8761a', inv: '#1f9a6a', npc: '#7a3ad0', qa: '#1fae5a', snd: '#7a3ad0', prod: '#c9a640', cm: '#e06a2a' }[kind] || '#2a4be0';

  const cx = Math.floor(W / 2);

  B.rect(cx - 7, H - 8, 14, 1, shadeC(shirt, 1.15));
  B.rect(cx - 2, H - 8, 4, 3, shadeC(skin, 0.85));
  if (kind === 'you') B.rect(cx - 1, H - 7, 2, 5, PAL.white);
  if (kind === 'boss') { B.rect(cx - 1, H - 8, 2, 7, PAL.red); B.rect(cx - 2, H - 8, 4, 1, PAL.white); }
  if (kind === 'inv') B.rect(cx - 2, H - 8, 4, 1, PAL.white);

    B.rect(cx - 4, 5, 3, 3, hair);
  } else if (L.style === 'spiky') {
    B.rect(cx - 6, 4, 12, 4, hair);
    B.rect(cx - 5, 2, 2, 2, hair); B.rect(cx - 1, 1, 2, 3, hair); B.rect(cx + 3, 2, 2, 2, hair);
    B.rect(cx - 6, 7, 2, 3, hair); B.rect(cx + 4, 7, 2, 3, hair);
  } else {
    B.rect(cx - 6, 3, 12, 5, hair);
    B.rect(cx - 6, 7, 2, 3, hair); B.rect(cx + 4, 7, 2, 3, hair);
  }
  if (kind === 'you') { B.rect(cx - 7, 8, 1, 6, PAL.cyan); B.rect(cx + 6, 8, 1, 6, PAL.cyan); B.rect(cx - 6, 2, 12, 1, PAL.cyan); }
  // face
  const m = mood === undefined ? 80 : mood;
  B.rect(cx - 3, 10, 2, 2, PAL.white); B.rect(cx + 1, 10, 2, 2, PAL.white);
  B.rect(cx - 2, 10, 1, 2, PAL.ink); B.rect(cx + 2, 10, 1, 2, PAL.ink);
  if (m >= 60) { B.rect(cx - 2, 14, 4, 1, C('#5a2a1a')); B.px(cx - 3, 13, C('#5a2a1a')); B.px(cx + 2, 13, C('#5a2a1a')); }
  else if (m >= 35) B.rect(cx - 2, 14, 4, 1, C('#5a2a1a'));
  else { B.rect(cx - 2, 13, 4, 1, C('#5a2a1a')); B.px(cx - 3, 14, C('#5a2a1a')); B.px(cx + 2, 14, C('#5a2a1a')); }
  B.px(cx - 4, 13, mixC(skin, C('#ff6fa0'), 0.35)); B.px(cx + 3, 13, mixC(skin, C('#ff6fa0'), 0.35));
  if (kind === 'prog') { // glasses
    B.rect(cx - 4, 9, 4, 1, PAL.cyan); B.rect(cx, 9, 4, 1, PAL.cyan); B.rect(cx - 4, 12, 4, 1, PAL.cyan); B.rect(cx, 12, 4, 1, PAL.cyan);
  }
  if (kind === 'qa') { B.rect(cx - 6, 3, 12, 2, PAL.grn); B.rect(cx - 7, 4, 3, 1, PAL.grn); B.rect(cx - 4, H - 4, 8, 3, C('#1a1d45')); B.px(cx - 3, H - 3, PAL.red); B.px(cx + 2, H - 3, PAL.cyan); } // cap + gamepad
  if (kind === 'snd') { B.rect(cx - 7, 7, 2, 6, C('#1a1e4d')); B.rect(cx + 5, 7, 2, 6, C('#1a1e4d')); B.rect(cx - 6, 2, 12, 1, C('#b48cff')); B.px(cx - 7, 9, C('#b48cff')); B.px(cx + 6, 9, C('#b48cff')); } // studio headphones
  if (kind === 'prod') { B.rect(cx - 1, H - 8, 2, 7, PAL.yel); B.rect(cx - 4, 10, 3, 1, PAL.ink); B.rect(cx + 1, 10, 3, 1, PAL.ink); } // tie + sunglasses
  if (kind === 'cm') { B.rect(cx + 5, 8, 2, 5, C('#2a2e44')); B.px(cx + 5, 9, PAL.cyan); B.rect(cx - 6, 3, 3, 2, PAL.yel); } // phone at the ear + hair clip
}

const GENRE_ART = {
  rpg: { a: '#2a0f5a', b: '#ff3fd0' },
  plat: { a: '#0f3a7a', b: '#22e6ff' },
  shoot: { a: '#3a0f1a', b: '#ff4d6a' },
  sim: { a: '#0f4a3a', b: '#2ee66b' },
  horror: { a: '#14102a', b: '#8a5cff' },
  puzzle: { a: '#4a3a0f', b: '#ffd23f' },
};
function drawCover(B, genre, seed) {
  const g = GENRE_ART[genre] || GENRE_ART.rpg;
  const W = B.w, H = B.h;
  const A = C(g.a), Bc = C(g.b);
  for (let y = 0; y < H; y++) B.rect(0, y, W, 1, mixC(A, Bc, (y / H) * 0.7));
  const r = (n) => hash01(seed * 31 + n);
  // ground silhouette
  const gy = Math.floor(H * 0.72);
  B.rect(0, gy, W, H - gy, shadeC(A, 0.45));
  B.rect(0, gy, W, 1, Bc);
  if (genre === 'rpg') {
    B.rect(Math.floor(W * 0.3), Math.floor(H * 0.35), Math.floor(W * 0.4), gy - Math.floor(H * 0.35), shadeC(A, 0.4));
    B.rect(Math.floor(W * 0.3), Math.floor(H * 0.3), 3, 4, shadeC(A, 0.4));
    B.rect(Math.floor(W * 0.5) - 1, Math.floor(H * 0.3), 3, 4, shadeC(A, 0.4));
    B.rect(Math.floor(W * 0.7) - 3, Math.floor(H * 0.3), 3, 4, shadeC(A, 0.4));
    B.rect(Math.floor(W * 0.46), Math.floor(H * 0.55), 4, gy - Math.floor(H * 0.55), C('#ffd23f'));
  } else if (genre === 'plat') {
    B.rect(Math.floor(W * 0.1), Math.floor(H * 0.55), Math.floor(W * 0.3), 2, PAL.yel);
    B.rect(Math.floor(W * 0.55), Math.floor(H * 0.42), Math.floor(W * 0.3), 2, PAL.yel);
    B.rect(Math.floor(W * 0.25), gy - 6, 4, 6, PAL.white);
    B.rect(Math.floor(W * 0.25) + 1, gy - 8, 2, 2, PAL.white);
  } else if (genre === 'shoot') {
    const cx = Math.floor(W / 2), cy = Math.floor(H * 0.42);
    B.rect(cx - 7, cy, 5, 1, PAL.white); B.rect(cx + 3, cy, 5, 1, PAL.white); B.rect(cx, cy - 7, 1, 5, PAL.white); B.rect(cx, cy + 3, 1, 5, PAL.white);
    B.rect(cx - 1, cy - 1, 3, 3, PAL.red);
  } else if (genre === 'sim') {
    for (let i = 0; i < 4; i++) {
      const bw = Math.floor(W / 6), bh = 6 + Math.floor(r(i) * 14);
      B.rect(Math.floor(W * 0.08) + i * (bw + 1), gy - bh, bw, bh, shadeC(Bc, 0.5 + r(i + 9) * 0.5));
      B.px(Math.floor(W * 0.08) + i * (bw + 1) + 2, gy - bh + 2, PAL.yel);
    }
  } else if (genre === 'horror') {
    B.glow(Math.floor(W * 0.7), Math.floor(H * 0.25), 9, PAL.white, 0.6);
    B.rect(Math.floor(W * 0.7) - 3, Math.floor(H * 0.25) - 3, 7, 7, C('#e9e6ff'));
    B.rect(Math.floor(W * 0.28), gy - 12, 8, 12, C('#cfcaf5'));
    B.rect(Math.floor(W * 0.28) + 2, gy - 9, 1, 2, PAL.ink); B.rect(Math.floor(W * 0.28) + 5, gy - 9, 1, 2, PAL.ink);
  } else {
    const cols = [PAL.mag, PAL.cyan, PAL.yel, PAL.grn];
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
      const bs = Math.floor(W / 5);
      B.rect(Math.floor(W * 0.18) + i * (bs + 1), Math.floor(H * 0.2) + j * (bs + 1), bs, bs, cols[Math.floor(r(i * 3 + j) * 4)]);

function drawTower(B, floorsOwned, t, build, flv) {
  // build: {row, k, reno} — the floor being built or renovated (row 0 = f5 … 4 = f1, 5 = basement), k 0..1 progress
  // front-facing tower. floorsOwned: {b,f1..f5}; flv: renovation stars per floor. 80x124
  const W = B.w, H = B.h;

  }

  const ownedList = ids.map((id) => floorsOwned[id]);
  const accents = [PAL.yel, PAL.cyan, PAL.mag, PAL.grn, PAL.blu];
  const allStars = ['b', 'f1', 'f2', 'f3', 'f4', 'f5'].reduce((n, id) => n + (lv[id] || 0), 0);
  // searchlights once the top floor is open
  if (floorsOwned.f5) {
    for (let k = 0; k < 2; k++) {
      const ang = Math.sin(t * 0.7 + k * 2.4) * 0.6 + (k ? 0.5 : -0.5);
      const ox = bx + Math.floor(bw / 2) + (k ? 6 : -6), oy = topY - 8;
      for (let d = 2; d < 40; d++) {
        const x = Math.round(ox + Math.sin(ang) * d), y = Math.round(oy - Math.cos(ang) * d);
        if (y < 0) break;
        B.blend(x, y, k ? PAL.cyan : PAL.mag, 0.22 * (1 - d / 40));

    }
  }
  for (let r = 0; r < rows; r++) {
    const y = topY + r * fh;
    const id = ids[r];
    const st = lv[id] || 0;
    const building = build && build.row === r && !build.reno;
    const renoing = build && build.row === r && build.reno;
    const own = building ? build.k >= 0.15 : !!ownedList[r];
    const shownSt = renoing ? Math.max(0, st - (build.k < 0.8 ? 1 : 0)) : st;
    B.rect(bx, y, bw, fh, own ? (shownSt >= 3 ? C('#24338a') : C('#1d2a73')) : C('#10143a'));
    B.rect(bx, y, bw, 1, own ? accents[r] : C('#262b66'));
    B.rect(bx, y, 1, fh, C('#0a0d2c')); B.rect(bx + bw - 1, y, 1, fh, C('#0a0d2c'));
    for (let w = 0; w < 5; w++) {
      const wx = bx + 4 + w * 9, wy = y + 4;
      let col = C('#161a4a');
      if (building && build.k < 0.15 + (w + 1) * 0.15) { B.rect(wx, wy, 7, 8, C('#161a4a')); continue; }
      if (own) {
        const h = hash01(r * 17 + w * 5);
        col = h < 0.34 ? PAL.cyan : h < 0.67 ? PAL.mag : PAL.yel;
        // renovated floors are busier: fewer dark windows
        if (hash01(r * 3 + w + Math.floor(t * 0.5)) < 0.12 - shownSt * 0.02) col = mixC(col, C('#161a4a'), 0.6);
      }

      if (own) B.rect(wx, wy + 7, 7, 1, shadeC(col, 0.6));
    }
    if (own && shownSt >= 3) {
      // people walking past the windows
      for (let p = 0; p < (shownSt >= 5 ? 2 : 1); p++) {
        const span = 44, px = bx + 4 + Math.floor((t * (5 + p * 3) + r * 13 + p * 20) % span);
        const dir = Math.floor((t * (5 + p * 3) + r * 13 + p * 20) / span) % 2;
        const x = dir ? bx + 4 + span - (px - bx - 4) : px;
        B.rect(x, y + 7, 2, 5, C('#0b0e30'));
        B.rect(x, y + 6, 2, 1, C('#0b0e30'));
      }
    }
    if (own && shownSt >= 2) {
      // neon trim under the floor, breathing
      const a = 0.55 + 0.45 * Math.sin(t * 2 + r);
      for (let i = 1; i < bw - 1; i++) B.blend(bx + i, y + fh - 1, accents[r], a);
    }
    if (own && shownSt >= 4) {
      // blinking side sign
      const on = Math.floor(t * 2 + r) % 3 !== 0;
      B.rect(bx + bw, y + 3, 2, fh - 6, on ? accents[(r + 2) % 5] : C('#2a2f66'));
      if (on) B.glow(bx + bw + 1, y + Math.floor(fh / 2), 3, accents[(r + 2) % 5], 0.35);
    }
    if (own && shownSt >= 5) {
      B.rect(bx, y, bw, 1, PAL.yel);
      if (hash01(Math.floor(t * 3) + r * 7) > 0.8) B.glow(bx + 2 + Math.floor(hash01(Math.floor(t * 3) + r) * (bw - 4)), y + 2, 3, PAL.yel, 0.8);
    }

      B.rect(bx - 3, y, 1, fh, C('#c8841a')); B.rect(bx + bw + 2, y, 1, fh, C('#c8841a'));
      const sx = bx + Math.floor(hash01(Math.floor(t * 12)) * bw), sy = y + Math.floor(hash01(Math.floor(t * 12) + 7) * fh);
      B.glow(sx, sy, 4, PAL.yel, 0.9);
    }
    if (renoing && build.k < 1) {
      // a sweep of light across the renovated floor, sparkles behind it
      const sx = bx + Math.floor(build.k * bw);
      for (let yy = y; yy < y + fh; yy++) { B.blend(sx, yy, C('#ffffff'), 0.85); B.blend(sx - 1, yy, PAL.yel, 0.6); B.blend(sx - 2, yy, PAL.yel, 0.3); }
      for (let i = 0; i < 3; i++) {
        const gx = bx + Math.floor(hash01(Math.floor(t * 14) + i * 5) * Math.max(1, sx - bx)), gy = y + Math.floor(hash01(Math.floor(t * 14) + i * 9 + 3) * fh);
        B.glow(gx, gy, 3, i % 2 ? PAL.yel : PAL.cyan, 0.85);
      }
    }
    if (!own && !building) {
      // lock
      const lx = bx + Math.floor(bw / 2) - 3, ly = y + 5;
      B.rect(lx, ly + 3, 7, 6, C('#5b63c7'));
      B.rect(lx + 1, ly, 5, 3, C('#5b63c7')); B.rect(lx + 2, ly + 1, 3, 2, C('#10143a'));
      B.rect(lx + 3, ly + 5, 1, 2, C('#10143a'));
    }
  }
  // elevator running between the open floors
  const ownedRows = [];
  for (let r = 0; r < rows; r++) if (ownedList[r]) ownedRows.push(r);
  if (ownedRows.length >= 2) {
    const ex = bx + bw - 4;
    const top = topY + ownedRows[0] * fh + 3, bot = topY + (rows - 1) * fh + fh - 6;
    B.rect(ex, top, 2, bot - top + 4, C('#0d1140'));
    const ph = (Math.sin(t * 0.6) + 1) / 2;
    const ey = Math.round(top + (bot - top) * ph);
    B.rect(ex, ey, 2, 4, PAL.yel);
    B.blend(ex - 1, ey + 1, PAL.yel, 0.35); B.blend(ex + 2, ey + 1, PAL.yel, 0.35);
  }
  // roof
  B.rect(bx - 2, topY - 4, bw + 4, 4, C('#2a2f80'));
  B.rect(bx - 2, topY - 4, bw + 4, 1, floorsOwned.f5 ? PAL.yel : C('#4a50b0'));
  B.rect(bx + 10, topY - 8, bw - 20, 4, floorsOwned.f5 ? PAL.mag : C('#3a2060'));
  B.rect(bx + Math.floor(bw / 2), topY - 18, 1, 10, C('#8a90e0'));
  if (Math.floor(t * 1.4) % 2) B.rect(bx + Math.floor(bw / 2) - 1, topY - 20, 3, 3, PAL.red);
  if (allStars >= 30) {
    // "Tower legend": a golden crown on the roof and fireworks over the city
    const cx = bx + Math.floor(bw / 2);
    B.rect(cx - 6, topY - 12, 13, 3, PAL.yel);
    B.px(cx - 6, topY - 14, PAL.yel); B.px(cx - 6, topY - 13, PAL.yel); B.px(cx, topY - 15, PAL.yel); B.px(cx, topY - 14, PAL.yel); B.px(cx, topY - 13, PAL.yel); B.px(cx + 6, topY - 14, PAL.yel); B.px(cx + 6, topY - 13, PAL.yel);
    B.px(cx - 3, topY - 11, PAL.red); B.px(cx + 3, topY - 11, PAL.cyan);
    const fw = Math.floor(t / 1.6), fk = (t / 1.6) % 1;
    const fx = 8 + Math.floor(hash01(fw) * (W - 16)), fy = 6 + Math.floor(hash01(fw + 3) * 20);
    const fc = [PAL.mag, PAL.cyan, PAL.yel, PAL.grn][fw % 4];
    if (fk < 0.7) for (let i = 0; i < 8; i++) { const ang = (i / 8) * Math.PI * 2, d = 1 + fk * 9; B.blend(Math.round(fx + Math.cos(ang) * d), Math.round(fy + Math.sin(ang) * d), fc, 1 - fk); }
  }
  // ground
  B.rect(0, groundY, W, 4, C('#1b1f55'));
  B.rect(0, groundY, W, 1, PAL.cyan);

  const carX = Math.floor(((t * 9) % (W + 20)) - 10);
  B.rect(carX, groundY + 1, 6, 2, PAL.mag); B.px(carX + 6, groundY + 2, PAL.yel); B.px(carX - 1, groundY + 2, PAL.red);
  // basement
  const by = groundY + 4;
  B.rect(0, by, W, H - by, C('#120f2e'));
  const own = !!floorsOwned.b;
  const bst = lv.b || 0;
  const bReno = build && build.row === 5 && build.reno;
  const bShown = bReno ? Math.max(0, bst - (build.k < 0.8 ? 1 : 0)) : bst;
  B.rect(bx, by, bw, H - by, own ? C('#1a1650') : C('#0e0c26'));
  for (let i = 0; i < 4; i++) {
    const rx = bx + 4 + i * 12;
    B.rect(rx, by + 3, 9, H - by - 5, C('#262b66'));
    for (let l = 0; l < 4; l++) {
      const on = hash01(i * 5 + l + Math.floor(t * (2 + bShown) + i)) > 0.4 - bShown * 0.05;
      B.px(rx + 2, by + 6 + l * 4, own && on ? PAL.grn : C('#1a1d45'));
      B.px(rx + 5, by + 6 + l * 4, own && on ? PAL.cyan : C('#1a1d45'));
    }
  }
  for (let i = 0; i < bShown; i++) B.px(bx - 2, by + 3 + i * 3, PAL.yel);
  if (bReno && build.k < 1) {
    const sx = bx + Math.floor(build.k * bw);
    for (let yy = by; yy < H; yy++) { B.blend(sx, yy, C('#ffffff'), 0.85); B.blend(sx - 1, yy, PAL.yel, 0.5); }
  }
  // door
  B.rect(bx + Math.floor(bw / 2) - 3, groundY - 7, 6, 7, C('#0a0d2c'));
  if (floorsOwned.f1) B.rect(bx + Math.floor(bw / 2) - 3, groundY - 7, 6, 1, PAL.cyan);
}


/* ---- src/net.js ---- */
/* ============================================================
   OFFICE DREAMS — network layer
   online: Telegram auth + authoritative server sync (sync_client.js)
   demo:   everything local (artifact preview / opened outside Telegram
           without a server) — points are simulated, nothing is shared
   ============================================================ */
const TG = (typeof window !== 'undefined' && window.Telegram && window.Telegram.WebApp) || null;
let S = null; // the live game state (prediction in online mode)

const UIH = {}; // UI callbacks: onEco, onState, onChallenge, onGain, onStatus, onOffline, onRefAct, onDropped, onFatal

const NET = {
  mode: 'demo',
  cfg: null,
  token: '',
  me: null,
  eco: null,
  online: true,
  created: false,
  lastSync: 0,
  syncEvery: 12000,
  busy: false,
  sc: null,
  tp: { n: 0, mean: 0, m2: 0, last: 0 }, // statistics of ALL tap attempts since the last sync
  speed: 1, // demo only
  failures: 0,
  shopCache: null,

/* ---------- small helpers ---------- */
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
function muted(fn) {
  const h = hooks.emit;
  hooks.emit = function () {};
  try { return fn(); } finally { hooks.emit = h; }
}
function tgInitData() { return TG && TG.initData ? TG.initData : ''; }
function qs(name) {
  try { return new URLSearchParams(location.search).get(name); } catch (e) { return null; }
}
function fingerprint() {
  const parts = [];
  try {
    parts.push(screen.width + 'x' + screen.height + 'x' + (window.devicePixelRatio || 1));
    parts.push(Intl.DateTimeFormat().resolvedOptions().timeZone || '');
    parts.push(navigator.language || '', navigator.platform || '', navigator.hardwareConcurrency || 0, navigator.deviceMemory || 0);
    const cv = document.createElement('canvas');
    cv.width = 120; cv.height = 24;
    const c = cv.getContext('2d');
    c.textBaseline = 'top'; c.font = '14px Arial'; c.fillStyle = '#f60'; c.fillRect(0, 0, 60, 20);
    c.fillStyle = '#069'; c.fillText('OfficeDreams✓', 2, 2);
    const d = cv.toDataURL();
    let h = 0;
    for (let i = 0; i < d.length; i += 3) h = (h * 31 + d.charCodeAt(i)) | 0;
    parts.push(h);
  } catch (e) {}
  return parts.join('|').slice(0, 300);
}

/* ---------- HTTP ---------- */
async function http(method, path, body, opt) {

  const timer = ctl ? setTimeout(() => ctl.abort(), opt.timeout || 15000) : null;
  try {
    const headers = { 'content-type': 'application/json' };
    if (NET.token) headers.authorization = 'Bearer ' + NET.token;

      method, headers, body: body ? JSON.stringify(body) : undefined,
      signal: ctl ? ctl.signal : undefined, keepalive: !!opt.keepalive, credentials: 'omit', cache: 'no-store',

async function api(method, path, body) {

    if (await reauth()) r = await http(method, path, body);
  }
  setOnline(r.status !== 0);

}
function setOnline(v) {

  }
}
function setEco(eco) {

}

/* ---------- boot ---------- */
// returns {ok, mode} ; on fatal errors returns {ok:false, err}
async function netBoot(forceDemo) {
  if (forceDemo) return demoBoot();
  const cfgR = await http('GET', '/api/config', null, { timeout: 8000 });
  if (cfgR.status !== 200 || !cfgR.j || cfgR.j.v !== 2) {
    // no server next to the page: inside Telegram this is an outage, outside it is the demo
    if (tgInitData()) return { ok: false, err: 'server' };

}

    const hp = new URLSearchParams((location.hash || '').replace(/^#/, ''));
    const sp = (TG && TG.initDataUnsafe && TG.initDataUnsafe.start_param) || qs('tgWebAppStartParam') || hp.get('tgWebAppStartParam') || qs('startapp') || qs('start') || '';

  if (r.status === 0) return { ok: false, err: 'server' };
  if (!r.j || !r.j.ok || !r.j.token) return { ok: false, err: (r.j && r.j.err) || 'auth' };

    NET.sc.inflight = null;

    NET.sc.S = st;
    NET.sc.queue = [];
    NET.sc.inflight = null;
    NET.sc.lastTk = st.tk;
    NET.sc.seq = r.j.seq;

/* ---------- local preferences (not synced) ---------- */
function loadPrefs() {
  try { return JSON.parse(lsGet('od2_prefs') || '{}') || {}; } catch (e) { return {}; }
}
function savePrefs() {

  p.settings = S.settings;
  lsSet('od2_prefs', JSON.stringify(p));
}
function applyPrefs(st) {
  const p = loadPrefs();

/* ---------- actions ---------- */
function netAct(type) {
  const args = Array.prototype.slice.call(arguments, 1);
  if (NET.mode === 'online') {
    const r = NET.sc.act.apply(null, [type].concat(args));
    S = NET.sc.S;
    if (r.ok && type !== 'tap') NET.syncSoon = true;
    return r;
  }
  const r = applyAction(S, [type].concat(args));

// tap attempt statistics (sent to the server, used for bot detection)
function noteTapAttempt(trusted) {

  if (t.last) {
    const dt = now - t.last;
    if (dt >= 15 && dt <= 5000) {
      t.n++;
      const d = dt - t.mean;
      t.mean += d / t.n;
      t.m2 += d * (dt - t.mean);

  t.last = now;

// a text comment as a one-cell BOC (op 0 + utf8), base64 — what wallets show as "comment"
function commentBoc(text) {
  const t = new TextEncoder().encode(text);
  const data = new Uint8Array(4 + t.length);
  data.set(t, 4);
  const cell = new Uint8Array(2 + data.length);
  cell[0] = 0; cell[1] = data.length * 2;
  cell.set(data, 2);
  const head = [0xb5, 0xee, 0x9c, 0x72, 0x01, 0x01, 0x01, 0x01, 0x00, cell.length, 0x00];
  const out = new Uint8Array(head.length + cell.length);
  out.set(head, 0); out.set(cell, head.length);
  let bin = '';
  out.forEach((b) => { bin += String.fromCharCode(b); });
  return btoa(bin);
}

/* ---------- confetti (canvas, runs only while visible) ---------- */
const CONF = { parts: [], raf: 0, cv: null };
function confetti(n) {
  const cv = $('#confetti');
  if (!cv) return;
  CONF.cv = cv;
  const w = (cv.width = window.innerWidth), h = (cv.height = window.innerHeight);
  const cols = ['#ff3fd0', '#3fd0ff', '#ffd23f', '#34e37a', '#ffffff', '#8a5cff'];
  for (let i = 0; i < (n || 90); i++) {
    CONF.parts.push({
      x: w / 2 + (Math.random() - 0.5) * w * 0.3, y: h * 0.35,
      vx: (Math.random() - 0.5) * 9, vy: -6 - Math.random() * 8,
      s: 3 + Math.floor(Math.random() * 4), c: cols[i % cols.length], r: Math.random() * 6, life: 120 + Math.random() * 60,

}
function confStep() {
  const cv = CONF.cv, c = cv.getContext('2d');
  c.clearRect(0, 0, cv.width, cv.height);
  CONF.parts = CONF.parts.filter((p) => p.life > 0 && p.y < cv.height + 20);
  for (const p of CONF.parts) {
    p.vy += 0.28; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += 0.2; p.life--;
    c.fillStyle = p.c;
    const sw = Math.abs(Math.cos(p.r)) * p.s + 1;
    c.fillRect(Math.round(p.x), Math.round(p.y), Math.round(sw), p.s);

/* ---------- count-up numbers ---------- */
function countUp(el, to, dur, fmtF) {
  if (!el) return;
  const from = parseFloat(el.dataset.v || '0') || 0;
  el.dataset.v = String(to);
  if (Math.abs(to - from) < 0.05) { el.textContent = fmtF(to); return; }
  const t0 = performance.now();
  const step = (t) => {
    const k = Math.min(1, (t - t0) / (dur || 700));
    const e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmtF(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function copyText(text, cb) {
  const done = (ok) => cb && cb(ok);
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => done(fallbackCopy(text)));

    }

  done(fallbackCopy(text));
}

    ta.value = text;
    ta.setAttribute('readonly', '');

  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  for (let i = 0; i < len; i++) d[i] = rnd() * 2 - 1;

  for (let i = 0; i < vl; i++) {

    if (rnd() < 0.0006) x += (rnd() < 0.5 ? -1 : 1) * (0.4 + rnd() * 0.6);

  if (opt.vib) { // gentle vibrato for the melody
    const l = a.createOscillator(), lg = a.createGain();
    l.frequency.value = 5.2; lg.gain.value = freq * 0.006;
    l.connect(lg); lg.connect(o.frequency);
    l.start(t); l.stop(t + dur + 0.05);
  }
  o.start(t);
  o.stop(t + dur + 0.05);
}
// electric-piano-ish: sine body + quiet octave bell, slow decay
function mKey(m, t, dur, vol) {
  mNote(NOTE(m), t, dur, 'sine', vol, { att: 0.008 });
  mNote(NOTE(m + 12), t, dur * 0.45, 'triangle', vol * 0.18, { att: 0.004, detune: 4 });
}
function mKick(t, v) {
  const a = MUSIC.ctx;
  const o = a.createOscillator(), g = a.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(110, t);
  o.frequency.exponentialRampToValueAtTime(42, t + 0.14);
  g.gain.setValueAtTime(0.75 * v, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
  o.connect(g); g.connect(MUSIC.out);
  o.start(t); o.stop(t + 0.3);
}
function mNoise(t, dur, freq, vol, type, q) {
  const a = MUSIC.ctx;
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = MUSIC.noise;
  f.type = type || 'highpass';
  f.frequency.value = freq;
  if (q) f.Q.value = q;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(MUSIC.out);
  s.start(t, Math.random() * 0.6); s.stop(t + dur + 0.02);
}
function scheduleStep(tr, t) {
  const st = MUSIC.step % 16;
  const ch = tr.chords[MUSIC.bar % tr.chords.length];
  const tones = CHORD_TONES[ch[1]].map((x) => ch[0] + x);
  const tone = (i) => tones[i % tones.length] + 12 * Math.floor(i / tones.length);
  const s16 = 60 / tr.bpm / 4;
  const hum = () => 0.82 + Math.random() * 0.18; // human velocity
  // chords: lazy, slightly strummed stabs
  if (tr.comp[st]) {
    const dur = s16 * (tr.comp[st] === 2 ? 14 : 5);
    tones.forEach((m, i) => mKey(m + 12, t + i * 0.012, dur, 0.05 * hum()));
  }
  // melody arrives on the second pass so every track breathes in first
  const mel = tr.mel[Math.floor(MUSIC.bar / tr.chords.length) % tr.mel.length];
  if (MUSIC.loops > 0 && mel[st] !== null) mNote(NOTE(tone(mel[st]) + 24), t + 0.01, s16 * 3.2, 'sine', 0.085 * hum(), { vib: true, att: 0.02 });
  if (tr.bass[st] !== null) mNote(NOTE(tone(tr.bass[st]) - 12), t, s16 * 3, 'sine', 0.36, { att: 0.01 });
  if (tr.kick[st]) mKick(t, hum());
  if (tr.snare[st]) { mNoise(t + 0.015, 0.18, 1500, 0.16 * hum(), 'bandpass', 0.8); mNoise(t + 0.015, 0.08, 400, 0.05, 'lowpass'); }
  if (tr.hat[st]) mNoise(t, 0.035, 6500, (st % 4 === 2 ? 0.045 : 0.03) * hum(), 'highpass');
}
function musicTick() {
  if (!MUSIC.on || !MUSIC.ctx) return;
  const a = MUSIC.ctx;
  const tr = TRACKS[MUSIC.track];
  const s16 = 60 / tr.bpm / 4;
  if (MUSIC.next < a.currentTime) MUSIC.next = a.currentTime + 0.05;
  while (MUSIC.next < a.currentTime + 0.2) {
    const sw = MUSIC.step % 2 === 1 ? tr.swing * s16 : 0;
    scheduleStep(tr, MUSIC.next + sw);
    MUSIC.next += s16;
    MUSIC.step++;
    if (MUSIC.step % 16 === 0) {
      MUSIC.bar++;
      if (MUSIC.bar % tr.chords.length === 0) {
        MUSIC.loops++;
        if (MUSIC.loops >= 6) musicNext(true); // ~2–3 minutes per track, then the next one
      }
    }
  }
}
function musicStart() {
  if (MUSIC.on) return;
  ensureAudio();
  if (!musicInit()) return;
  MUSIC.on = true;
  MUSIC.next = MUSIC.ctx.currentTime + 0.1;
  startBed(TRACKS[MUSIC.track]);
  MUSIC.out.gain.cancelScheduledValues(MUSIC.ctx.currentTime);
  MUSIC.out.gain.setTargetAtTime(0.42, MUSIC.ctx.currentTime, 1.2); // slow fade in
  if (!MUSIC.timer) MUSIC.timer = setInterval(musicTick, 40);
}
function musicStop() {
  if (!MUSIC.on) return;
  MUSIC.on = false;
  if (MUSIC.out) MUSIC.out.gain.setTargetAtTime(0, MUSIC.ctx.currentTime, 0.2);
  if (MUSIC.timer) { clearInterval(MUSIC.timer); MUSIC.timer = 0; }
  setTimeout(() => { if (!MUSIC.on) { try { if (MUSIC.vinyl) MUSIC.vinyl.stop(); if (MUSIC.rain) MUSIC.rain.stop(); } catch (e) {} MUSIC.vinyl = MUSIC.rain = null; } }, 800);
}
function musicNext(auto) {
  MUSIC.track = (MUSIC.track + 1) % TRACKS.length;
  MUSIC.step = 0; MUSIC.bar = 0; MUSIC.loops = 0;
  if (MUSIC.on && MUSIC.ctx) startBed(TRACKS[MUSIC.track]);
  if (!auto && MUSIC.ctx) MUSIC.next = MUSIC.ctx.currentTime + 0.15;
}
// follow the player's preference; called after every user gesture and when the page is hidden/shown
function musicSync() {
  const want = !!(S && S.settings && S.settings.music !== false) && !document.hidden;
  if (want && UI.audio) musicStart();
  else if (!want) musicStop();
}

const TABS = [
  { id: 'office', ico: 'office' },
  { id: 'studio', ico: 'games' },
  { id: 'quests', ico: 'quest' },
  { id: 'empire', ico: 'empire' },

];
const SUBS = {
  studio: ['team', 'games'],
  drop: ['home', 'token', 'friends', 'tasks', 'top', 'shop'],
};
