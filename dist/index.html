/* ---------- derived helpers ---------- */
const projectPct = () => (S.project ? Math.min(1, S.project.pts / S.project.need) * 100 : 0);
function projectETA() {
  if (!S.project) return '';
  const rem = S.project.need - S.project.pts;
  return '≈ ' + fmtDur(rem / Math.max(0.1, wpTotal(S)) / (NET.speed || 1));
}
const claimableGoals = () => GOALS.filter((g) => S.goals[g.id] === 1);
const dailyClaimable = () => DAILY.filter((d) => !S.dq.done[d.id] && dailyProgress(S, d) >= d.need);
function checkinReady() {
  const e = NET.eco;
  return !!(e && e.checkin && !e.checkin.done && S.stats.taps >= 20);
}
function nextStep() {
  if (S.pending) return { k: 'next.event', act: 'event' };
  if (claimableGoals().length) return { k: 'next.claim', act: 'tab:quests' };
  if (S.stats.started === 0) return { k: 'next.start', act: 'go:studio:games' };
  if (S.stats.taps < 10) return { k: 'next.tap', act: 'work' };
  if (!S.project) return { k: 'next.start2', act: 'go:studio:games' };
  if (hiredCount(S) === 0 && S.cash >= ROLE.prog.hire) return { k: 'next.hire', act: 'go:studio:team' };
  if (checkinReady()) return { k: 'next.checkin', act: 'checkin' };
  if (dailyClaimable().length) return { k: 'next.daily', act: 'tab:quests' };
  const nf = nextFloor(S);
  const f = nf && FLOORS.find((x) => x.id === nf);
  if (f && S.cash >= f.price) return { k: 'next.floor', act: 'tab:empire' };
  if (S.energy < 2) return { k: 'next.rest', act: '' };
  if (S.stats.released >= 1 && NET.eco && NET.eco.ref && NET.eco.ref.total === 0 && NET.mode === 'online') return { k: 'next.invite', act: 'go:drop:friends' };
  return { k: 'next.work', act: 'work' };
}
function buffChips() {
  const out = [];
  if (S.buffs.turbo > 0) out.push(`<span class="chip cy">${I('bolt', 12)} ${L('buff.turbo')} <b data-t="buff:turbo"></b></span>`);
  if (S.buffs.hype > 0) out.push(`<span class="chip mag">${I('fire', 12)} ${L('buff.hype')} <b data-t="buff:hype"></b></span>`);

}

const LIVE = {
  cash: () => fmtHud(S.cash),
  gems: () => String(S.gems),

  clock: () => clockText(S),
  energy: () => Math.floor(S.energy) + '/' + maxEnergy(S),

  peta: () => projectETA(),
  dayleft: () => fmtDur((DAY_SEC - S.clock) / (NET.speed || 1)),
  buff: (id) => fmtDur(S.buffs[id] / (NET.speed || 1)),
  gearn: (id) => { const g = S.games.find((x) => String(x.id) === id); return g ? money(g.earned) : ''; },
  dprog: (id) => { const d = DAILY.find((x) => x.id === id); return d ? dailyProgress(S, d) + '/' + d.need : ''; },
  sales: () => money(dailySalesRate(S)),
};
const WLIVE = {
  daybar: () => (S.clock / DAY_SEC) * 100,
  energy: () => (S.energy / maxEnergy(S)) * 100,
  proj: () => projectPct(),
  gprog: (id) => { const g = S.games.find((x) => String(x.id) === id); return g ? Math.min(100, (g.earned / Math.max(1, g.total)) * 100) : 0; },
  dprog: (id) => { const d = DAILY.find((x) => x.id === id); return d ? (dailyProgress(S, d) / d.need) * 100 : 0; },
};
function live() {
  $$('[data-t]').forEach((el) => {
    const parts = el.dataset.t.split(':');
    const f = LIVE[parts[0]];
    if (!f) return;
    const v = f(parts[1]);
    if (el._v !== v) { el.textContent = v; el._v = v; }
  });
  $$('[data-w]').forEach((el) => {
    const parts = el.dataset.w.split(':');
    const f = WLIVE[parts[0]];
    if (!f) return;
    const v = Math.max(0, Math.min(100, f(parts[1]))).toFixed(1) + '%';
    if (el._v !== v) { el.style.width = v; el._v = v; }
  });
  const wb = $('#workbtn');
  if (wb) wb.classList.toggle('tired', S.energy < 2);
  updateSceneFx();
}

/* ============================================================
   OFFICE DREAMS — interactivity & juice:
   tappable office scene, catchable ideas, talking employees,
   coins flying to the HUD, tap combos, screen shake

/* ---------- scene <-> screen coordinates ---------- */
function sceneMap() {
  const cv = UI.sceneCv;
  if (!cv || !cv.isConnected) return null;
  const r = cv.getBoundingClientRect();
  if (!r.width) return null;
  const f = camFit(cv.width, cv.height, true); // canvas pixels
  const kx = r.width / cv.width, ky = r.height / cv.height;
  return {
    r,
    // scene pixel → position inside the .scene box (CSS px)
    toCss: (x, y) => [f[0] * kx + ((x - CAM.sx) / CAM.sw) * f[2] * kx, f[1] * ky + ((y - CAM.sy) / CAM.sh) * f[3] * ky],
    // client point → scene pixel
    toScene: (cx, cy) => [CAM.sx + (((cx - r.left) / kx - f[0]) / f[2]) * CAM.sw, CAM.sy + (((cy - r.top) / ky - f[1]) / f[3]) * CAM.sh],
    scale: (f[2] * kx) / CAM.sw,
  };
}
const HEAD_DY = 20; // sprite head is ~20 scene px above the seat point
function spotOf(kind) {
  if (kind === 'you') { const a = P(5.1, 5.1, 9); return [a[0], a[1] - HEAD_DY]; }
  if (kind === 'laptop') return P(6.3, 5.4, 16);
  if (kind === 'cat') { const a = P(6.5, 6.1, 13); return [a[0] - 3, a[1] - 3]; }
  const sp = STAND[kind];
  if (sp) { const a = P(sp.gx, sp.gy, 0); return [a[0], a[1] - (sp.pose === 'pad' ? 17 : 26)]; }
  const st = STATION[kind];
  if (!st) return null;
  const a = P(st.chair[0], st.chair[1], 9);
  return [a[0], a[1] - HEAD_DY];
}

/* ---------- tapping the office ---------- */
function onSceneTap(e) {
  const m = sceneMap();
  if (!m) return;
  const [x, y] = m.toScene(e.clientX, e.clientY);
  const near = (k, rad) => { const p = spotOf(k); return p && Math.hypot(p[0] - x, p[1] - y) <= rad; };
  if (S.idea && near(S.idea.role, 16)) return grabIdea();
  if (S.bug) { const b = bugSpot(); if (b && Math.hypot(b[0] - x, b[1] - y) <= 14) return squash(); }
  if (near('cat', 9)) return petCat(e);
  for (const r of ROLES) {
    if (near(r, 15)) return S.staff[r].lvl > 0 ? talk(r) : (UI.sel = r, go('studio', 'team'));
  }
  if (near('you', 16) || near('laptop', 12)) return onWorkDown(e);
}
function petCat(e) {
  sfx('meow');
  haptic('light');
  for (let i = 0; i < 4; i++) setTimeout(() => floatText(e.clientX + (Math.random() * 30 - 15), e.clientY - 10, '❤', 'heart'), i * 90);
}
const TALK = { ok: 4, mid: 3, low: 3 };
function talk(role) {
  const st = S.staff[role];
  const mood = moodClass(st.mood);
  const line = L('talk.' + mood + (1 + Math.floor(Math.random() * TALK[mood])));
  sayBubble(role, `<b>${esc(L('role.' + role + '.name'))}</b> · ${Math.round(st.mood)}%<br>${esc(line)}`);
  sfx('blip');
  haptic('light');
}
function sayBubble(kind, html) {
  const box = $('.scene .scene-fx');
  const m = sceneMap();
  if (!box || !m) return;
  const p = spotOf(kind);
  const [cx, cy] = m.toCss(p[0], p[1] - 6);
  box.querySelectorAll('.say').forEach((n) => n.remove());
  const el = document.createElement('div');
  el.className = 'say';
  el.innerHTML = html;

  el.style.top = cy + 'px';

}

/* ---------- ideas: catch the light bulb ---------- */
/* ---------- bugs: squash them before they eat progress ---------- */
const BUG_TTL = 10;
function bugSpot() {
  if (!S.bug) return null;
  const k = 1 - Math.max(0, S.bug.ttl) / BUG_TTL; // 0 → 1 across the floor
  const lane = S.bug.lane || 0;
  const dir = lane === 1 ? -1 : 1;
  const x0 = CAM.sx + 14, x1 = CAM.sx + CAM.sw - 14;
  const x = dir > 0 ? x0 + (x1 - x0) * k : x1 - (x1 - x0) * k;
  const y = [106, 121, 136][lane] + Math.sin(k * 40) * 3;
  return [x, y, dir];
}
function updateBug(box, m) {
  let b = box.querySelector('.bug');
  if (!S.bug || UI.tab !== 'office') { if (b && !b.classList.contains('splat')) b.remove(); return; }
  const p = bugSpot();
  const [cx, cy] = m.toCss(p[0], p[1]);
  if (!b || b.classList.contains('splat')) {
    b = document.createElement('button');
    b.className = 'bug';
    b.setAttribute('aria-label', L('bug.squash'));
    b.innerHTML = '<span>🐞</span>';
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); squash(); });
    box.appendChild(b);
  }
  b.style.left = cx + 'px';
  b.style.top = cy + 'px';
  b.style.setProperty('--dir', p[2]);
  b.classList.toggle('late', S.bug.ttl < 3.5);
}
function squash() {
  const b = $('.scene .bug');
  const r = b ? b.getBoundingClientRect() : null;
  const res = netAct('bug');
  if (!res.ok) return;
  haptic('heavy');

  shake(false);
  if (b) { b.classList.add('splat'); b.innerHTML = '<span>💥</span>'; setTimeout(() => b.remove(), 450); }
  if (r) {
    const x = r.left + r.width / 2, y = r.top + r.height / 2;
    burst(x, y, 12, ['#7dff6a', '#3fd0ff', '#ffd23f']);

function updateSceneFx() {
  const box = $('.scene .scene-fx');

function grabIdea() {
  const role = S.idea && S.idea.role;

/* ---------- things flying into the HUD ---------- */
function flyTo(x, y, targetSel, html, n, cls) {
  const t = $(targetSel);
  const layer = $('#fxl');
  if (!t || !layer) return;
  const tr = t.getBoundingClientRect();
  const tx = tr.left + tr.width / 2, ty = tr.top + tr.height / 2;
  for (let i = 0; i < (n || 6); i++) {
    const el = document.createElement('div');
    el.className = 'fly ' + (cls || '');
    el.innerHTML = html;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    layer.appendChild(el);
    const sx = (Math.random() - 0.5) * 70, sy = -30 - Math.random() * 50;
    const dur = 650 + Math.random() * 300;
    if (el.animate) {
      el.animate([
        { transform: 'translate(-50%,-50%) scale(0.6)', opacity: 0 },
        { transform: `translate(calc(-50% + ${sx}px), calc(-50% + ${sy}px)) scale(1.15)`, opacity: 1, offset: 0.3 },
        { transform: `translate(calc(-50% + ${tx - x}px), calc(-50% + ${ty - y}px)) scale(0.5)`, opacity: 0.9 },
      ], { duration: dur, delay: i * 45, easing: 'cubic-bezier(.5,0,.6,1)', fill: 'both' });
    }
    setTimeout(() => el.remove(), dur + i * 45 + 50);
  }
  setTimeout(() => { t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash'); }, 700);
}

/* ---------- tap combo (pure juice) ---------- */
const COMBO = { n: 0, last: 0, el: null };
function comboTap(x, y) {
  const now = performance.now();

  COMBO.el.classList.remove('bump'); void COMBO.el.offsetWidth; COMBO.el.classList.add('on', 'bump');
  COMBO.el.dataset.lvl = COMBO.n >= 50 ? 3 : COMBO.n >= 25 ? 2 : COMBO.n >= 10 ? 1 : 0;
  if (COMBO.n === 10 || COMBO.n === 25 || COMBO.n === 50 || (COMBO.n > 50 && COMBO.n % 25 === 0)) {
    burst(x, y, 18, ['#ff3fd0', '#ffd23f', '#3fd0ff', '#34e37a']);

/* ============================================================
   v2 visual layer: living background, tap ripples, staggered entrances
   ============================================================ */
const VFX = { reduce: false };
function vfxInit() {
  try { VFX.reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
}
// a soft ripple wherever a button is pressed
function vfxRipple(e) {
  const el = e.target && e.target.closest && e.target.closest('.btn, .sbtn');
  if (!el || VFX.reduce) return;
  const r = el.getBoundingClientRect();
  const s = document.createElement('span');
  s.className = 'rip';
  const d = Math.max(r.width, r.height) * 2.2;
  s.style.width = s.style.height = d + 'px';
  s.style.left = (e.clientX - r.left - d / 2) + 'px';
  s.style.top = (e.clientY - r.top - d / 2) + 'px';
  el.classList.add('has-rip');
  el.appendChild(s);
  setTimeout(() => s.remove(), 650);
}
// entrance cascade: each block of a freshly opened page rises in after the previous one
function vfxStagger() {
  const page = document.querySelector('#main > .page.enter');
  if (!page) return;
  Array.prototype.forEach.call(page.children, (el, i) => el.style.setProperty('--i', Math.min(i, 10)));
}

/* ---- src/ui_tutorial.js ---- */
/* ============================================================
   OFFICE DREAMS — interactive tutorial (coach marks).
   A glowing ring points at the button to press, a bubble explains
   why. Steps finish by themselves when the player does the thing.
   ============================================================ */
const TUT = [
  { k: 'tut.genre', tab: ['studio', 'games'], target: '.genres', done: () => UI.genrePicked || S.stats.started >= 1 },
  { k: 'tut.start', tab: ['studio', 'games'], target: '[data-act="start"]', done: () => S.stats.started >= 1 },
  { k: 'tut.tap', tab: ['office'], target: '#workbtn', done: () => S.stats.taps >= 15 },
  { k: 'tut.energy', tab: ['office'], target: '.energy', manual: true },
  { k: 'tut.release', tab: ['office'], target: '.pmini', manual: true },
  { k: 'tut.hire', tab: ['office'], target: '.side [data-act="go:studio:team"]', done: () => hiredCount(S) >= 1, skippable: true },
  { k: 'tut.quests', tab: null, target: '#tabs [data-act="tab:quests"]', manual: true },
  { k: 'tut.points', tab: ['drop', 'home'], target: '.ptsp', manual: true },
  { k: 'tut.token', tab: ['drop', 'token'], target: '.tokhero', manual: true },
  { k: 'tut.friends', tab: ['drop', 'friends'], target: '.invite', manual: true },
  { k: 'tut.studio', tab: ['office'], target: '.op-studio', done: () => !!studioName(), skippable: true },
  { k: 'tut.pvp', tab: ['office'], target: '.side [data-act="pvp"]', manual: true, done: () => !!lsGet('od2_tip_pvp') },
  { k: 'tut.done', tab: ['office'], target: null, manual: true },
];
const COACH = { i: -1, el: null, scrolled: -1 };
// one-off "new feature" hints for players who already finished the tutorial
const TIPS = [
  { id: 'pvp', k: 'tut.pvp_new', tab: ['office'], target: '.side [data-act="pvp"]', act: 'pvp', when: () => S.stats.taps >= 15 },
  { id: 'studio', k: 'tut.studio_new', tab: ['office'], target: '.op-studio', act: 'studio', when: () => S.stats.taps >= 15 && !studioName() },
  { id: 'reno', k: 'tut.reno_new', tab: ['empire'], target: '.floor .reno', act: '', when: () => renoStars(S) === 0 },
];
const OLD_TUT_DONE = 11; // the tutorial had 11 steps before the battle step was added: 11+ means "finished"

function tutLoad() {
  const v = lsGet('od2_tut');
  COACH.i = v === null ? -1 : v === 'done' || Number(v) >= OLD_TUT_DONE ? TUT.length : Number(v);
}
function tipActive() {
  if (COACH.i < TUT.length || UI.pvp) return null;
  return TIPS.find((t) => !lsGet('od2_tip_' + t.id) && t.when()) || null;
}
function tipDone(id) { lsSet('od2_tip_' + id, '1'); }
function tutSave() { lsSet('od2_tut', COACH.i >= TUT.length ? 'done' : String(COACH.i)); }
function tutStart() {
  COACH.i = 0;
  tutSave();
  tutGoto();
}
function tutStop() {
  COACH.i = TUT.length;
  tutSave();
  if (COACH.el) COACH.el.hidden = true;
}
function tutActive() { return COACH.i >= 0 && COACH.i < TUT.length; }
function tutGoto() {
  const st = TUT[COACH.i];
  if (!st) return;
  COACH.scrolled = -1;
  if (st.tab) go(st.tab[0], st.tab[1]);
}
function tutNext() {
  if (TUT[COACH.i] && TUT[COACH.i].k === 'tut.pvp') tipDone('pvp'); // seen in the tutorial: no "new" hint later
  if (TUT[COACH.i] && TUT[COACH.i].k === 'tut.studio') tipDone('studio');
  COACH.i++;
  tutSave();
  if (COACH.i >= TUT.length) { tutStop(); confetti(60); return; }
  // skip steps that are already done (e.g. the player hired before we asked)
  while (tutActive() && TUT[COACH.i].done && TUT[COACH.i].done()) { COACH.i++; tutSave(); }
  if (!tutActive()) { tutStop(); return; }
  tutGoto();
}
function tutEl() {
  if (COACH.el) return COACH.el;
  const el = document.createElement('div');
  el.id = 'coach';
  el.innerHTML = '<div class="c-ring"></div><div class="c-bub" role="dialog" aria-live="polite"><div class="c-step px"></div><p class="c-text"></p><div class="c-btns"></div></div>';
  document.body.appendChild(el);
  COACH.el = el;
  return el;
}
// called a few times per second from the main loop
function tutUpdate() {
  if (!S) return;
  const tip = tutActive() ? null : tipActive();
  if (!tutActive() && !tip) { if (COACH.el) COACH.el.hidden = true; return; }
  const st = tip || TUT[COACH.i];
  if (!tip && st.done && st.done()) { tutNext(); return; }
  const el = tutEl();
  // never cover a modal (release, event…) — wait for it to close
  if (UI.modal) { el.hidden = true; return; }
  el.hidden = false;
  const ring = el.querySelector('.c-ring'), bub = el.querySelector('.c-bub');
  const onTab = !st.tab || (UI.tab === st.tab[0] && (!st.tab[1] || UI.sub[st.tab[0]] === st.tab[1]));
  const target = st.target && onTab ? document.querySelector(st.target) : null;
  if (tip && !target) { el.hidden = true; return; } // a hint waits for its screen, it never drags the player around
  // text + buttons (re-rendered only when the step or language changes)
  const sig = (tip ? 'tip' + tip.id : COACH.i) + LANG + (target ? 1 : 0);
  if (bub.dataset.sig !== sig && tip) {
    bub.dataset.sig = sig;
    el.querySelector('.c-step').textContent = L('tut.new');
    el.querySelector('.c-text').textContent = L(st.k);
    el.querySelector('.c-btns').innerHTML = tip.act
      ? `<button class="btn sm glow" data-act="tip:go:${tip.id}">${L('tut.try')}</button><button class="btn sm ghost" data-act="tip:later:${tip.id}">${L('tut.later')}</button>`
      : `<button class="btn sm glow" data-act="tip:later:${tip.id}">${L('tut.got')}</button>`;
  }
  if (bub.dataset.sig !== sig) {
    bub.dataset.sig = sig;
    el.querySelector('.c-step').textContent = (COACH.i + 1) + '/' + TUT.length;
    el.querySelector('.c-text').textContent = L(st.k);
    const btns = [];
    if (st.target && !target && st.tab) btns.push(`<button class="btn sm" data-act="tut:go">${L('tut.show')}</button>`);
    if (st.manual) btns.push(`<button class="btn sm glow" data-act="tut:next">${L(COACH.i === TUT.length - 1 ? 'tut.finish' : 'tut.next')}</button>`);
    if (st.skippable) btns.push(`<button class="btn sm ghost" data-act="tut:next">${L('tut.later')}</button>`);
    btns.push(`<button class="linkbtn" data-act="tut:skip">${L('tut.skip')}</button>`);
    el.querySelector('.c-btns').innerHTML = btns.join('');
  }
  if (!target) {
    ring.hidden = true;
    bub.className = 'c-bub center';
    return;
  }
  let r = target.getBoundingClientRect();
  if ((r.top < 70 || r.bottom > window.innerHeight - 80) && COACH.scrolled !== COACH.i) {
    COACH.scrolled = COACH.i;
    target.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
  r = target.getBoundingClientRect();
  ring.hidden = false;
  const pad = 6;
  ring.style.left = (r.left - pad) + 'px';
  ring.style.top = (r.top - pad) + 'px';
  ring.style.width = (r.width + pad * 2) + 'px';
  ring.style.height = (r.height + pad * 2) + 'px';
  const below = r.top + r.height / 2 < window.innerHeight * 0.5;
  bub.className = 'c-bub ' + (below ? 'below' : 'above');
  const bw = Math.min(320, window.innerWidth - 24);
  const cx = Math.max(12, Math.min(window.innerWidth - bw - 12, r.left + r.width / 2 - bw / 2));
  bub.style.left = cx + 'px';
  bub.style.width = bw + 'px';
  if (below) { bub.style.top = (r.bottom + pad + 14) + 'px'; bub.style.bottom = 'auto'; }
  else { bub.style.bottom = (window.innerHeight - r.top + pad + 14) + 'px'; bub.style.top = 'auto'; }
  bub.style.setProperty('--ax', Math.max(18, Math.min(bw - 18, r.left + r.width / 2 - cx)) + 'px');
}

/* ---- src/ui_pvp.js ---- */
/* ============================================================
   OFFICE DREAMS — Studio Battle (PvP)
   A full-screen arena over the game: lobby → search → 3-2-1 →
   30 s tap race → result. The server owns the clock, the score
   and the rewards; this file only shows them and counts taps.
   ============================================================ */
const PV = {
  open: false, st: 'lobby', info: null, v: null, n: 0, off: 0, busy: false, timer: null, raf: 0,
  emote: null, opEk: 0, meEk: 0, opDisp: 0, bid: '', fails: 0, lastSfx: 0, duel: '', tapsShown: 0, resAt: 0,
};
const PV_EMOTES = ['😎', '🔥', '😂', '😱', '👏', '💀'];
const PV_LEAGUE = ['🥉', '🥈', '🥇', '💠', '🌈'];
const PV_LEAGUES = [0, 150, 400, 800, 1400];
const PV_DUR = 30000;

/* ---------- transport: the real server, or a local training bot in the demo ---------- */
const PVL = { tr: 0, w: 0, l: 0, d: 0, best: 0, b: null, q: 0 };
function pvMult(s) { return Math.round((1 + Math.min(1, Math.log2(1 + Math.max(0, wpTotal(s))) / 6)) * 100) / 100; }
function pvLeague(tr) { let i = 0; while (i + 1 < PV_LEAGUES.length && tr >= PV_LEAGUES[i + 1]) i++; return i; }
function pvBotLine(seed, rate) {
  let x = seed >>> 0 || 7;
  const rnd = () => { x = (Math.imul(x, 1103515245) + 12345) >>> 0; return x / 4294967296; };
  const out = [];
  let n = 0;
  for (let i = 0; i < 60; i++) { const r = i < 2 ? 0 : rate * (0.75 + rnd() * 0.5) * (i > 52 ? 1.15 : 1); n += Math.round(r * 0.5); out.push(n); }
  return out;
}
function pvLocal(path, body) {
  const now = Date.now();
  const L0 = PVL;
  const lineN = (b, t) => { const el = Math.min(t, b.end) - b.start; if (el <= 0) return 0; const i = Math.min(59, Math.floor(el / 500)); const p = i ? b.line[i - 1] : 0; return Math.round(p + (b.line[i] - p) * Math.min(1, (el - i * 500) / 500)); };
  const viewL = () => {
    const b = L0.b;
    if (!b) return L0.q ? { ok: true, st: 'search', now, since: L0.q } : { ok: true, st: 'idle', now };
    const done = now > b.end + 600;
    const opn = lineN(b, now), sm = Math.round(b.n * b.mult * 10), so = Math.round(opn * b.mult * 10);
    if (done && !b.res) {
      const win = sm > so ? 1 : sm < so ? -1 : 0;
      const d = win > 0 ? 20 : win < 0 ? -12 : 0;
      L0.tr = Math.max(0, L0.tr + d);
      if (win > 0) L0.w++; else if (win < 0) L0.l++; else L0.d++;
      L0.best = Math.max(L0.best, sm);
      b.res = { win, dTr: d, tr: L0.tr, league: pvLeague(L0.tr), cash: 0, gems: 0, rewarded: false, left: 0, my: sm, op: so, demo: true };
    }
    return { ok: true, st: done ? 'result' : 'battle', id: b.id, now, start: b.start, end: b.end, me: { n: b.n, mult: b.mult, score: sm, kind: 'live', tr: L0.tr, league: pvLeague(L0.tr) }, op: { name: '', kind: 'bot', tr: L0.tr, league: pvLeague(L0.tr), mult: b.mult, n: opn, score: so, e: b.e }, res: done ? b.res : null };
  };
  if (path === 'info') return { ok: true, demo: true, me: { tr: L0.tr, league: pvLeague(L0.tr), next: PV_LEAGUES[pvLeague(L0.tr) + 1] || null, w: L0.w, l: L0.l, d: L0.d, best: L0.best, left: 0, daily: 5, mult: pvMult(S), reward: 0, rank: null, hasRun: false }, online: { searching: 0, fighting: 0 }, top: [] };
  if (path === 'find') { if (L0.b && !L0.b.res) return viewL(); L0.b = null; L0.q = now; return viewL(); }
  if (path === 'cancel') { L0.q = 0; return { ok: true, st: 'idle' }; }
  if (path === 'tick') {
    if (L0.q && !L0.b && now - L0.q > 1600) { L0.q = 0; const seed = (now % 100000) + 1; L0.b = { id: 'demo' + seed, start: now + 3500, end: now + 3500 + PV_DUR, n: 0, mult: pvMult(S), line: pvBotLine(seed, 5.5 + L0.tr / 300), e: null }; }
    const b = L0.b;
    if (b && !b.res && body.n > b.n && now >= b.start && now <= b.end + 600) b.n = Math.min(body.n, Math.floor((15 * Math.min(PV_DUR, now - b.start)) / 1000) + 8);
    if (b && !b.res && now > b.start && now < b.end && Math.random() < 0.04) b.e = { i: Math.floor(Math.random() * 6), at: now, k: ((b.e && b.e.k) || 0) + 1 };

}
function pvCall(path, body) {
  if (NET.mode !== 'online') return Promise.resolve(pvLocal(path, body || {}));
  const route = { info: ['GET', '/api/pvp'], find: ['POST', '/api/pvp/find'], tick: ['POST', '/api/pvp/tick'], cancel: ['POST', '/api/pvp/cancel'] }[path];
  return http(route[0], route[1], route[0] === 'GET' ? null : body || {}, { timeout: 8000 }).then((r) => {
    if (r.status === 401) return reauth().then((ok) => (ok ? http(route[0], route[1], route[0] === 'GET' ? null : body || {}, { timeout: 8000 }).then((x) => x.j) : null));
    return r.j;
  }).catch(() => null);
}

/* ---------- open / close ---------- */
function pvEl() {
  let el = $('#pvp');
  if (!el) {
    el = document.createElement('div');
    el.id = 'pvp';
    el.className = 'pvp';
    el.hidden = true;
    document.body.appendChild(el);
    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-pv]');
      if (!b || b.disabled) return;
      e.stopPropagation();
      const [a, x] = b.dataset.pv.split(':');
      if (PV_ACT[a]) PV_ACT[a](x);
    });
    el.addEventListener('pointerdown', (e) => {
      const t = e.target.closest('.pv-tap');
      if (t) { e.preventDefault(); pvTap(e); }
    }, { passive: false });
  }
  return el;
}
function pvOpen(duel) {
  ensureAudio();
  const el = pvEl();
  PV.open = true;
  UI.pvp = true;
  PV.duel = duel || '';
  el.hidden = false;
  el.classList.remove('out');
  document.body.classList.add('pv-on');
  lsSet('od2_pv_day', String(Math.floor(Date.now() / 86400000)));
  tipDone('pvp');
  if (COACH.el) COACH.el.hidden = true; // no coach bubbles over the arena
  syncBackButton();
  if (PV.st === 'fight' || PV.st === 'search') { pvRender(); return; }
  PV.st = 'lobby';
  pvRender();
  pvLoadInfo().then(() => { if (PV.duel) pvFind(PV.duel); });
}
function pvClose(force) {
  if (!PV.open) return;
  if (PV.st === 'fight' && !force) return; // a running battle is not abandoned by an accidental back swipe
  if (PV.st === 'search') pvCall('cancel');
  pvStop();
  PV.open = false;
  UI.pvp = false;
  PV.st = 'lobby';
  const el = pvEl();
  el.classList.add('out');
  setTimeout(() => { if (!PV.open) { el.hidden = true; el.innerHTML = ''; } }, 220);
  document.body.classList.remove('pv-on');
  syncBackButton();
  render(true);
  if (!UI.modal && UI.queue.length) setTimeout(UI.queue.shift(), 300);
}
function pvStop() {
  if (PV.timer) { clearInterval(PV.timer); PV.timer = null; }
  if (PV.raf) { cancelAnimationFrame(PV.raf); PV.raf = 0; }
}
function pvLoop() {
  if (!PV.timer) PV.timer = setInterval(pvTick, 350);
  if (!PV.raf) PV.raf = requestAnimationFrame(pvFrame);
}
async function pvLoadInfo() {
  const r = await pvCall('info');
  if (r && r.ok) { PV.info = r; if (PV.st === 'lobby' && PV.open) pvRender(); }
  return r;
}

/* ---------- actions ---------- */
const PV_ACT = {
  close: () => pvClose(),
  find: () => pvFind(''),
  cancel: () => { pvCall('cancel'); pvStop(); PV.st = 'lobby'; pvRender(); },
  again: () => { PV.st = 'lobby'; PV.v = null; pvFind(''); },
  lobby: () => { PV.st = 'lobby'; PV.v = null; pvStop(); pvRender(); pvLoadInfo(); },
  share: () => {
    const link = PV.info && PV.info.link;
    if (!link) return;
    const url = 'https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(L('pv.share_text'));
    if (TG && TG.openTelegramLink) TG.openTelegramLink(url); else openLink(url);
  },
  emo: (i) => {
    if (PV.st !== 'fight') return;
    const k = Number(i);
    PV.emote = k;
    pvPopEmote('me', PV_EMOTES[k]);
    haptic('light');
  },
};
async function pvFind(duel) {
  PV.st = 'search';
  PV.v = null;
  PV.n = 0;
  PV.since = Date.now();
  pvRender();
  const r = await pvCall('find', duel ? { duel } : {});
  PV.duel = '';
  if (!r || !r.ok) {
    if (r && (r.err === 'self' || r.err === 'norun')) {
      toast(L(r.err === 'self' ? 'pv.err_self' : 'pv.err_norun'), r.err === 'self' ? '' : 'bad');
      if (r.err === 'norun') return pvFind('');
    } else toast(L('pv.err'), 'bad');
    PV.st = 'lobby';
    pvRender();
    return;
  }
  pvApply(r);
  pvLoop();
}
async function pvTick() {
  if (PV.busy || !PV.open) return;
  if (PV.st !== 'search' && PV.st !== 'fight') return;
  PV.busy = true;
  const body = { n: PV.n };
  if (PV.v && PV.v.id) body.b = PV.v.id;
  if (PV.emote !== null) { body.e = PV.emote; PV.emote = null; }
  const r = await pvCall('tick', body);
  PV.busy = false;
  if (!r || !r.ok) { if (++PV.fails > 25) { toast(L('pv.err'), 'bad'); PV_ACT.lobby(); } return; }
  PV.fails = 0;
  pvApply(r);
}
function pvApply(r) {
  if (typeof r.now === 'number') PV.off = r.now - Date.now();
  if (r.st === 'idle') { if (PV.st === 'search' || PV.st === 'fight') { PV.st = 'lobby'; pvStop(); pvRender(); } return; }
  if (r.st === 'search') { if (PV.st !== 'search') { PV.st = 'search'; pvRender(); } return; }
  if (r.st === 'battle') {
    const fresh = !PV.v || PV.v.id !== r.id;
    PV.v = r;
    if (fresh) { PV.n = Math.max(0, r.me.n || 0); PV.opDisp = 0; PV.opEk = r.op.e ? r.op.e.k : 0; PV.st = 'fight'; pvRender(); sfx('up'); haptic('medium'); }
    if (r.op.e && r.op.e.k !== PV.opEk) { PV.opEk = r.op.e.k; pvPopEmote('op', PV_EMOTES[r.op.e.i] || '🔥'); }
    return;
  }
  if (r.st === 'result') {
    PV.v = r;
    pvStop();
    PV.st = 'result';
    lsSet('od2_pv_first', '1');
    pvRender();
    const res = r.res || {};
    if (res.win > 0) { confetti(170); sfx('hit'); haptic('ok'); } else if (res.win < 0) { sfx('bad'); haptic('err'); } else sfx('release');

    if (NET.mode === 'online' && res.rewarded) setTimeout(() => netSync({ full: true }), 400);
    pvLoadInfo();
  }
}

/* ---------- tapping ---------- */
function pvPhase() {
  const v = PV.v;
  if (!v) return 'none';
  const now = Date.now() + PV.off;
  return now < v.start ? 'count' : now <= v.end ? 'fight' : 'over';
}
function pvTap(e) {
  if (PV.st !== 'fight' || pvPhase() !== 'fight') return;
  PV.n++;
  const t = performance.now();
  if (t - PV.lastSfx > 70) { PV.lastSfx = t; sfx('tap'); }
  haptic('light');
  const box = $('.pv-fight');
  if (!box) return;
  const r = box.getBoundingClientRect();
  const x = (e && e.clientX ? e.clientX : r.left + r.width / 2) - r.left + (Math.random() * 30 - 15);
  const y = (e && e.clientY ? e.clientY : r.top + r.height * 0.7) - r.top - 16;
  if (box.querySelectorAll('.pv-plus').length > 14) box.querySelector('.pv-plus').remove();
  const p = document.createElement('span');
  p.className = 'pv-plus px';
  p.textContent = '+' + Math.round((PV.v.me.mult || 1) * 10);
  p.style.left = x + 'px';
  p.style.top = y + 'px';
  box.appendChild(p);
  setTimeout(() => p.remove(), 650);
  const btn = $('.pv-tap');
  if (btn) { btn.classList.remove('hit'); void btn.offsetWidth; btn.classList.add('hit'); }
}
function pvPopEmote(who, ch) {
  const host = $(who === 'me' ? '.pv-row.me' : '.pv-row.op');
  if (!host) return;
  const s = document.createElement('span');
  s.className = 'pv-emo';
  s.textContent = ch;
  host.appendChild(s);
  setTimeout(() => s.remove(), 1600);
}

/* ---------- per-frame updates of the arena (no re-render while fighting) ---------- */
function pvFrame() {
  PV.raf = 0;
  if (!PV.open) return;
  if (PV.st === 'search') {
    const t = $('#pvSearchT');
    if (t) { const s = Math.floor((Date.now() - (PV.since || Date.now())) / 1000); t.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  } else if (PV.st === 'fight' && PV.v) {
    const v = PV.v, now = Date.now() + PV.off, ph = pvPhase();
    const cnt = $('#pvCount'), clock = $('#pvClock'), tap = $('.pv-tap');
    if (ph === 'count') {
      const k = Math.ceil((v.start - now) / 1000);
      if (cnt) { const txt = k > 3 ? L('pv.ready') : String(Math.max(1, k)); if (cnt.dataset.k !== txt) { cnt.dataset.k = txt; cnt.textContent = txt; cnt.classList.remove('pop'); void cnt.offsetWidth; cnt.classList.add('pop'); if (k <= 3) sfx('blip'); } cnt.hidden = false; }
      if (tap) tap.disabled = true;
      if (clock) clock.textContent = '0:30';
    } else {
      if (cnt && !cnt.hidden) {
        if (cnt.dataset.k !== 'go') { cnt.dataset.k = 'go'; cnt.textContent = L('pv.go'); cnt.classList.remove('pop'); void cnt.offsetWidth; cnt.classList.add('pop', 'go'); sfx('combo'); setTimeout(() => { cnt.hidden = true; }, 650); }
      }
      if (tap) tap.disabled = ph !== 'fight';
      const left = Math.max(0, Math.ceil((v.end - now) / 1000));
      if (clock) { clock.textContent = ph === 'over' ? '0:00' : '0:' + String(left).padStart(2, '0'); clock.classList.toggle('hot', left <= 5 && ph === 'fight'); }
      if (ph === 'over') { const w = $('#pvLead'); if (w) w.textContent = L('pv.wait'); }
    }
    const meS = Math.round(PV.n * (v.me.mult || 1) * 10);
    const target = v.op.score || 0;
    PV.opDisp += (target - PV.opDisp) * 0.18;
    if (Math.abs(target - PV.opDisp) < 1) PV.opDisp = target;
    const opS = Math.round(PV.opDisp);
    const top = Math.max(meS, opS, 200);
    const bm = $('#pvBarMe'), bo = $('#pvBarOp'), sm = $('#pvScMe'), so = $('#pvScOp'), lead = $('#pvLead');
    if (bm) bm.style.transform = 'scaleX(' + (meS / top).toFixed(3) + ')';
    if (bo) bo.style.transform = 'scaleX(' + (opS / top).toFixed(3) + ')';
    if (sm) sm.textContent = fmt(meS);
    if (so) so.textContent = fmt(opS);
    if (lead && ph === 'fight') {
      const k = meS > opS ? 'lead' : meS < opS ? 'behind' : 'tie';
      if (lead.dataset.k !== k) { lead.dataset.k = k; lead.textContent = L('pv.' + k); lead.className = 'pv-lead ' + k; }
    }
  }
  if (PV.st === 'search' || PV.st === 'fight') PV.raf = requestAnimationFrame(pvFrame);
}

/* ---------- screens ---------- */
function pvOpName(op) { return op.kind === 'bot' ? L('pv.bot') : (op.name || '?'); }
function pvLeagueChip(lg) { return `<span class="pv-lg l${lg}">${PV_LEAGUE[lg]} ${L('pv.league' + lg)}</span>`; }
function pvRender() {
  const el = pvEl();
  let html = '';
  if (PV.st === 'lobby') html = pvLobby();
  else if (PV.st === 'search') html = pvSearch();
  else if (PV.st === 'fight') html = pvFight();
  else if (PV.st === 'result') html = pvResult();
  el.innerHTML = `<div class="pv-bg" aria-hidden="true"><i></i><i></i></div><div class="pv-box st-${PV.st}">${html}</div>`;
  if (PV.st === 'search' || PV.st === 'fight') { if (!PV.raf) PV.raf = requestAnimationFrame(pvFrame); }
}
function pvLobby() {
  const inf = PV.info;

    <p class="pv-sub">${L('pv.sub')}</p>`;

  const dots = Array.from({ length: me.daily }, (_, i) => `<i class="${i < me.left ? 'on' : ''}"></i>`).join('');

    </div>

    ${inf.demo ? '' : `<div class="pv-daily"><div class="pv-dots">${dots}</div><small>${me.left > 0 ? L('pv.left', { n: me.left, all: me.daily }) + ' · ' + L('pv.reward', { cash: money(me.reward) }) + (me.firstWin ? '<br>' + L('pv.first') : '') : L('pv.no_left')}</small></div>`}
    <button class="btn big glow pv-find" data-pv="find">${I('sword', 18)} ${L('pv.find')}</button>
    ${inf.demo ? '' : `<button class="btn ghost pv-duelb" data-pv="share" ${me.hasRun ? '' : 'disabled'}>🤝 ${L('pv.duel')}</button>
    <p class="hint">${me.hasRun ? L('pv.duel_hint') : L('pv.duel_need')}</p>`}

    <section class="pv-how"><h3>${L('pv.how')}</h3><ol><li>${L('pv.how1')}</li><li>${L('pv.how2')}</li><li>${L('pv.how3')}</li></ol></section>
    ${inf.demo ? '' : `<section class="pv-topl"><h3>${I('trophy', 14)} ${L('pv.top')}</h3>
      ${inf.top.length ? `<ol class="board">${inf.top.slice(0, 10).map((r) => `<li class="${r.me ? 'me' : ''}"><span class="px rk">${r.rank}</span><b>${PV_LEAGUE[r.league]} ${flag(r.country)} ${esc(r.name)}</b><span class="yel px">${fmt(r.tr)}</span></li>`).join('')}</ol>` : `<p class="sub">${L('pv.empty')}</p>`}
    </section>`}`;
}

function pvResult() {
  const v = PV.v, r = v.res || { win: 0, dTr: 0, tr: 0, my: 0, op: 0 };

/* ---------- rendering ---------- */
function affordSig() {
  const c = S.cash;
  let s = '';
  for (const r of ROLES) {
    const st = S.staff[r];
    s += st.lvl > 0 ? (st.lvl < MAX_LVL && c >= upCost(r, st.lvl) ? 1 : 0) : (c >= ROLE[r].hire ? 1 : 0);
    s += st.lvl > 0 ? moodClass(st.mood).charAt(0) : '';
  }
  s += c >= youUpCost(S.you.lvl) ? 1 : 0;
  const nf = nextFloor(S);
  const f = nf && FLOORS.find((x) => x.id === nf);
  s += f && c >= f.price ? 1 : 0;
  for (const it of ITEMS) s += c >= it.price ? 1 : 0;
  s += S.gems >= 5 ? 1 : 0;
  s += S.energy >= 2 ? 1 : 0;
  s += S.stats.taps >= 20 ? 1 : 0;
  s += S.stats.taps >= 10 ? 1 : 0;
  s += dailyClaimable().length;
  if (S.pending) s += eventView(S).choices.map((x) => (x.disabled ? 0 : 1)).join('');
  s += Object.keys(S.buffs).map((k) => (S.buffs[k] > 0 ? 1 : 0)).join('');
  return s;
}
function render(force) {
  if (!S) return;
  const sig = [S.rev, UI.tab, UI.sub.studio, UI.sub.drop, UI.sel, affordSig(), UI.ecoVer || 0, UI.hubVer || 0, LANG, NET.online, NET.mode, S.sel.genre, S.sel.tier, S.sel.name].join('|');
  if (!force && sig === UI.lastSig) return;
  // don't rebuild the page under someone typing a donation amount (keyboard would close)
  if (!force && document.activeElement && document.activeElement.id === 'donin') { $('#hud').innerHTML = hudHTML(); return; }
  UI.lastSig = sig;
  const main = $('#main');
  const where = UI.tab + ':' + (UI.sub[UI.tab] || '');
  const keep = UI.renderedTab === where ? main.scrollTop : 0;
  $('#hud').innerHTML = hudHTML();
  $('#tabs').innerHTML = tabsHTML();
  main.innerHTML = '<div class="page" data-tab="' + UI.tab + '">' + tabHTML() + '</div>';
  if (UI.renderedTab !== where) { main.firstChild.classList.add('enter'); vfxStagger(); }
  main.scrollTop = keep;
  UI.renderedTab = where;
  bindCanvases();
  live();
  syncBackButton();
}

/* ---------- canvases: office scene (+ bloom layer) and tower ---------- */
let SCENE = null, SCENE_OFF = null, SCENE_IMG = null, TOWER_B = null, TOWER_IMG = null;
function bindCanvases() {
  if (!SCENE) {
    SCENE = createScene();
    SCENE_OFF = document.createElement('canvas');
    SCENE_OFF.width = SCN.W * 2;
    SCENE_OFF.height = SCN.H * 2;
    SCENE_IMG = new ImageData(new Uint8ClampedArray(SCENE.hi.d.buffer), SCN.W * 2, SCN.H * 2);
  }
  UI.sceneCv = $('#scene');
  UI.bloomCv = $('#bloom');
  UI.towerCv = $('#tower');
  UI.sceneCtx = UI.sceneCv ? UI.sceneCv.getContext('2d') : null;
  UI.bloomCtx = UI.bloomCv ? UI.bloomCv.getContext('2d') : null;
  UI.towerCtx = UI.towerCv ? UI.towerCv.getContext('2d') : null;
  if (UI.sceneCv) sizeScene();
  drawScene(performance.now() / 1000);
  drawTowerCv(performance.now() / 1000);
}
// the scene canvas fills its box; the room is drawn "contain"-fitted with a slight zoom (sides of the floor cropped)
const CAM = { sx: 26, sy: 0, sw: 204, sh: 176 };
function sizeScene() {
  const cv = UI.sceneCv;
  if (!cv) return;
  const w = cv.clientWidth || 300, h = cv.clientHeight || 220;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = Math.round(w * dpr), H = Math.round(h * dpr);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  if (UI.bloomCv) {
    const bw = Math.max(1, Math.round(w / 7)), bh = Math.max(1, Math.round(h / 7));
    if (UI.bloomCv.width !== bw || UI.bloomCv.height !== bh) { UI.bloomCv.width = bw; UI.bloomCv.height = bh; }
  }
  UI.sceneSize = w + 'x' + h;
}
function camFit(W, H, crisp) {
  let s = Math.min(W / CAM.sw, H / CAM.sh);
  if (crisp && s >= 6) s = Math.floor(s / 2) * 2;
  const dw = CAM.sw * s, dh = CAM.sh * s;
  return [Math.round((W - dw) / 2), Math.round((H - dh) / 2), Math.round(dw), Math.round(dh)];
}
function sceneState() {
  const canHire = {};
  for (const r of ROLES) canHire[r] = S.staff[r].lvl === 0 && S.cash >= ROLE[r].hire;
  return {
    f: S.clock / DAY_SEC,
    working: !!S.project && (hiredCount(S) > 0 || UI.tapFlash > 0),
    staff: S.staff, items: S.items, turbo: S.buffs.turbo > 0, canHire, legacy: S.legacy || 0,
    tapFlash: UI.tapFlash, floors: S.floors, hype: S.buffs.hype > 0,
    rain: !!(MUSIC.on && TRACKS[MUSIC.track] && TRACKS[MUSIC.track].rain),
  };
}
function drawScene(t) {
  if (!SCENE || !UI.sceneCtx || UI.tab !== 'office') return;
  try {
    const cv = UI.sceneCv;
    if (UI.sceneSize !== cv.clientWidth + 'x' + cv.clientHeight) sizeScene();
    const tier = themeTier(S.floors);
    if (UI.sceneTier !== undefined && tier > UI.sceneTier) movedIn(tier);
    UI.sceneTier = tier;
    SCENE.renderHD(sceneState(), t);
    SCENE_OFF.getContext('2d').putImageData(SCENE_IMG, 0, 0);
    const ctx = UI.sceneCtx;
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, cv.width, cv.height);
    const f = camFit(cv.width, cv.height, true);
    ctx.drawImage(SCENE_OFF, CAM.sx * 2, CAM.sy * 2, CAM.sw * 2, CAM.sh * 2, f[0], f[1], f[2], f[3]);
    if (UI.bloomCtx) {
      const b = UI.bloomCv, g = camFit(b.width, b.height, false);
      UI.bloomCtx.clearRect(0, 0, b.width, b.height);
      UI.bloomCtx.drawImage(SCENE_OFF, CAM.sx * 2, CAM.sy * 2, CAM.sw * 2, CAM.sh * 2, g[0], g[1], g[2], g[3]);
    }
  } catch (e) {}
}
function drawTowerCv(t) {
  if (!UI.towerCtx || UI.tab !== 'empire') return;
  try {
    if (!TOWER_B) {
      TOWER_B = new Buf(80, 124);
      TOWER_IMG = new ImageData(new Uint8ClampedArray(TOWER_B.d.buffer), 80, 124);
    }
    drawTower(TOWER_B, S.floors, t, null, S.flv);
    UI.towerCtx.putImageData(TOWER_IMG, 0, 0);
  } catch (e) {}
}

/* ---------- hub data ---------- */
function loadHub(sub, force) {
  const now = Date.now();
  if (sub === 'token' || sub === 'home') loadMarket(force);
  const key = sub === 'top' ? 'board' : sub === 'token' ? 'donate' : sub;
  if (!['tasks', 'friends', 'board', 'shop', 'home', 'donate'].includes(key)) return;
  if (key === 'home') { if (NET.mode === 'online' && (force || now - (UI.hub.loadedAt.home || 0) > 30000)) { UI.hub.loadedAt.home = now; netSync(); } if (!UI.hub.tasks) loadHub('tasks'); return; }
  if (!force && UI.hub[key] && now - (UI.hub.loadedAt[key] || 0) < 20000) return;
  UI.hub.loadedAt[key] = now;
  const p = key === 'tasks' ? netApi.tasks() : key === 'friends' ? netApi.friends() : key === 'board' ? netApi.leaderboard() : key === 'donate' ? netApi.donateInfo() : netApi.shop();
  p.then((r) => {
    if (!r || !r.ok) return;
    if (key === 'tasks') UI.hub.tasks = r.tasks;
    else if (key === 'friends') UI.hub.friends = r;
    else if (key === 'board') UI.hub.board = r;
    else if (key === 'donate') UI.hub.donate = r;
    else UI.hub.shop = r;
    UI.hubVer = (UI.hubVer || 0) + 1;
    render();
  });
}

function donateStars() {

  const n = donAmount();
  netApi.donateInvoice(n).then((r) => {
    if (!r || !r.ok || !r.url) return errToast((r && r.err) || 'invoice');
    const after = (status) => { if (status === 'paid') donated(); else if (status === 'failed') errToast('pay_failed'); };

async function donateTon() {
  if (NET.mode !== 'online') return toast(L('shop.demo'), 'bad');
  if (UI.tonBusy) return toast(L('shop.ton_wait'), '');
  const d = UI.hub.donate || {};
  const ton = Math.max(d.tonMin || 1, Math.round(donAmount() * (d.tonPerStar || 0.011) * 10) / 10);
  UI.tonBusy = true;
  try {
    const r = await netApi.donateTon(ton);
    if (!r || !r.ok || !r.order) return errToast((r && r.err) || 'unavailable');
    const p = await tonPay(r.order);
    if (!p.ok) { if (p.err === 'need_wallet') { toast(L('shop.ton_connect'), '', 'ton'); tonConnect(); } else if (p.err === 'ton_rejected') toast(L('err.ton_rejected'), 'bad'); else errToast(p.err); return; }
    toast(L('shop.ton_wait'), '', 'ton');
    for (let i = 0; i < 30; i++) {
      await new Promise((res) => setTimeout(res, 4000));
      const c = await netApi.tonCheck(r.order.id);
      if (c && c.paid) return donated();
      if (c && c.expired) break;
    }
    toast(L('shop.ton_later'), '', 'ton');
  } finally { UI.tonBusy = false; }
}
async function buyTon(sku) {
  if (NET.mode !== 'online') return toast(L('shop.demo'), 'bad');
  if (UI.tonBusy) return toast(L('shop.ton_wait'), '');

    const p = await tonPay(r.order);

      else if (p.err === 'ton_rejected') toast(L('err.ton_rejected'), 'bad');
      else errToast(p.err);
      return;
    }
    toast(L('shop.ton_wait'), '', 'ton');

    for (let i = 0; i < 30; i++) {

  const r = sc ? sc.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 3, width: 0, height: 0 };
  const x = r.left + r.width / 2, y = r.top + r.height / 2;
  flyTo(x, y, '.pill.cash', I('coin', 16), d.game.score >= 8 ? 12 : 7);
  if (d.gemGain) flyTo(x, y, '.pill.gem', I('gem', 16), 3);
  if (d.game.score >= 8) shake(d.game.score >= 9);
}
function centerFly(sel, html, n) { flyTo(innerWidth / 2, innerHeight * 0.45, sel, html, n); }

/* ---------- engine → UI events ---------- */
hooks.emit = function (type, data) {
  if (!UI.booted) return;
  if (type === 'sfx') sfx(data);
  else if (type === 'release') {
    releaseJuice(data);
    // a big celebration for the first releases and for hits; later routine releases get a toast
    if (S.stats.released <= 3 || data.game.score >= 8.5 || data.gemGain) modalOrQueue(() => showRelease(data));
    else { toast(L('toast.release', { name: data.game.name, score: data.game.score.toFixed(1) }), data.game.score >= 7 ? 'good' : '', 'games'); if (data.game.score >= 7) confettiSmall(); }
  }
  else if (type === 'goal') { toast(L('toast.goal', { t: '$goal.' + data.id }), 'good', 'star'); }
  else if (type === 'event') { toast(L('toast.event', { t: '$ev.' + data.id + '.title' }), 'good', 'quest'); modalOrQueue(showEvent); }
  else if (type === 'day') toast(L('toast.day', { n: data.day, inc: money(data.income), sal: money(data.salary) }), '');
  else if (type === 'toast') toast(L(data.k), data.kind);
  else if (type === 'ending') modalOrQueue(showEnding);
  else if (type === 'ipo') toast(L('toast.ipo', { n: data.n }), 'good', 'crown');
  else if (type === 'bug') { sfx('blip'); updateSceneFx(); if (!lsGet('od2_bug_hint')) { lsSet('od2_bug_hint', '1'); toast(L('bug.hint'), 'bad', 'star'); } }
  else if (type === 'bugEscaped') { toast(L('bug.escaped', { n: fmt(data.loss) }), 'bad'); updateSceneFx(); }
  else if (type === 'idea') { sfx('pop'); updateSceneFx(); if (!lsGet('od2_idea_hint')) { lsSet('od2_idea_hint', '1'); toast(L('idea.hint'), 'good', 'star'); } }
};

/* ---------- network → UI ---------- */
UIH.onEco = (e) => {
  UI.ecoVer = (UI.ecoVer || 0) + 1;
  const el = $('#hudpts');
  if (el) countUp(el, e.pts, 900, fmtPts);
  const big = $('#bigpts');
  if (big) countUp(big, e.pts, 900, fmtPts);
};
UIH.onGain = (g) => {
  const el = $('#hudpts');
  if (!el) return;
  const r = el.getBoundingClientRect();
  floatText(r.left + r.width / 2, r.bottom + 4, '+' + fmtPts(g), 'pts');
  const pill = el.closest('.pill');
  if (pill) { pill.classList.remove('flash'); void pill.offsetWidth; pill.classList.add('flash'); }
};
UIH.onState = () => { UI.lastSig = ''; };
UIH.onStatus = () => render(true);
UIH.onOffline = (sec, cash) => { if (cash >= 1) modalOrQueue(() => showOffline(sec, cash)); };
UIH.onChallenge = (ch) => showChallenge(ch);
UIH.onRefAct = () => { toast(L('toast.ref_act'), 'good', 'users'); confetti(100); loadHub('friends', true); };
UIH.onDropped = (err) => toast(L(err === 'clock' ? 'toast.clock' : 'toast.synced'), err === 'clock' ? 'bad' : '');
UIH.onFatal = () => openModal(`<div class="center">${I('info', 30)}<h2 class="h2">${L('boot.session')}</h2><p class="sub">${L('boot.session_t')}</p><button class="btn big" data-act="retry">${L('boot.retry')}</button></div>`, { sticky: true, id: 'fatal' });
UIH.onWallet = (r) => {
  if (r && r.ok) {
    UI.walletFriendly = r.friendly || '';
    toast(L(r.level ? 'wallet.ok_verified' : 'wallet.ok'), 'good', 'ton');
    confettiSmall();
    loadHub('tasks', true);
  } else errToast((r && r.err) || 'address');
  render(true);
};

/* ---------- main loop ---------- */
function frame(now) {
  const dt = Math.min(0.25, Math.max(0, (now - (UI.last || now)) / 1000));
  UI.last = now;
  if (S) {
    UI.acc = (UI.acc || 0) + dt * (NET.mode === 'demo' ? NET.speed : 1);
    let n = 0;
    while (UI.acc >= TICK && n < 40) { UI.acc -= TICK; advanceTicks(S, 1); n++; }
    if (UI.tapFlash > 0) UI.tapFlash = Math.max(0, UI.tapFlash - dt);
    netPump(Date.now());
    UI.liveAcc += dt;
    // while the battle arena is open the office behind it is not redrawn (all the phone's power goes to the fight)
    if (UI.liveAcc >= 0.2 && !UI.pvp) { UI.liveAcc = 0; render(); live(); tutUpdate(); }
    UI.sceneAcc += dt;
    if (UI.sceneAcc >= 0.045 && !UI.pvp) { UI.sceneAcc = 0; drawScene(now / 1000); }
    UI.towerAcc += dt;
    if (UI.towerAcc >= 0.25) { UI.towerAcc = 0; drawTowerCv(now / 1000); }
  }
  requestAnimationFrame(frame);
}

/* ---------- input wiring ---------- */
function wireInput() {
  document.addEventListener('pointerdown', vfxRipple, { passive: true });
  // donation amount typed by hand: keep it without re-rendering (so the keyboard stays open)
  document.addEventListener('input', (e) => {
    if (!e.target || e.target.id !== 'donin') return;
    UI.donAmt = Number(e.target.value) || 0;
    const n = donAmount();
    const b = $('[data-act="donstars"]');
    if (b) b.textContent = '⭐ ' + L('don.give', { n: fmt(n) });
    const d = UI.hub.donate || {};
    const t = $('[data-act="donton"]');
    if (t && d.ton) t.innerHTML = I('ton', 14) + ' ' + Math.max(d.tonMin || 1, Math.round(n * (d.tonPerStar || 0.011) * 10) / 10) + ' TON';
    document.querySelectorAll('.don-chips .chip').forEach((c) => c.classList.toggle('on', c.dataset.act === 'donamt:' + n));
  });
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    if (el.closest('.ovl') === null && UI.modal && !$('#ovl').hidden) return;
    ensureAudio();
    musicSync();
    const parts = el.dataset.act.split(':');
    const f = ACT[parts[0]];
    if (f) f.apply(null, parts.slice(1));
  });
  // the work button reacts on pointerdown (fast tapping), keyboard via click with detail 0
  document.addEventListener('pointerdown', (e) => {
    const b = e.target.closest('#workbtn');
    if (b) { e.preventDefault(); onWorkDown(e); return; }
    if (e.target.id === 'scene' && e.isTrusted !== false) { ensureAudio(); onSceneTap(e); }
  }, { passive: false });
  document.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && document.activeElement && document.activeElement.id === 'workbtn') { e.preventDefault(); onWorkDown(e); }
    if (e.key === 'Escape' && UI.modal) closeModal();
  });
  $('#ovl').addEventListener('click', (e) => { if (e.target.id === 'ovl') closeModal(); });
  document.addEventListener('visibilitychange', () => {
    musicSync();
    if (document.hidden) netFlush();
    else { UI.last = performance.now(); if (NET.mode === 'online') setTimeout(() => netSync(), 300); }
  });
  window.addEventListener('pagehide', () => netFlush());
  window.addEventListener('resize', () => { sizeScene(); });
  if (TG && TG.BackButton) {
    try {
      TG.BackButton.onClick(() => {
        if (UI.modal) closeModal();
        else if (UI.pvp) pvClose();
        else if (UI.tab !== 'office') go('office');
      });
    } catch (e) {}
  }
}

/* ---------- boot ---------- */
function splash(text, err) {
  const sp = $('#splash');
  if (!sp) return;
  const st = $('.sp-status', sp);
  if (st) st.textContent = text || '';
  sp.classList.toggle('err', !!err);
}
async function boot() {
  if (TG) {
    try {
      TG.ready();
      TG.expand();
      if (TG.setHeaderColor) TG.setHeaderColor('#060a26');
      if (TG.setBackgroundColor) TG.setBackgroundColor('#040719');
      if (TG.disableVerticalSwipes) TG.disableVerticalSwipes();
    } catch (e) {}
  }
  const tgLang = TG && TG.initDataUnsafe && TG.initDataUnsafe.user && TG.initDataUnsafe.user.language_code;
  setLang(lsGet('od2_lang') || detectLang(tgLang));
  splash(L('boot.connecting'));
  vfxInit();
  wireInput();
  let res;
  try { res = await netBoot(BUILD.mode === 'demo'); } catch (e) { res = { ok: false, err: 'server' }; }
  if (!res.ok) {
    const sp = $('#splash');
    splash(L('boot.err_' + (res.err === 'no_telegram' ? 'tg' : res.err === 'region' ? 'region' : 'server')), true);
    const box = sp && $('.sp-actions', sp);
    if (box) {
      box.innerHTML = res.err === 'no_telegram' && NET.cfg && NET.cfg.bot
        ? `<button class="btn big glow" data-act="openbot">${L('boot.open_tg')}</button>`
        : res.err === 'region' ? '' : `<button class="btn big" data-act="retry">${L('boot.retry')}</button>`;
    }
    return;
  }
  if (!lsGet('od2_lang') && NET.me && NET.me.lang) setLang(NET.me.lang);
  UI.booted = true;
  tutLoad();
  if (COACH.i < 0 && lsGet('od2_intro')) COACH.i = TUT.length; // players from before the tutorial existed
  render(true);
  const sp = $('#splash');
  if (sp) { sp.classList.add('out'); setTimeout(() => sp.remove(), 700); }
  requestAnimationFrame((t) => { UI.last = t; frame(t); });
  if (!lsGet('od2_intro') && S.stats.taps < 5) setTimeout(showWelcome, 450);
  else if (S.pending) setTimeout(() => modalOrQueue(showEvent), 700);
  if (NET.mode === 'online') { setTimeout(() => loadHub('tasks'), 1500); }
  setTimeout(pvCheckDuel, 1200);
  setTimeout(() => { if (checkinReady() && lsGet('od2_ci') !== String(Math.floor(Date.now() / 86400000))) modalOrQueue(showCheckin); }, 2500);
}

BUILD.mode = "auto"; BUILD.version = "1.4.0";
boot();
})();
</script>
