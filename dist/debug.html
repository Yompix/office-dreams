  } else if (kind === 'phones') {
    B.rect(X - 4, by - 17, 8, 6, hdShade(sh, 0.66)); B.rect(X - 3, by - 16, 6, 4, mixC(look.screen, sh, 0.35)); // print on the back
  } else {
    B.rect(X, by - 23, 1, 19, s2); B.rect(X - 1, by - 8, 3, 4, s2); // blazer seam + vent
    B.poly([[X - 6, by - 24], [X + 6, by - 24], [X + 3, by - 20], [X - 3, by - 20]], hdShade(sh, 0.5)); // collar
  }
  // neck
  B.rect(X - 2, by - 28, 5, 5, sk1);
  // head
  const hx = X, hy = by - 35;
  B.ell(hx - 6.5, hy + 1, 1.6, 2.6, skin); B.ell(hx + 6.5, hy + 1, 1.6, 2.6, sk1); // ears
  B.ell(hx, hy, 6.5, 7, hair);
  B.ell(hx + 2, hy + 1, 4, 5.5, h1); // shading on the far side
  B.ell(hx - 2, hy - 2, 3.5, 4, hair);
  if (kind === 'bun') {
    B.ell(hx, hy - 8, 3.5, 3, hair); B.ell(hx + 1, hy - 7.5, 2, 1.8, h1); B.rect(hx - 1, hy - 10, 2, 1, h2);
    B.line(hx - 4, hy - 12, hx + 4, hy - 5, PAL.yel); B.px(hx + 4, hy - 5, C('#ff8a3d')); // pencil in the bun
  } else if (kind === 'blazer') {
    const sw = Math.round(Math.sin(t * 2.2 + seed) * 1.2);
    B.ell(hx + sw, hy + 8, 2.5, 4, hair); B.ell(hx + sw + 1, hy + 9, 1.5, 3, h1); B.rect(hx - 1 + sw, hy + 4, 3, 2, PAL.mag); // ponytail + scrunchie
  } else if (look.style === 'spiky') {
    for (const [dx, h] of [[-5, 3], [-2, 5], [1, 4], [4, 5]]) B.poly([[hx + dx - 2, hy - 5], [hx + dx + 2, hy - 5], [hx + dx + 1, hy - 5 - h]], hair);
  }
  // hair highlights
  B.rect(hx - 4, hy - 5, 3, 1, h2); B.rect(hx - 5, hy - 3, 1, 3, h2); B.px(hx - 1, hy - 6, h2);
  if (kind === 'phones') {
    B.arc(hx, hy - 1, 7.5, 8, 0.15, Math.PI - 0.15, PAL.cyan, 2);
    B.ell(hx - 7.5, hy + 1, 2, 3, C('#141845')); B.ell(hx + 7.5, hy + 1, 2, 3, C('#141845'));
    B.px(hx - 8, hy, PAL.cyan); B.px(hx + 8, hy, PAL.cyan);
  }
  if (mood < 35) { B.px(hx + 7, hy - 6, C('#7ac8ff')); B.px(hx + 7, hy - 5, C('#7ac8ff')); } // sweat drop

function drawCat(B, x, y, t) {
  const k = C('#14142b'), k2 = C('#2a2a4d'), e = C('#ffe14d');
  // body
  B.rect(x - 4, y - 4, 8, 4, k);

  B.px(x - 5, y, k2); B.px(x - 2, y, k2);
}

function drawBadge(B, x, y, kind, t) {
  if (kind === 'plus') {
    if (Math.floor(t * 2.5) % 2) return;
    B.rect(x - 4, y - 4, 9, 9, PAL.ink);
    B.rect(x - 3, y - 3, 7, 7, PAL.grn);
    B.rect(x - 1, y - 2, 3, 5, PAL.white);
    B.rect(x - 2, y - 1, 5, 3, PAL.white);
  } else if (kind === 'warn') {
    if (Math.floor(t * 3) % 2) return;
    B.rect(x - 3, y - 6, 7, 10, PAL.ink);
    B.rect(x - 2, y - 5, 5, 8, PAL.red);
    B.rect(x, y - 4, 1, 4, PAL.white);
    B.rect(x, y + 1, 1, 1, PAL.white);
  } else if (kind === 'bolt') {
    const s = Math.floor(t * 4) % 2;
    B.rect(x, y - 5 - s, 2, 3, PAL.yel);
    B.rect(x - 1, y - 3 - s, 3, 2, PAL.yel);
    B.rect(x - 1, y - 2 - s, 2, 3, PAL.yel);
  } else if (kind === 'zz') {
    const s = Math.floor(t * 1.5) % 3;
    B.rect(x + s, y - 6 - s * 2, 3, 1, C('#c9c6ff'));
    B.px(x + 1 + s, y - 5 - s * 2, C('#c9c6ff'));
    B.rect(x + s, y - 4 - s * 2, 3, 1, C('#c9c6ff'));
  }
}

/* ---------- life outside the window & small ambient touches ---------- */
function inGlass(k, v) { return k >= WIN.k0 + 2 && k <= WIN.k1 - 2 && v >= WIN.v0 + 1 && v <= WIN.v1 - 2; }
function glassPx(B, k, v, c, a) { if (inGlass(k, v)) { if (a === undefined) wallPx(B, 'R', k, v, c); else wallBlend(B, 'R', k, v, c, a); } }
function drawWindowLife(B, st, t) {
  const f = clampN(st.f || 0, 0, 1);
  const night = f > 0.8 || f < 0.04;
  const k0 = WIN.k0 + 2, k1 = WIN.k1 - 2, span = k1 - k0;
  // a plane crossing the sky, its light blinking
  {
    const P = 47, ph = (t % P) / P;
    if (ph < 0.55) {
      const k = Math.round(k1 - (ph / 0.55) * (span + 10));
      const v = 45 + Math.round(Math.sin(ph * 6) * 0.5);
      const body = night ? C('#9aa4d8') : C('#f4f6ff');
      for (let i = 0; i < 5; i++) glassPx(B, k + i, v, body);
      glassPx(B, k + 3, v + 1, body); glassPx(B, k + 2, v - 1, body); glassPx(B, k + 4, v + 1, body);
      if (Math.floor(t * 2.5) % 2) glassPx(B, k + 5, v, PAL.red);
      for (let i = 1; i < 10; i++) glassPx(B, k + 5 + i, v, PAL.white, 0.25 - i * 0.022); // contrail
    }
  }
  // birds by day, shooting stars by night
  if (!night) {
    const P = 29, ph = (t % P) / P;
    if (ph < 0.6) {
      const base = k0 + (ph / 0.6) * (span + 16) - 8;
      for (let b = 0; b < 3; b++) {
        const k = Math.round(base - b * 5), v = 38 + b * 2 + Math.round(Math.sin(t * 3 + b) * 1);
        const flap = Math.floor(t * 6 + b) % 2;
        const col = C('#1d1f4a');
        glassPx(B, k, v, col); glassPx(B, k - 1, v + flap, col); glassPx(B, k + 1, v + flap, col);
      }
    }
  } else {
    const P = 13, ph = (t % P) / P;
    if (ph < 0.12) {
      const q = ph / 0.12, k = Math.round(k0 + 12 + q * 40), v = Math.round(48 - q * 10);
      for (let i = 0; i < 6; i++) glassPx(B, k - i, v + Math.round(i / 4), PAL.white, 0.9 - i * 0.14);
    }
  }
  // rain on the glass while the rainy track plays
  if (st.rain) {
    for (let i = 0; i < 26; i++) {
      const k = k0 + Math.floor(hash01(i * 7 + 1) * span);
      const v = WIN.v1 - 2 - Math.floor(((t * (14 + hash01(i) * 10) + hash01(i * 3) * 40) % 34));
      glassPx(B, k, v, C('#bfe6ff'), 0.55); glassPx(B, k, v + 1, C('#bfe6ff'), 0.3);
    }
  }
}
// neon sign hum: now and then one word flickers
function drawNeonFlicker(B, t) {
  const w = Math.floor(t / 3.7) % wordsNow().length;
  const on = (t % 3.7) < 0.18 && Math.floor(t * 20) % 2 === 0;
  if (!on) return;
  const k0 = 22, k1 = 60;
  const word = wordsNow()[w][0];
  const tw = textWidth(word);
  const kk = k0 + 1 + Math.floor((k1 - k0 - 1 - tw) / 2);
  wallGlyphs(B, 'L', kk, 46 - w * 8 - 1, word, C('#1a1d4a'), null);
}
// golden dust floating in the window light by day
function drawDust(B, st, t) {
  const f = clampN(st.f || 0, 0, 1);
  if (f > 0.78) return;
  for (let i = 0; i < 14; i++) {
    const gx = 4.6 + hash01(i * 5) * 3.6, gy = 1.2 + hash01(i * 11) * 3.2;
    const z = 14 + ((t * (2 + hash01(i) * 3) + hash01(i * 2) * 30) % 30);
    const p = P(gx + Math.sin(t * 0.6 + i) * 0.15, gy, z);
    B.blend(p[0], p[1], C('#fff2c4'), 0.35 + 0.3 * Math.sin(t * 2 + i));
  }
}

/* ---------- dynamic layer ---------- */
function drawDynamic(B, st, t) {
  drawWindowLife(B, st, t);
  drawNeonFlicker(B, t);
  const items = st.items || {};
  const typingGlobal = !!st.working;
  const frame = Math.floor(t * 5) % 2;
  // clock hands (left wall)
  {
    const mins = Math.floor((st.f || 0) * 720) + 480;
    const hh = (mins / 60) % 12, mm = mins % 60;
    const kc = 82, vc = 38;
    const hand = (len, ang, col) => {
      for (let r = 0; r <= len; r++) wallPx(B, 'L', kc + Math.round(Math.sin(ang) * r), vc + Math.round(Math.cos(ang) * r), col);
    };
    hand(3, (hh / 12) * Math.PI * 2, PAL.white);
    hand(5, (mm / 60) * Math.PI * 2, PAL.mag);
  }
  const list = [];
  const add = (key, fn) => list.push({ key, fn });

  // stations
  const order = ['prog', 'art', 'des', 'mkt'];
  order.forEach((role, idx) => {
    const s = STATION[role];
    const info = (st.staff && st.staff[role]) || { lvl: 0, mood: 80 };
    const look = LOOK[role];
    const hired = info.lvl > 0;
    const key = (s.side === 'R' ? s.gx + 2 + s.chair[1] + 0.5 : s.gy + 2 + s.chair[0] + 0.5);
    add(key, () => {
      drawDesk(B, s);
      drawMonitor(B, s, look, hired, t, idx + 1, role, hired && typingGlobal);
      // mug
      if (s.side === 'R') isoBox(B, s.gx + 0.15, s.gy + 0.6, 13, 0.2, 0.2, 3, C('#ffffff'), C('#d9d9ff'), C('#aaaadd'));
      else isoBox(B, s.gx + 0.6, s.gy + 0.15, 13, 0.2, 0.2, 3, C('#ffffff'), C('#d9d9ff'), C('#aaaadd'));
      const chairAccent = items.chairs ? C('#22b8d6') : C('#3b3f99');
      drawChairParts(B, s, chairAccent);
      const a = P(s.chair[0], s.chair[1], 9);
      if (hired) {
        const badge = (BB) => {
          if (info.mood < 35) drawBadge(BB, a[0] + 8, a[1] - 22, 'warn', t);
          else if (st.turbo) drawBadge(BB, a[0] + 7, a[1] - 22, 'bolt', t);
          else if (!typingGlobal) drawBadge(BB, a[0] + 6, a[1] - 22, 'zz', t);
        };
        if (HDQ) {
          // a lower mesh backrest in HD so the shoulders and back of the worker show
          HDQ.push((H) => { PS = 2; drawLegsHD(H, s.chair[0], s.chair[1], s.side === 'R' ? [0, -1] : [-1, 0], PANTS[role], t, idx, typingGlobal); PS = 1; drawWorkerHD(H, a[0] * 2, a[1] * 2, look, role, typingGlobal, t, idx, info.mood); PS = 2; drawChairBack(H, s, shadeC(chairAccent, 0.6), 5.5); PS = 1; badge(up2(H)); });
        } else {
          drawWorkerBack(B, a[0], a[1], look, typingGlobal, frame, t);
          drawChairBack(B, s, chairAccent);
          badge(B);
        }
      } else {
        drawChairBack(B, s, chairAccent);
        if (st.canHire && st.canHire[role]) drawBadge(B, a[0], a[1] - 12, 'plus', t);
      }
    });
  });

  // player station (center)
  add(12.3, () => {
    const cx = 5.1, cy = 5.1;
    const chairAccent = items.chairs ? C('#22b8d6') : C('#3b3f99');
    isoQuad(B, cx - 0.5, cy - 0.5, cx + 0.5, cy + 0.5, 0, C('#241660'));
    isoBox(B, cx - 0.08, cy - 0.08, 0, 0.16, 0.16, 6, C('#252a66'), C('#1a1e4d'), C('#12163a'));
    // backrest (behind the player)
    isoBox(B, cx - 0.42, cy - 0.3, 9, 0.1, 0.6, 11, shadeC(chairAccent, 1.2), chairAccent, shadeC(chairAccent, 0.6));
    isoBox(B, cx - 0.36, cy - 0.36, 6, 0.72, 0.72, 3, chairAccent, shadeC(chairAccent, 0.78), shadeC(chairAccent, 0.6));
    const a = P(cx, cy, 9);
    const blink = (t % 4.2) > 4.0, typingP = typingGlobal || st.tapFlash > 0;
    const desk = (DB) => {
      const H = 13;
      isoBox(DB, 5.9, 4.4, 0, 0.1, 0.12, H - 3, PAL.woodL, PAL.woodL, PAL.woodR);
      isoBox(DB, 5.9, 6.52, 0, 1.2, 0.12, H - 3, PAL.woodL, PAL.woodL, PAL.woodR);
      isoBox(DB, 6.9, 4.4, 0, 0.1, 0.12, H - 3, PAL.woodL, PAL.woodL, PAL.woodR);
      isoBox(DB, 5.9, 4.4, H - 3, 1.2, 2.24, 3, PAL.woodT, PAL.woodL, PAL.woodR, PAL.woodE);
      // laptop (lid facing +gx)
      isoBox(DB, 6.05, 5.1, H, 0.45, 0.6, 1, C('#2b2f66'), C('#1a1d45'), C('#14163a'));
      isoBox(DB, 6.45, 5.1, H, 0.07, 0.6, 9, C('#3a3f8a'), C('#2a2e72'), C('#1d2058'));
      const lp = P(6.52, 5.4, H + 5);
      DB.rect(lp[0], lp[1], 2 * PS, PS, t % 1.6 < 0.9 ? PAL.cyan : PAL.mag);
      DB.glow(lp[0] - 9 * PS, lp[1] + 4 * PS, 14 * PS, PAL.cyan, 0.1);
      if (items.monitor2) drawMonitor2(DB, t);
      isoBox(DB, 6.1, 4.55, H, 0.2, 0.2, 3, C('#ffffff'), C('#d9d9ff'), C('#aaaadd'));
    };
    const cp = P(6.5, 6.1, 13);
    if (HDQ) {
      desk(B);
      HDQ.push((HB) => { PS = 2; drawLegsHD(HB, cx, cy, [1, 0], PANTS.you, t, 0, typingP); PS = 1; drawPlayerHD(HB, a[0] * 2, a[1] * 2, t, typingP, blink, st.tapFlash > 0); PS = 2; desk(HB); PS = 1; drawCatHD(HB, cp[0] * 2, cp[1] * 2, t); });
    } else {
      drawPlayerFront(B, a[0], a[1], t, typingP, frame, blink);
      desk(B);
      drawCat(B, cp[0], cp[1], t);
    }
  });

  // a courier walks around the office now and then (pure function of time)
  {
    const period = 34, ph = (t % period) / period;
    if (ph < 0.62) {
      const path = [[1.7, 8.35], [8.35, 8.35], [8.35, 3.2]];
      const q = ph / 0.62; // 0..1 along out-and-back
      const u = q < 0.5 ? q * 2 : (1 - q) * 2;
      const segA = Math.hypot(path[1][0] - path[0][0], path[1][1] - path[0][1]), segB = Math.hypot(path[2][0] - path[1][0], path[2][1] - path[1][1]);
      let d = u * (segA + segB), gx, gy;
      if (d < segA) { gx = path[0][0] + (path[1][0] - path[0][0]) * (d / segA); gy = path[0][1]; }
      else { d -= segA; gx = path[1][0]; gy = path[1][1] + (path[2][1] - path[1][1]) * (d / segB); }
      const pause = Math.abs(u - 1) < 0.04;
      add(gx + gy, () => {
        if (HDQ) { const p = P(gx, gy, 0); HDQ.push((H) => drawWalkerHD(H, p[0] * 2, p[1] * 2, t, pause)); }
        else drawWalker(B, gx, gy, pause ? 0 : Math.floor(t * 6) % 2, t, pause);
      });
    }
  }
  // the later hires at their own spots
  ['qa', 'snd', 'prod', 'cm'].forEach((role, i) => {
    const info = st.staff && st.staff[role];
    if (!info || info.lvl <= 0) return;
    const sp = STAND[role], look = LOOK[role];
    if (sp.pose === 'mix') add(sp.gx + sp.gy + 0.5, () => drawConsole(B, sp.gx, sp.gy, t));
    add(sp.gx + sp.gy, () => {
      const p = P(sp.gx, sp.gy, 0);
      if (HDQ) HDQ.push((H) => { drawStandHD(H, p[0] * 2, p[1] * 2, look, sp.pose, t, i * 1.7); if (sp.pose === 'mix') { PS = 2; drawConsole(H, sp.gx, sp.gy, t); PS = 1; } });
      else drawStandLow(B, p[0], p[1], look, sp.pose, t);
    });
  });
  // plants
  add(3.0, () => drawPlant(B, 0.55, 0.6, t, 1, true));
  add(20, () => drawPlant(B, 8.55, 0.6, t, 2, true));
  add(21, () => drawPlant(B, 0.6, 8.5, t, 3, true));
  if (items.coffee) add(2.6, () => drawCoffee(B, t));
  if (items.rack) add(3.1, () => drawRack(B, t));
  if (items.lamp) add(9.9, () => drawLamp(B, t));
  if (items.lounge) add(14.5, () => drawLounge(B, t));

  list.sort((a, b) => a.key - b.key);
  for (const o of list) o.fn();
  drawDust(B, st, t);
  drawParticles(B, st, t);
}

function drawWalker(B, gx, gy, frame, t, pause) {
  const p = P(gx, gy, 0);
  const x = p[0], y = p[1];
  const L = LOOK.npc;
  // shadow
  B.blend(x - 3, y, PAL.ink, 0.35); B.blend(x - 2, y, PAL.ink, 0.45); B.blend(x - 1, y, PAL.ink, 0.5); B.blend(x, y, PAL.ink, 0.5); B.blend(x + 1, y, PAL.ink, 0.45); B.blend(x + 2, y, PAL.ink, 0.35);
  // legs
  const lo = frame ? 1 : 0;
  B.rect(x - 2, y - 4 + lo, 2, 4 - lo, C('#262b66'));
  B.rect(x + 1, y - 4 + (1 - lo), 2, 4 - (1 - lo), C('#262b66'));
  // body + box
  B.rect(x - 3, y - 10, 7, 6, L.shirt);
  B.rect(x - 2, y - 9, 6, 4, C('#c98a4b')); B.rect(x - 2, y - 9, 6, 1, C('#e3a86a')); B.px(x + 1, y - 8, C('#74461f'));
  // head
  B.rect(x - 2, y - 15, 5, 5, L.skin);
  B.rect(x - 2, y - 16, 5, 2, L.hair);
  B.px(x - 1, y - 13, PAL.ink); B.px(x + 1, y - 13, PAL.ink);
  // cap
  B.rect(x - 3, y - 16, 7, 1, PAL.cyan);
  if (pause && Math.floor(t * 2) % 2) { B.rect(x + 4, y - 22, 5, 5, PAL.white); B.px(x + 6, y - 21, PAL.mag); B.px(x + 5, y - 20, PAL.mag); B.px(x + 7, y - 20, PAL.mag); B.px(x + 6, y - 19, PAL.mag); }
}

/* ---------- ambient particles (pure function of time → no state) ---------- */
function drawParticles(B, st, t) {
  const cols = [PAL.cyan, PAL.mag, PAL.yel, PAL.grn];
  if (ERA && ERA.id === 'tokyo') { // cherry petals drifting through the office
    for (let i = 0; i < 16; i++) {
      const sp = 9 + hash01(i * 5) * 7, x = Math.round(((hash01(i * 13) * B.w + t * sp * 0.9) % (B.w + 20)) - 10 + Math.sin(t * 1.3 + i) * 4);
      const y = Math.round((hash01(i * 7 + 2) * B.h + t * sp) % B.h);
      const c = i % 3 ? C('#ffb0d8') : C('#ffd8ec');
      B.px(x, y, c); if ((Math.floor(t * 3) + i) % 2) B.px(x + 1, y, shadeC(c, 0.85));
    }
  }
  // code bits rising from the screens of employees who are working
  if (st.working) {
    ['prog', 'art', 'des', 'mkt'].forEach((role, ri) => {
      const info = st.staff && st.staff[role];
      if (!info || info.lvl <= 0) return;
      const s = STATION[role];
      const base = s.side === 'R' ? P(s.gx + 0.6, s.gy + 0.4, 24) : P(s.gx + 0.4, s.gy + 0.6, 24);
      const n = st.turbo ? 4 : 2;
      for (let i = 0; i < n; i++) {
        const ph = (t * (0.5 + 0.1 * i) + hash01(ri * 17 + i * 5)) % 1;
        const x = base[0] + Math.round((hash01(ri * 31 + i * 11 + Math.floor(t * 0.5 + i)) - 0.5) * 10);
        const y = base[1] - Math.round(ph * 20);
        const c = cols[(ri + i) % 4];
        B.blend(x, y, c, 1 - ph);
        B.blend(x + 1, y, c, (1 - ph) * 0.7);
        if (i % 2 === 0) B.blend(x, y - 1, c, (1 - ph) * 0.5);
      }
    });
  }
  // hype: golden coins float up across the floor
  if (st.hype) {
    for (let i = 0; i < 7; i++) {
      const ph = (t * 0.35 + hash01(i * 23)) % 1;
      const g = P(1 + hash01(i * 7) * 7, 1 + hash01(i * 13) * 7, Math.round(ph * 40));
      B.blend(g[0], g[1], PAL.yel, 1 - ph);
      B.blend(g[0] + 1, g[1], C('#c8841a'), 1 - ph);
      B.blend(g[0], g[1] + 1, C('#c8841a'), 1 - ph);
      B.blend(g[0] + 1, g[1] + 1, PAL.yel, (1 - ph) * 0.8);
    }
  }
  // tap: sparks around the founder's laptop
  if (st.tapFlash > 0) {
    const a = P(6.3, 5.4, 18);
    const k = st.tapFlash / 0.5;
    for (let i = 0; i < 6; i++) {
      const ang = i * 1.047 + t * 3;
      const r = 4 + (1 - k) * 10;
      B.blend(a[0] + Math.round(Math.cos(ang) * r), a[1] + Math.round(Math.sin(ang) * r * 0.6), cols[i % 4], k);
    }
    B.glow(a[0], a[1], 10, PAL.cyan, 0.25 * k);
  }
  // dust motes drifting in the window light
  for (let i = 0; i < 8; i++) {
    const ph = (t * 0.05 + hash01(i * 41)) % 1;
    const x = 140 + Math.round(hash01(i * 3) * 100 + Math.sin(t * 0.7 + i) * 3);
    const y = 40 + Math.round(ph * 70);
    B.blend(x, y, PAL.white, 0.25 * Math.sin(ph * Math.PI));
  }
}

/* ---------- scene object ---------- */
/* ============================================================
   HD pass: the room is drawn at 256×176, then upscaled ×2 with Scale2x (EPX) so diagonals

    B.rect(Math.floor(W * 0.3), Math.floor(H * 0.35), Math.floor(W * 0.4), gy - Math.floor(H * 0.35), shadeC(A, 0.4));
    B.rect(Math.floor(W * 0.3), Math.floor(H * 0.3), 3, 4, shadeC(A, 0.4));
    B.rect(Math.floor(W * 0.5) - 1, Math.floor(H * 0.3), 3, 4, shadeC(A, 0.4));
    B.rect(Math.floor(W * 0.7) - 3, Math.floor(H * 0.3), 3, 4, shadeC(A, 0.4));
    B.rect(Math.floor(W * 0.46), Math.floor(H * 0.55), 4, gy - Math.floor(H * 0.55), C('#ffd23f'));
  } else if (genre === 'plat') {
    B.rect(Math.floor(W * 0.1), Math.floor(H * 0.55), Math.floor(W * 0.3), 2, PAL.yel);
    B.rect(Math.floor(W * 0.55), Math.floor(H * 0.42), Math.floor(W * 0.3), 2, PAL.yel);
    B.rect(Math.floor(W * 0.25), gy - 6, 4, 6, PAL.white);

  } else if (genre === 'shoot') {

    B.rect(cx - 7, cy, 5, 1, PAL.white); B.rect(cx + 3, cy, 5, 1, PAL.white); B.rect(cx, cy - 7, 1, 5, PAL.white); B.rect(cx, cy + 3, 1, 5, PAL.white);
    B.rect(cx - 1, cy - 1, 3, 3, PAL.red);
  } else if (genre === 'sim') {
    for (let i = 0; i < 4; i++) {
      const bw = Math.floor(W / 6), bh = 6 + Math.floor(r(i) * 14);
      B.rect(Math.floor(W * 0.08) + i * (bw + 1), gy - bh, bw, bh, shadeC(Bc, 0.5 + r(i + 9) * 0.5));
      B.px(Math.floor(W * 0.08) + i * (bw + 1) + 2, gy - bh + 2, PAL.yel);
    }

    B.glow(Math.floor(W * 0.7), Math.floor(H * 0.25), 9, PAL.white, 0.6);
    B.rect(Math.floor(W * 0.7) - 3, Math.floor(H * 0.25) - 3, 7, 7, C('#e9e6ff'));
    B.rect(Math.floor(W * 0.28), gy - 12, 8, 12, C('#cfcaf5'));
    B.rect(Math.floor(W * 0.28) + 2, gy - 9, 1, 2, PAL.ink); B.rect(Math.floor(W * 0.28) + 5, gy - 9, 1, 2, PAL.ink);

      B.rect(Math.floor(W * 0.18) + i * (bs + 1), Math.floor(H * 0.2) + j * (bs + 1), bs, bs, cols[Math.floor(r(i * 3 + j) * 4)]);

function drawTower(B, floorsOwned, t, build, flv) {
  // build: {row, k, reno} — the floor being built or renovated (row 0 = f5 … 4 = f1, 5 = basement), k 0..1 progress
  // front-facing tower. floorsOwned: {b,f1..f5}; flv: renovation stars per floor. 80x124
  const W = B.w, H = B.h;
  const lv = flv || {};
  for (let y = 0; y < H; y++) B.rect(0, y, W, 1, mixC(C('#0a0d2c'), C('#241b62'), y / H));
  // twinkling stars
  for (let i = 0; i < 26; i++) {
    const tw = 0.4 + hash01(i) * 0.4 + 0.2 * Math.sin(t * (1 + hash01(i + 9) * 2) + i);
    B.px(Math.floor(hash01(i * 3 + 7) * W), Math.floor(hash01(i * 5 + 1) * 46), mixC(C('#0a0d2c'), C('#c9d2ff'), Math.max(0.15, Math.min(1, tw))));
  }
  // drifting clouds
  for (let c = 0; c < 2; c++) {
    const cx = Math.floor(((t * (1.6 + c) + c * 47) % (W + 30)) - 15), cy = 10 + c * 17;
    for (let i = 0; i < 12; i++) B.blend(cx + i, cy + (i > 2 && i < 9 ? -1 : 0), C('#8f97e8'), 0.16);
    for (let i = 3; i < 9; i++) B.blend(cx + i, cy - 2, C('#8f97e8'), 0.12);
  }
  const bw = 52, bx = Math.floor((W - bw) / 2);
  const rows = 5, fh = 17, topY = 18;
  const groundY = topY + rows * fh;
  const ids = ['f5', 'f4', 'f3', 'f2', 'f1'];
  const ownedList = ids.map((id) => floorsOwned[id]);
  const accents = [PAL.yel, PAL.cyan, PAL.mag, PAL.grn, PAL.blu];
  const allStars = ['b', 'f1', 'f2', 'f3', 'f4', 'f5'].reduce((n, id) => n + (lv[id] || 0), 0);
  // searchlights once the top floor is open
  if (floorsOwned.f5) {
    for (let k = 0; k < 2; k++) {
      const ang = Math.sin(t * 0.7 + k * 2.4) * 0.6 + (k ? 0.5 : -0.5);
      const ox = bx + Math.floor(bw / 2) + (k ? 6 : -6), oy = topY - 8;
      for (let d = 2; d < 40; d++) {
        const x = Math.round(ox + Math.sin(ang) * d), y = Math.round(oy - Math.cos(ang) * d);
        if (y < 0) break;
        B.blend(x, y, k ? PAL.cyan : PAL.mag, 0.22 * (1 - d / 40));
        B.blend(x + 1, y, k ? PAL.cyan : PAL.mag, 0.12 * (1 - d / 40));
      }
    }
  }
  for (let r = 0; r < rows; r++) {
    const y = topY + r * fh;
    const id = ids[r];
    const st = lv[id] || 0;
    const building = build && build.row === r && !build.reno;
    const renoing = build && build.row === r && build.reno;
    const own = building ? build.k >= 0.15 : !!ownedList[r];
    const shownSt = renoing ? Math.max(0, st - (build.k < 0.8 ? 1 : 0)) : st;
    B.rect(bx, y, bw, fh, own ? (shownSt >= 3 ? C('#24338a') : C('#1d2a73')) : C('#10143a'));
    B.rect(bx, y, bw, 1, own ? accents[r] : C('#262b66'));
    B.rect(bx, y, 1, fh, C('#0a0d2c')); B.rect(bx + bw - 1, y, 1, fh, C('#0a0d2c'));
    for (let w = 0; w < 5; w++) {
      const wx = bx + 4 + w * 9, wy = y + 4;
      let col = C('#161a4a');
      if (building && build.k < 0.15 + (w + 1) * 0.15) { B.rect(wx, wy, 7, 8, C('#161a4a')); continue; }
      if (own) {
        const h = hash01(r * 17 + w * 5);
        col = h < 0.34 ? PAL.cyan : h < 0.67 ? PAL.mag : PAL.yel;
        // renovated floors are busier: fewer dark windows
        if (hash01(r * 3 + w + Math.floor(t * 0.5)) < 0.12 - shownSt * 0.02) col = mixC(col, C('#161a4a'), 0.6);
      }
      B.rect(wx, wy, 7, 8, col);
      if (own) B.rect(wx, wy + 7, 7, 1, shadeC(col, 0.6));
    }
    if (own && shownSt >= 3) {
      // people walking past the windows
      for (let p = 0; p < (shownSt >= 5 ? 2 : 1); p++) {
        const span = 44, px = bx + 4 + Math.floor((t * (5 + p * 3) + r * 13 + p * 20) % span);
        const dir = Math.floor((t * (5 + p * 3) + r * 13 + p * 20) / span) % 2;
        const x = dir ? bx + 4 + span - (px - bx - 4) : px;
        B.rect(x, y + 7, 2, 5, C('#0b0e30'));
        B.rect(x, y + 6, 2, 1, C('#0b0e30'));
      }
    }
    if (own && shownSt >= 2) {
      // neon trim under the floor, breathing
      const a = 0.55 + 0.45 * Math.sin(t * 2 + r);
      for (let i = 1; i < bw - 1; i++) B.blend(bx + i, y + fh - 1, accents[r], a);
    }
    if (own && shownSt >= 4) {
      // blinking side sign
      const on = Math.floor(t * 2 + r) % 3 !== 0;
      B.rect(bx + bw, y + 3, 2, fh - 6, on ? accents[(r + 2) % 5] : C('#2a2f66'));
      if (on) B.glow(bx + bw + 1, y + Math.floor(fh / 2), 3, accents[(r + 2) % 5], 0.35);
    }
    if (own && shownSt >= 5) {
      B.rect(bx, y, bw, 1, PAL.yel);
      if (hash01(Math.floor(t * 3) + r * 7) > 0.8) B.glow(bx + 2 + Math.floor(hash01(Math.floor(t * 3) + r) * (bw - 4)), y + 2, 3, PAL.yel, 0.8);
    }
    // renovation stars on the floor's left edge
    for (let i = 0; i < shownSt; i++) B.px(bx - 2, y + 2 + i * 3, PAL.yel);
    if (building && build.k < 1) {
      // scaffolding + sparks while the floor is being built
      for (let i = 0; i < bw; i += 4) B.px(bx + i, y + ((i / 4) % 2 ? 2 : fh - 3), C('#ffd23f'));
      B.rect(bx - 3, y, 1, fh, C('#c8841a')); B.rect(bx + bw + 2, y, 1, fh, C('#c8841a'));
      const sx = bx + Math.floor(hash01(Math.floor(t * 12)) * bw), sy = y + Math.floor(hash01(Math.floor(t * 12) + 7) * fh);
      B.glow(sx, sy, 4, PAL.yel, 0.9);
    }
    if (renoing && build.k < 1) {
      // a sweep of light across the renovated floor, sparkles behind it
      const sx = bx + Math.floor(build.k * bw);
      for (let yy = y; yy < y + fh; yy++) { B.blend(sx, yy, C('#ffffff'), 0.85); B.blend(sx - 1, yy, PAL.yel, 0.6); B.blend(sx - 2, yy, PAL.yel, 0.3); }
      for (let i = 0; i < 3; i++) {
        const gx = bx + Math.floor(hash01(Math.floor(t * 14) + i * 5) * Math.max(1, sx - bx)), gy = y + Math.floor(hash01(Math.floor(t * 14) + i * 9 + 3) * fh);
        B.glow(gx, gy, 3, i % 2 ? PAL.yel : PAL.cyan, 0.85);
      }
    }
    if (!own && !building) {
      // lock
      const lx = bx + Math.floor(bw / 2) - 3, ly = y + 5;
      B.rect(lx, ly + 3, 7, 6, C('#5b63c7'));
      B.rect(lx + 1, ly, 5, 3, C('#5b63c7')); B.rect(lx + 2, ly + 1, 3, 2, C('#10143a'));
      B.rect(lx + 3, ly + 5, 1, 2, C('#10143a'));
    }
  }
  // elevator running between the open floors
  const ownedRows = [];
  for (let r = 0; r < rows; r++) if (ownedList[r]) ownedRows.push(r);
  if (ownedRows.length >= 2) {
    const ex = bx + bw - 4;
    const top = topY + ownedRows[0] * fh + 3, bot = topY + (rows - 1) * fh + fh - 6;
    B.rect(ex, top, 2, bot - top + 4, C('#0d1140'));
    const ph = (Math.sin(t * 0.6) + 1) / 2;
    const ey = Math.round(top + (bot - top) * ph);
    B.rect(ex, ey, 2, 4, PAL.yel);
    B.blend(ex - 1, ey + 1, PAL.yel, 0.35); B.blend(ex + 2, ey + 1, PAL.yel, 0.35);
  }
  // roof
  B.rect(bx - 2, topY - 4, bw + 4, 4, C('#2a2f80'));
  B.rect(bx - 2, topY - 4, bw + 4, 1, floorsOwned.f5 ? PAL.yel : C('#4a50b0'));
  B.rect(bx + 10, topY - 8, bw - 20, 4, floorsOwned.f5 ? PAL.mag : C('#3a2060'));
  B.rect(bx + Math.floor(bw / 2), topY - 18, 1, 10, C('#8a90e0'));
  if (Math.floor(t * 1.4) % 2) B.rect(bx + Math.floor(bw / 2) - 1, topY - 20, 3, 3, PAL.red);
  if (allStars >= 30) {
    // "Tower legend": a golden crown on the roof and fireworks over the city
    const cx = bx + Math.floor(bw / 2);
    B.rect(cx - 6, topY - 12, 13, 3, PAL.yel);
    B.px(cx - 6, topY - 14, PAL.yel); B.px(cx - 6, topY - 13, PAL.yel); B.px(cx, topY - 15, PAL.yel); B.px(cx, topY - 14, PAL.yel); B.px(cx, topY - 13, PAL.yel); B.px(cx + 6, topY - 14, PAL.yel); B.px(cx + 6, topY - 13, PAL.yel);
    B.px(cx - 3, topY - 11, PAL.red); B.px(cx + 3, topY - 11, PAL.cyan);
    const fw = Math.floor(t / 1.6), fk = (t / 1.6) % 1;
    const fx = 8 + Math.floor(hash01(fw) * (W - 16)), fy = 6 + Math.floor(hash01(fw + 3) * 20);
    const fc = [PAL.mag, PAL.cyan, PAL.yel, PAL.grn][fw % 4];
    if (fk < 0.7) for (let i = 0; i < 8; i++) { const ang = (i / 8) * Math.PI * 2, d = 1 + fk * 9; B.blend(Math.round(fx + Math.cos(ang) * d), Math.round(fy + Math.sin(ang) * d), fc, 1 - fk); }
  }
  // ground
  B.rect(0, groundY, W, 4, C('#1b1f55'));
  B.rect(0, groundY, W, 1, PAL.cyan);
  // a car driving by on the street
  const carX = Math.floor(((t * 9) % (W + 20)) - 10);
  B.rect(carX, groundY + 1, 6, 2, PAL.mag); B.px(carX + 6, groundY + 2, PAL.yel); B.px(carX - 1, groundY + 2, PAL.red);
  // basement
  const by = groundY + 4;
  B.rect(0, by, W, H - by, C('#120f2e'));
  const own = !!floorsOwned.b;
  const bst = lv.b || 0;
  const bReno = build && build.row === 5 && build.reno;
  const bShown = bReno ? Math.max(0, bst - (build.k < 0.8 ? 1 : 0)) : bst;
  B.rect(bx, by, bw, H - by, own ? C('#1a1650') : C('#0e0c26'));
  for (let i = 0; i < 4; i++) {
    const rx = bx + 4 + i * 12;
    B.rect(rx, by + 3, 9, H - by - 5, C('#262b66'));
    for (let l = 0; l < 4; l++) {
      const on = hash01(i * 5 + l + Math.floor(t * (2 + bShown) + i)) > 0.4 - bShown * 0.05;
      B.px(rx + 2, by + 6 + l * 4, own && on ? PAL.grn : C('#1a1d45'));
      B.px(rx + 5, by + 6 + l * 4, own && on ? PAL.cyan : C('#1a1d45'));
    }
  }
  for (let i = 0; i < bShown; i++) B.px(bx - 2, by + 3 + i * 3, PAL.yel);
  if (bReno && build.k < 1) {
    const sx = bx + Math.floor(build.k * bw);
    for (let yy = by; yy < H; yy++) { B.blend(sx, yy, C('#ffffff'), 0.85); B.blend(sx - 1, yy, PAL.yel, 0.5); }
  }
  // door
  B.rect(bx + Math.floor(bw / 2) - 3, groundY - 7, 6, 7, C('#0a0d2c'));
  if (floorsOwned.f1) B.rect(bx + Math.floor(bw / 2) - 3, groundY - 7, 6, 1, PAL.cyan);
}


/* ---- src/net.js ---- */
/* ============================================================
   OFFICE DREAMS — network layer
   online: Telegram auth + authoritative server sync (sync_client.js)
   demo:   everything local (artifact preview / opened outside Telegram
           without a server) — points are simulated, nothing is shared
   ============================================================ */
const TG = (typeof window !== 'undefined' && window.Telegram && window.Telegram.WebApp) || null;
let S = null; // the live game state (prediction in online mode)

const UIH = {}; // UI callbacks: onEco, onState, onChallenge, onGain, onStatus, onOffline, onRefAct, onDropped, onFatal

const NET = {
  mode: 'demo',
  cfg: null,
  token: '',
  me: null,
  eco: null,
  online: true,
  created: false,
  lastSync: 0,
  syncEvery: 12000,
  busy: false,
  sc: null,
  tp: { n: 0, mean: 0, m2: 0, last: 0 }, // statistics of ALL tap attempts since the last sync
  speed: 1, // demo only
  failures: 0,
  shopCache: null,
};

/* ---------- small helpers ---------- */
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
function muted(fn) {
  const h = hooks.emit;
  hooks.emit = function () {};
  try { return fn(); } finally { hooks.emit = h; }
}
function tgInitData() { return TG && TG.initData ? TG.initData : ''; }
function qs(name) {
  try { return new URLSearchParams(location.search).get(name); } catch (e) { return null; }
}
function fingerprint() {
  const parts = [];
  try {
    parts.push(screen.width + 'x' + screen.height + 'x' + (window.devicePixelRatio || 1));
    parts.push(Intl.DateTimeFormat().resolvedOptions().timeZone || '');
    parts.push(navigator.language || '', navigator.platform || '', navigator.hardwareConcurrency || 0, navigator.deviceMemory || 0);
    const cv = document.createElement('canvas');
    cv.width = 120; cv.height = 24;
    const c = cv.getContext('2d');
    c.textBaseline = 'top'; c.font = '14px Arial'; c.fillStyle = '#f60'; c.fillRect(0, 0, 60, 20);
    c.fillStyle = '#069'; c.fillText('OfficeDreams✓', 2, 2);
    const d = cv.toDataURL();
    let h = 0;
    for (let i = 0; i < d.length; i += 3) h = (h * 31 + d.charCodeAt(i)) | 0;
    parts.push(h);
  } catch (e) {}
  return parts.join('|').slice(0, 300);
}

/* ---------- HTTP ---------- */
async function http(method, path, body, opt) {
  opt = opt || {};
  const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = ctl ? setTimeout(() => ctl.abort(), opt.timeout || 15000) : null;
  try {
    const headers = { 'content-type': 'application/json' };
    if (NET.token) headers.authorization = 'Bearer ' + NET.token;
    const r = await fetch(path, {
      method, headers, body: body ? JSON.stringify(body) : undefined,
      signal: ctl ? ctl.signal : undefined, keepalive: !!opt.keepalive, credentials: 'omit', cache: 'no-store',
    });
    let j = null;
    try { j = await r.json(); } catch (e) { j = null; }
    return { status: r.status, j: j || { ok: false, err: 'json' } };
  } catch (e) {
    return { status: 0, j: { ok: false, err: 'net' } };
  } finally {
    if (timer) clearTimeout(timer);
  }
}
async function api(method, path, body) {
  let r = await http(method, path, body);
  if (r.status === 401 && path !== '/api/auth') {
    if (await reauth()) r = await http(method, path, body);
  }
  setOnline(r.status !== 0);
  if (r.j && r.j.eco) setEco(r.j.eco);
  return r.j;
}
function setOnline(v) {
  if (NET.online !== v) {
    NET.online = v;
    UIH.onStatus && UIH.onStatus(v);
  }
}
function setEco(eco) {
  if (!eco) return;
  NET.eco = eco;
  UIH.onEco && UIH.onEco(eco);
}

/* ---------- boot ---------- */
// returns {ok, mode} ; on fatal errors returns {ok:false, err}
async function netBoot(forceDemo) {
  if (forceDemo) return demoBoot();
  const cfgR = await http('GET', '/api/config', null, { timeout: 8000 });
  if (cfgR.status !== 200 || !cfgR.j || cfgR.j.v !== 2) {
    // no server next to the page: inside Telegram this is an outage, outside it is the demo
    if (tgInitData()) return { ok: false, err: 'server' };
    return demoBoot();
  }
  NET.cfg = cfgR.j;
  NET.mode = 'online';
  const a = await doAuth();
  if (!a.ok) return a;
  return { ok: true, mode: 'online' };
}
function authBody() {
  const body = { platform: (TG && TG.platform) || 'web', fp: fingerprint() };
  try { body.tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
  try {
    const hp = new URLSearchParams((location.hash || '').replace(/^#/, ''));
    const sp = (TG && TG.initDataUnsafe && TG.initDataUnsafe.start_param) || qs('tgWebAppStartParam') || hp.get('tgWebAppStartParam') || qs('startapp') || qs('start') || '';
    if (sp) body.start = String(sp).slice(0, 64);
  } catch (e) {}
  const init = tgInitData();
  if (init) body.initData = init;
  else if (NET.cfg && NET.cfg.dev) {
    const id = parseInt(qs('dev') || lsGet('od2_dev') || '0', 10) || 0;
    if (id > 0) {
      lsSet('od2_dev', String(id));
      body.dev = { id, name: qs('name') || 'Dev ' + id, lang: qs('lang') || detectLang(), start: qs('start') || '' };
    }
  }
  return body;
}
async function doAuth() {
  const body = authBody();
  if (!body.initData && !body.dev) return { ok: false, err: 'no_telegram' };
  const r = await http('POST', '/api/auth', body);
  if (r.status === 0) return { ok: false, err: 'server' };
  if (!r.j || !r.j.ok || !r.j.token) return { ok: false, err: (r.j && r.j.err) || 'auth' };
  NET.token = r.j.token;
  NET.me = r.j.me;
  NET.created = !!r.j.created;
  const st = muted(() => deserialize(r.j.state));
  applyPrefs(st);
  if (NET.sc) {
    NET.sc.S = st;
    NET.sc.queue = [];
    NET.sc.inflight = null;
    NET.sc.lastTk = st.tk;
  } else NET.sc = createSyncClient(st, { applyAction, replay, stateHash, deserialize });
  NET.sc.seq = r.j.seq;
  S = NET.sc.S;
  NET.lastSync = Date.now();
  setEco(r.j.eco);
  if (r.j.challenge) UIH.onChallenge && UIH.onChallenge(r.j.challenge);
  return { ok: true };
}
async function reauth() {
  if (!tgInitData() && !(NET.cfg && NET.cfg.dev)) return false;
  const body = authBody();
  const r = await http('POST', '/api/auth', body);
  if (!r.j || !r.j.ok || !r.j.token) {
    if (r.status === 401 || r.status === 403) UIH.onFatal && UIH.onFatal('session');
    return false;
  }
  NET.token = r.j.token;
  // the server state may have moved on; adopt it
  muted(() => {
    const st = deserialize(r.j.state);
    applyPrefs(st);
    NET.sc.S = st;
    NET.sc.queue = [];
    NET.sc.inflight = null;
    NET.sc.lastTk = st.tk;
    NET.sc.seq = r.j.seq;
    S = st;
  });
  UIH.onState && UIH.onState(true);
  return true;
}

/* ---------- local preferences (not synced) ---------- */
function loadPrefs() {
  try { return JSON.parse(lsGet('od2_prefs') || '{}') || {}; } catch (e) { return {}; }
}
function savePrefs() {
  if (!S) return;
  const p = loadPrefs();

  const tpSaved = NET.tp;

      vx: (Math.random() - 0.5) * 9, vy: -6 - Math.random() * 8,

/* ---------- count-up numbers ---------- */
function countUp(el, to, dur, fmtF) {
  if (!el) return;
  const from = parseFloat(el.dataset.v || '0') || 0;
  el.dataset.v = String(to);
  if (Math.abs(to - from) < 0.05) { el.textContent = fmtF(to); return; }
  const t0 = performance.now();
  const step = (t) => {
    const k = Math.min(1, (t - t0) / (dur || 700));
    const e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmtF(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

    a.removeAttribute(n);

    if (!na) { a.appendChild(nb); i++; continue; }
    if (na.nodeType !== nb.nodeType || (na.nodeType === 1 && (na.tagName !== nb.tagName || na.id !== nb.id))) { a.replaceChild(nb, na); i++; continue; }
    if (na.nodeType === 3 || na.nodeType === 8) { if (na.nodeValue !== nb.nodeValue) na.nodeValue = nb.nodeValue; i++; continue; }

/* ---------- derived helpers ---------- */
const projectPct = () => (S.project ? Math.min(1, S.project.pts / S.project.need) * 100 : 0);
function projectETA() {
  if (!S.project) return '';
  const rem = S.project.need - S.project.pts;
  return '≈ ' + fmtDur(rem / Math.max(0.1, wpTotal(S)) / (NET.speed || 1));
}
const claimableGoals = () => GOALS.filter((g) => S.goals[g.id] === 1);
const dailyClaimable = () => DAILY.filter((d) => !S.dq.done[d.id] && dailyProgress(S, d) >= d.need);

  const e = NET.eco;
  return !!(e && e.checkin && !e.checkin.done && S.stats.taps >= 20);
}
function nextStep() {
  if (S.pending) return { k: 'next.event', act: 'event' };
  if (claimableGoals().length) return { k: 'next.claim', act: 'tab:quests' };
  if (S.stats.started === 0) return { k: 'next.start', act: 'go:studio:games' };
  if (S.stats.taps < 10) return { k: 'next.tap', act: 'work' };
  if (!S.project) return { k: 'next.start2', act: 'go:studio:games' };
  if (hiredCount(S) === 0 && S.cash >= ROLE.prog.hire) return { k: 'next.hire', act: 'go:studio:team' };
  if (checkinReady()) return { k: 'next.checkin', act: 'checkin' };
  if (dailyClaimable().length) return { k: 'next.daily', act: 'tab:quests' };
  const nf = nextFloor(S);
  const f = nf && FLOORS.find((x) => x.id === nf);

}

// reputation (unbounded) is shown as a level 1–10 with progress inside the level; mood = average of the hired team

const moodClass = (m) => (m >= 60 ? 'ok' : m >= 35 ? 'mid' : 'low');
function pips(l) {
  let h = '';
  for (let i = 1; i <= MAX_LVL; i++) h += `<span class="pip ${i <= l ? 'on' : ''}"></span>`;
  return `<div class="pips" aria-label="${esc(L('ui.level', { n: l }))}">${h}</div>`;
}
function empRow(r) {
  if (r === 'you') {
    return `<button class="emp ${UI.sel === 'you' ? 'on' : ''}" data-act="sel:you">
      ${imgTag(portrait('you', 90), 'av')}

      <span class="emp-m ok">${I('bolt', 14)}<small>${maxEnergy(S)}</small></span>
    </button>`;
  }
  const st = S.staff[r], hired = st.lvl > 0, locked = !hired && roleLocked(S, r);
  const canHire = !hired && !locked && S.cash >= ROLE[r].hire;
  return `<button class="emp ${hired ? '' : 'vac'} ${locked ? 'lock' : ''} ${UI.sel === r ? 'on' : ''}" data-act="sel:${r}">
    ${imgTag(portrait(r, hired ? st.mood : 80), 'av')}
    <span class="emp-t"><b>${L('role.' + r + '.name')}</b><small>${hired ? L('ui.level', { n: st.lvl }) + ' · ' + money(salaryOf(S, r)) + L('ui.per_day') : locked ? '🔒 ' + L('team.locked_s', { floor: L('floor.' + ROLE[r].need + '.name') }) : L('team.vacancy') + ' · ' + money(ROLE[r].hire)}</small></span>
    ${hired ? `<span class="emp-m ${moodClass(st.mood)}">${I('heart', 14)}<small>${Math.round(st.mood)}%</small></span>` : canHire ? '<i class="dot"></i>' : ''}
  </button>`;
}
function detailPanel() {
  const r = UI.sel;
  if (r === 'you') {
    const l = S.you.lvl, max = l >= MAX_LVL, cost = youUpCost(l), tp = tapPower(S);
    return `<section class="panel detail">
      <div class="d-head"><h3 class="h3">${L('role.you.name')}</h3><span class="lvl px">LV ${l}</span></div>
      <div class="d-body">${imgTag(portrait('you', 90), 'd-art')}
        <ul class="stats">
          <li><span>${L('team.tap_pts')}</span><b class="grn">+${tp.pts.toFixed(1)}</b></li>
          <li><span>${L('team.tap_cash')}</span><b>$${fmtSmall(tp.cash)}</b></li>
          <li><span>${L('team.max_energy')}</span><b>${maxEnergy(S)}</b></li>
          <li><span>${L('team.passive')}</span><b>+${(0.35 * (1 + 0.08 * (l - 1))).toFixed(2)}/${L('u.s')}</b></li>
        </ul></div>
      ${pips(l)}
      ${max ? `<p class="hint">${L('team.max')}</p>` : `<button class="btn" data-act="upy" ${S.cash >= cost ? '' : 'disabled'}>${L('ui.upgrade')} <b class="px">${money(cost)}</b></button>
      <p class="hint">${L('team.you_next')}</p>`}
    </section>`;
  }
  const st = S.staff[r], hired = st.lvl > 0;
  if (!hired) {
    return `<section class="panel detail">
      <div class="d-head"><h3 class="h3">${L('role.' + r + '.name')}</h3><span class="lvl">${L('team.vacancy')}</span></div>
      <div class="d-body">${imgTag(portrait(r, 80), 'd-art')}
        <ul class="stats">
          <li><span>${L('team.role')}</span><b>${L('role.' + r + '.perk')}</b></li>
          <li><span>${L('team.salary')}</span><b>${money(salaryOf(S, r, 1))}${L('ui.per_day')}</b></li>
        </ul></div>
      ${roleLocked(S, r) ? `<button class="btn" disabled>🔒 ${L('team.locked', { floor: L('floor.' + ROLE[r].need + '.name') })}</button>` : `<button class="btn" data-act="hire:${r}" ${S.cash >= ROLE[r].hire ? '' : 'disabled'}>${L('team.hire')} <b class="px">${money(ROLE[r].hire)}</b></button>`}
      <p class="hint">${L(r === 'mkt' ? 'team.hint_mkt' : ROLE[r].need ? 'team.hint_' + r : 'team.hint_dev')}</p>
    </section>`;
  }
  const l = st.lvl, max = l >= MAX_LVL, cost = upCost(r, l);
  // every stat shows what it was before the last upgrade (muted), then the value now
  const S0 = l > 1 ? Object.assign({}, S, { staff: Object.assign({}, S.staff, { [r]: Object.assign({}, st, { lvl: l - 1 }) }) }) : null;
  const vals = (SS, lv) => {
    const k = lv * moodF(st.mood), wp = `+${wpRole(SS, r).toFixed(1)}/${L('u.s')}`;
    const out = r === 'mkt' ? [['team.sales_bonus', `+${Math.round(0.07 * k * 100)}%`]]
      : r === 'qa' ? [['team.score_bonus', `+${(0.12 * k).toFixed(1)}`]]
      : r === 'prod' ? [['team.team_speed', `+${Math.round(4 * k)}%`]]
      : r === 'cm' ? [['team.tail', `−${Math.round((1 - saleDecay(SS)) * 100)}%`]]
      : r === 'snd' ? [['team.work_pts', wp], ['team.sales_bonus', `+${Math.round(3 * k)}%`]]
      : [['team.work_pts', wp]];
    return [['team.speed', `+${Math.round((speedOf(lv) - 1) * 100)}%`, 'grn']].concat(out.map((x) => [x[0], x[1], 'grn']), [['team.salary', money(salaryOf(SS, r)) + L('ui.per_day'), '']]);
  };
  const now = vals(S, l), was = S0 ? vals(S0, l - 1) : null;
  const row = (x, i) => `<li><span>${L(x[0])}</span><b class="${x[2]}">${was && was[i][1] !== x[1] ? `<s class="was">${was[i][1]}</s> ` : ''}${x[1]}</b></li>`;
  return `<section class="panel detail">
    <div class="d-head"><h3 class="h3">${L('role.' + r + '.name')}</h3><span class="lvl px">LV ${l}</span></div>
    <div class="d-body">${imgTag(portrait(r, st.mood), 'd-art')}
      <ul class="stats">
        ${row(now[0], 0)}
        <li><span>${L('team.mood')}</span><b class="${moodClass(st.mood)}">${Math.round(st.mood)}%</b></li>
        ${now.slice(1).map((x, i) => row(x, i + 1)).join('')}
      </ul></div>
    ${pips(l)}
    ${max ? `<p class="hint">${L('team.max')}</p>` : `<button class="btn" data-act="ups:${r}" ${S.cash >= cost ? '' : 'disabled'}>${L('ui.upgrade')} <b class="px">${money(cost)}</b></button>
    <p class="hint">${L('team.next', { sal: money(salaryOf(S, r, l + 1)) })}</p>`}
  </section>`;
}

  return `<div class="team">

    ${detailPanel()}
  </div>

}

/* ---------- token market: live price on Solana (Jupiter), chart, holdings, buy ---------- */
function fmtUsdP(v) { if (!v) return '$0'; if (v >= 1) return '$' + v.toFixed(3); if (v >= 0.01) return '$' + v.toFixed(4); return '$' + v.toPrecision(3); }
function fmtUsdBig(v) { if (v === null || v === undefined) return '—'; return v >= 1e6 ? '$' + (v / 1e6).toFixed(2) + 'M' : v >= 1e3 ? '$' + (v / 1e3).toFixed(1) + 'K' : '$' + v.toFixed(0); }
function mktSpark(hist, up) {
  if (!hist || hist.length < 2) return `<div class="mk-nochart">${L('mk.collecting')}</div>`;
  const W = 320, H = 96, ys = hist.map((p) => p[1]), lo = Math.min(...ys), hi = Math.max(...ys), sp = hi - lo || hi || 1;

/* ============================================================
   OFFICE DREAMS — interactivity & juice:
   tappable office scene, catchable ideas, talking employees,
   coins flying to the HUD, tap combos, screen shake
   ============================================================ */

/* ---------- scene <-> screen coordinates ---------- */
function sceneMap() {
  if (artOfficeOn()) return artSceneMap();
  const cv = UI.sceneCv;
  if (!cv || !cv.isConnected) return null;
  const r = cv.getBoundingClientRect();
  if (!r.width) return null;
  const f = camFit(cv.width, cv.height, true); // canvas pixels
  const kx = r.width / cv.width, ky = r.height / cv.height;
  return {
    r,
    // scene pixel → position inside the .scene box (CSS px)
    toCss: (x, y) => [f[0] * kx + ((x - CAM.sx) / CAM.sw) * f[2] * kx, f[1] * ky + ((y - CAM.sy) / CAM.sh) * f[3] * ky],
    // client point → scene pixel
    toScene: (cx, cy) => [CAM.sx + (((cx - r.left) / kx - f[0]) / f[2]) * CAM.sw, CAM.sy + (((cy - r.top) / ky - f[1]) / f[3]) * CAM.sh],
    scale: (f[2] * kx) / CAM.sw,
  };
}
const HEAD_DY = 20; // sprite head is ~20 scene px above the seat point
function spotOf(kind) {
  if (artOfficeOn()) return artSpot(kind);
  if (kind === 'you') { const a = P(5.1, 5.1, 9); return [a[0], a[1] - HEAD_DY]; }
  if (kind === 'laptop') return P(6.3, 5.4, 16);
  if (kind === 'cat') { const a = P(6.5, 6.1, 13); return [a[0] - 3, a[1] - 3]; }
  const sp = STAND[kind];
  if (sp) { const a = P(sp.gx, sp.gy, 0); return [a[0], a[1] - (sp.pose === 'pad' ? 17 : 26)]; }
  const st = STATION[kind];
  if (!st) return null;
  const a = P(st.chair[0], st.chair[1], 9);
  return [a[0], a[1] - HEAD_DY];
}

/* ---------- tapping the office ---------- */
function onSceneTap(e) {
  const m = sceneMap();
  if (!m) return;
  const [x, y] = m.toScene(e.clientX, e.clientY);
  const near = (k, rad) => { const p = spotOf(k); return p && Math.hypot(p[0] - x, p[1] - y) <= rad; };
  if (S.idea && near(S.idea.role, 16)) return grabIdea();
  if (S.bug) { const b = bugSpot(); if (b && Math.hypot(b[0] - x, b[1] - y) <= 14) return squash(); }
  if (near('cat', 9)) return petCat(e);
  for (const r of ROLES) {
    if (near(r, 15)) return S.staff[r].lvl > 0 ? talk(r) : (UI.sel = r, go('studio', 'team'));
  }
  if (near('you', 16) || near('laptop', 12)) return onWorkDown(e);
}
function petCat(e) {

/* ============================================================
   OFFICE DREAMS — Studio Battle (PvP)
   A full-screen arena over the game: lobby → search → 3-2-1 →
   30 s tap race → result. The server owns the clock, the score
   and the rewards; this file only shows them and counts taps.
   ============================================================ */
const PV = {
  open: false, st: 'lobby', info: null, v: null, n: 0, off: 0, busy: false, timer: null, raf: 0,
  emote: null, opEk: 0, meEk: 0, opDisp: 0, bid: '', fails: 0, lastSfx: 0, duel: '', tapsShown: 0, resAt: 0,
};
const PV_EMOTES = ['😎', '🔥', '😂', '😱', '👏', '💀'];
const PV_LEAGUE = ['🥉', '🥈', '🥇', '💠', '🌈'];
const PV_LEAGUES = [0, 150, 400, 800, 1400];
const PV_DUR = 30000;

/* ---------- transport: the real server, or a local training bot in the demo ---------- */
const PVL = { tr: 0, w: 0, l: 0, d: 0, best: 0, b: null, q: 0 };
function pvMult(s) { return Math.round((1 + Math.min(1, Math.log2(1 + Math.max(0, wpTotal(s))) / 6)) * 100) / 100; }
function pvLeague(tr) { let i = 0; while (i + 1 < PV_LEAGUES.length && tr >= PV_LEAGUES[i + 1]) i++; return i; }
function pvBotLine(seed, rate) {
  let x = seed >>> 0 || 7;
  const rnd = () => { x = (Math.imul(x, 1103515245) + 12345) >>> 0; return x / 4294967296; };
  const out = [];

/* ---------- open / close ---------- */
function pvEl() {

    el.className = 'pvp';
    el.hidden = true;
    document.body.appendChild(el);
    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-pv]');
      if (!b || b.disabled) return;
      e.stopPropagation();
      const [a, x] = b.dataset.pv.split(':');
      if (PV_ACT[a]) PV_ACT[a](x);
    });
    el.addEventListener('pointerdown', (e) => {
      const t = e.target.closest('.pv-tap');
      if (t) { e.preventDefault(); pvTap(e); }
    }, { passive: false });
  }

}
function pvOpen(duel) {

  el.classList.remove('out');
  document.body.classList.add('pv-on');

  tipDone('pvp');
  if (COACH.el) COACH.el.hidden = true; // no coach bubbles over the arena
  syncBackButton();
  if (PV.st === 'fight' || PV.st === 'search') { pvRender(); return; }

}
function pvClose(force) {

  if (PV.st === 'search') pvCall('cancel');
  pvStop();
  PV.open = false;
  UI.pvp = false;
  PV.st = 'lobby';
  const el = pvEl();
  el.classList.add('out');
  setTimeout(() => { if (!PV.open) { el.hidden = true; el.innerHTML = ''; } }, 220);
  document.body.classList.remove('pv-on');
  syncBackButton();

}

}

}
async function pvLoadInfo() {

  return r;
}

/* ---------- actions ---------- */
const PV_ACT = {
  close: () => pvClose(),
  find: () => pvFind(''),
  cancel: () => { pvCall('cancel'); pvStop(); PV.st = 'lobby'; pvRender(); },
  again: () => { PV.st = 'lobby'; PV.v = null; pvFind(''); },
  lobby: () => { PV.st = 'lobby'; PV.v = null; pvStop(); pvRender(); pvLoadInfo(); },
  share: () => {
    const link = PV.info && PV.info.link;
    if (!link) return;
    const url = 'https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(L('pv.share_text'));
    if (TG && TG.openTelegramLink) TG.openTelegramLink(url); else openLink(url);
  },
  emo: (i) => {

async function pvFind(duel) {

/* ---------- tapping ---------- */
function pvPhase() {

}

  const r = box.getBoundingClientRect();
  const x = (e && e.clientX ? e.clientX : r.left + r.width / 2) - r.left + (Math.random() * 30 - 15);
  const y = (e && e.clientY ? e.clientY : r.top + r.height * 0.7) - r.top - 16;
  if (box.querySelectorAll('.pv-plus').length > 14) box.querySelector('.pv-plus').remove();
  const p = document.createElement('span');
  p.className = 'pv-plus px';
  p.textContent = '+' + Math.round((PV.v.me.mult || 1) * 10);
  p.style.left = x + 'px';
  p.style.top = y + 'px';
  box.appendChild(p);
  setTimeout(() => p.remove(), 650);
  const btn = $('.pv-tap');
  if (btn) { btn.classList.remove('hit'); void btn.offsetWidth; btn.classList.add('hit'); }
}

/* ---------- per-frame updates of the arena (no re-render while fighting) ---------- */
function pvFrame() {

  if (PV.st === 'search') {
    const t = $('#pvSearchT');
    if (t) { const s = Math.floor((Date.now() - (PV.since || Date.now())) / 1000); t.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  } else if (PV.st === 'fight' && PV.v) {
    const v = PV.v, now = Date.now() + PV.off, ph = pvPhase();
    const cnt = $('#pvCount'), clock = $('#pvClock'), tap = $('.pv-tap');
    if (ph === 'count') {
      const k = Math.ceil((v.start - now) / 1000);
      if (cnt) { const txt = k > 3 ? L('pv.ready') : String(Math.max(1, k)); if (cnt.dataset.k !== txt) { cnt.dataset.k = txt; cnt.textContent = txt; cnt.classList.remove('pop'); void cnt.offsetWidth; cnt.classList.add('pop'); if (k <= 3) sfx('blip'); } cnt.hidden = false; }

        if (cnt.dataset.k !== 'go') { cnt.dataset.k = 'go'; cnt.textContent = L('pv.go'); cnt.classList.remove('pop'); void cnt.offsetWidth; cnt.classList.add('pop', 'go'); sfx('combo'); setTimeout(() => { cnt.hidden = true; }, 650); }
      }

      if (ph === 'over') { const w = $('#pvLead'); if (w) w.textContent = L('pv.wait'); }
    }

    const target = v.op.score || 0;
    PV.opDisp += (target - PV.opDisp) * 0.18;
    if (Math.abs(target - PV.opDisp) < 1) PV.opDisp = target;
    const opS = Math.round(PV.opDisp);
    const top = Math.max(meS, opS, 200);

    if (bm) bm.style.transform = 'scaleX(' + (meS / top).toFixed(3) + ')';

  artGlow(ctx, X(ART_SIGN[0]), Y(ART_SIGN[1]), F.h * 0.16, Math.sin(t * 1.3) > 0 ? '#ff3fd0' : '#3fd0ff', 0.12 + 0.06 * Math.sin(t * 3));
  ART_LAMPS.forEach((l, i) => artGlow(ctx, X(l[0]), Y(l[1]), F.h * 0.07, '#ffc070', 0.16 + 0.04 * Math.sin(t * 5 + i * 1.7)));
  ART_DESKS.forEach((d, i) => artGlow(ctx, X(d.mon[0]), Y(d.mon[1]), F.h * 0.1, '#3fd0ff', (working ? 0.16 : 0.07) + (working ? 0.06 * Math.sin(t * 9 + i * 2) : 0)));
  if (st.turbo || st.hype) artGlow(ctx, F.x + F.w / 2, F.y + F.h / 2, F.h * 0.7, st.turbo ? '#ff4d6d' : '#ffd23f', 0.06 + 0.04 * Math.sin(t * 6));
  // the team, back to front
  const places = artPlaces(), list = Object.keys(places).map((k) => Object.assign({ k }, places[k])).sort((a, b) => a.y - b.y);
  const blit = (spr, x, y, hFrac, flip) => {
    const sc = (hFrac * F.h) / spr.height, w = spr.width * sc, h = spr.height * sc;
    ctx.save(); ctx.imageSmoothingEnabled = false; ctx.translate(Math.round(X(x)), Math.round(Y(y))); if (flip) ctx.scale(-1, 1);
    ctx.drawImage(spr, -w / 2, -h, w, h); ctx.restore();
  };
  for (const p of list) {
    if (p.seat) {
      const typing = working && (p.k === 'you' ? st.tapFlash > 0 || Math.sin(t * 2 + p.desk) > 0.3 : true);
      blit(sprSeat(p.k, typing ? Math.floor(t * 8 + p.desk) & 1 : 0), p.x, p.y, 0.1);
    } else {
      const sway = Math.sin(t * 0.6 + p.x) > 0.6;
      ctx.save(); ctx.globalAlpha = 0.3; ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse(X(p.x), Y(p.y), F.h * 0.025, F.h * 0.008, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      blit(sprStand(p.k, 0, true), p.x, p.y, 0.15, sway);
    }
  }
  // the cat on the beanbag
  blit(sprCat(false), ART_CAT[0], ART_CAT[1], 0.045, Math.sin(t * 0.3) > 0.7);
}

/* ---------- rendering ---------- */
function affordSig() {
  const c = S.cash;
  let s = '';
  for (const r of ROLES) {
    const st = S.staff[r];
    s += st.lvl > 0 ? (st.lvl < MAX_LVL && c >= upCost(r, st.lvl) ? 1 : 0) : (c >= ROLE[r].hire ? 1 : 0);
    s += st.lvl > 0 ? moodClass(st.mood).charAt(0) : '';
  }
  s += c >= youUpCost(S.you.lvl) ? 1 : 0;
  const nf = nextFloor(S);
  const f = nf && FLOORS.find((x) => x.id === nf);
  s += f && c >= f.price ? 1 : 0;
  for (const it of ITEMS) s += c >= it.price ? 1 : 0;
  s += S.gems >= 5 ? 1 : 0;
  s += S.energy >= 2 ? 1 : 0;
  s += S.stats.taps >= 20 ? 1 : 0;
  s += S.stats.taps >= 10 ? 1 : 0;
  s += dailyClaimable().length;
  if (S.pending) s += eventView(S).choices.map((x) => (x.disabled ? 0 : 1)).join('');
  s += Object.keys(S.buffs).map((k) => (S.buffs[k] > 0 ? 1 : 0)).join('');
  return s;
}
function render(force) {
  if (!S) return;
  const sig = [S.rev, UI.tab, UI.sub.studio, UI.sub.drop, UI.sel, affordSig(), UI.ecoVer || 0, UI.hubVer || 0, LANG, NET.online, NET.mode, S.sel.genre, S.sel.tier, S.sel.name, citySig(), CT.sel].join('|');
  if (!force && sig === UI.lastSig) return;
  // don't rebuild the page under someone typing a donation amount (keyboard would close)
  if (!force && document.activeElement && document.activeElement.id === 'donin') { morph($('#hud'), hudHTML()); return; }
  UI.lastSig = sig;
  const main = $('#main');
  const where = UI.tab + ':' + (UI.sub[UI.tab] || '');
  const keep = UI.renderedTab === where ? main.scrollTop : 0;
  morph($('#hud'), hudHTML());
  morph($('#tabs'), tabsHTML());
  // a new tab/sub-page is built fresh (entrance animation); updates of the same page are patched in place

    main.firstChild.classList.add('enter'); vfxStagger();

/* ---------- backdrop: pixel city skyline with lit windows + floating neon motes ---------- */
function makeBackdrop() {
  if (document.getElementById('skyline')) return;
  const W = 240, H = 90, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  let seed = 7; const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  for (const [layer, col, hmin, hmax] of [[0, '#120c3a', 30, 70], [1, '#0a0828', 18, 50]]) {
    let x = 0;
    while (x < W) {
      const bw = 8 + Math.floor(rnd() * 16), bh = hmin + Math.floor(rnd() * (hmax - hmin));
      g.fillStyle = col; g.fillRect(x, H - bh, bw, bh);
      if (rnd() < 0.3) { g.fillRect(x + (bw >> 1), H - bh - 6, 1, 6); g.fillStyle = '#ff3fd0'; g.fillRect(x + (bw >> 1), H - bh - 7, 1, 1); }
      for (let wy = H - bh + 3; wy < H - 2; wy += 4) for (let wx = x + 2; wx < x + bw - 2; wx += 3) {
        if (rnd() < (layer ? 0.32 : 0.18)) { const r = rnd(); g.fillStyle = r < 0.55 ? '#ffd23f' : r < 0.8 ? '#3fd0ff' : '#ff3fd0'; g.globalAlpha = layer ? 0.9 : 0.5; g.fillRect(wx, wy, 1, 2); g.globalAlpha = 1; }
      }
      x += bw + (layer ? 1 : 3);
    }
  }
  const sk = document.createElement('div'); sk.id = 'skyline'; sk.style.backgroundImage = 'url(' + cv.toDataURL() + ')';
  const mo = document.createElement('div'); mo.id = 'motes';
  for (let i = 0; i < 14; i++) { const m = document.createElement('i'); m.style.left = (Math.random() * 100).toFixed(1) + '%'; m.style.animationDuration = (12 + Math.random() * 14).toFixed(1) + 's'; m.style.animationDelay = (-Math.random() * 20).toFixed(1) + 's'; mo.appendChild(m); }
  document.body.prepend(mo); document.body.prepend(sk);
}
try { makeBackdrop(); } catch (e) {}

/* ---------- canvases: office scene (+ bloom layer) and tower ---------- */
let SCENE = null, SCENE_OFF = null, SCENE_IMG = null, TOWER_B = null, TOWER_IMG = null;
function bindCanvases() {
  if (!SCENE) {
    SCENE = createScene();

  }

  UI.sceneCtx = UI.sceneCv ? UI.sceneCv.getContext('2d') : null;

// the scene canvas fills its box; the room is drawn "contain"-fitted with a slight zoom (sides of the floor cropped)
const CAM = { sx: 34, sy: 6, sw: 188, sh: 162 };
function sizeScene() {
  const cv = UI.sceneCv;
  if (!cv) return;
  const w = cv.clientWidth || 300, h = cv.clientHeight || 220;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = Math.round(w * dpr), H = Math.round(h * dpr);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  if (UI.bloomCv) {
    const bw = Math.max(1, Math.round(w / 7)), bh = Math.max(1, Math.round(h / 7));
    if (UI.bloomCv.width !== bw || UI.bloomCv.height !== bh) { UI.bloomCv.width = bw; UI.bloomCv.height = bh; }
  }
  UI.sceneSize = w + 'x' + h;
}
function camFit(W, H, crisp) {
  let s = Math.min(W / CAM.sw, H / CAM.sh);
  if (crisp && s >= 6) s = Math.floor(s / 2) * 2;
  const dw = CAM.sw * s, dh = CAM.sh * s;
  return [Math.round((W - dw) / 2), Math.round((H - dh) / 2), Math.round(dw), Math.round(dh)];
}
function sceneState() {
  const canHire = {};
  for (const r of ROLES) canHire[r] = S.staff[r].lvl === 0 && S.cash >= ROLE[r].hire;
  return {
    f: S.clock / DAY_SEC,
    working: !!S.project && (hiredCount(S) > 0 || UI.tapFlash > 0),
    staff: S.staff, items: S.items, turbo: S.buffs.turbo > 0, canHire, legacy: S.legacy || 0,
    tapFlash: UI.tapFlash, floors: S.floors, hype: S.buffs.hype > 0,
    rain: !!(MUSIC.on && TRACKS[MUSIC.track] && TRACKS[MUSIC.track].rain),

}
function drawScene(t) {
  if (!SCENE || !UI.sceneCtx || UI.tab !== 'office') return;
  try {
    const cv = UI.sceneCv;
    if (UI.sceneSize !== cv.clientWidth + 'x' + cv.clientHeight) sizeScene();

    if (artOfficeOn()) {

    const f = camFit(cv.width, cv.height, true);
    ctx.drawImage(SCENE_OFF, CAM.sx * 2, CAM.sy * 2, CAM.sw * 2, CAM.sh * 2, f[0], f[1], f[2], f[3]);
    if (UI.bloomCtx) {

}

function showChallenge(ch) {
  if (!ch || (UI.modal && UI.modal.id === 'chal:' + ch.id)) return;
  UI.chal = ch;
  let body;
  if (ch.kind === 'odd') {
    body = `<p class="ev-text">${L('chal.odd')}</p><div class="cgrid">${ch.cells.map((c, i) => `<button class="cell" data-act="chal:${i}">${c}</button>`).join('')}</div>`;
  } else {
    body = `<p class="ev-text">${L('chal.count', { e: ch.target })}</p><div class="cgrid view">${ch.cells.map((c) => `<span class="cell">${c}</span>`).join('')}</div>
      <div class="copts">${ch.options.map((o) => `<button class="btn" data-act="chal:${o}">${o}</button>`).join('')}</div>`;
  }
  const show = () => openModal(`<h2 class="h2">${I('shield', 16)} ${L('chal.title')}</h2><p class="sub">${L('chal.sub')}</p>${body}`, { id: 'chal:' + ch.id, sticky: true });
  if (UI.modal && !UI.modal.sticky) { UI.modal = null; show(); } else modalOrQueue(show);
}
function answerChallenge(ans) {
  const ch = UI.chal;
  if (!ch) return;
  UI.chal = null;
  netApi.challenge(ch.id, Number(ans)).then((r) => {
    closeModal(true);
    if (r && r.ok) { toast(L('chal.ok'), 'good', 'shield'); haptic('ok'); }
    else { toast(L('chal.bad'), 'bad', 'shield'); haptic('err'); setTimeout(() => netSync(), 1200); }
  });
}

function releaseJuice(d) {
  const sc = $('.scene');
  const r = sc ? sc.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 3, width: 0, height: 0 };
  const x = r.left + r.width / 2, y = r.top + r.height / 2;
  flyTo(x, y, '.pill.cash', I('coin', 16), d.game.score >= 8 ? 12 : 7);
  if (d.gemGain) flyTo(x, y, '.pill.gem', I('gem', 16), 3);
  if (d.game.score >= 8) shake(d.game.score >= 9);
}
function centerFly(sel, html, n) { flyTo(innerWidth / 2, innerHeight * 0.45, sel, html, n); }

/* ---------- engine → UI events ---------- */
hooks.emit = function (type, data) {
  if (!UI.booted) return;
  if (type === 'sfx') sfx(data);
  else if (type === 'release') {
    releaseJuice(data);
    // a big celebration for the first releases and for hits; later routine releases get a toast
    if (S.stats.released <= 3 || data.game.score >= 8.5 || data.gemGain) modalOrQueue(() => showRelease(data));
    else { toast(LR('toast.release', { name: data.game.name, score: data.game.score.toFixed(1) }), data.game.score >= 7 ? 'good' : '', 'games'); if (data.game.score >= 7) confettiSmall(); }
  }
  else if (type === 'goal') { toast(LR('toast.goal', { t: '$goal.' + data.id }), 'good', 'star'); }
  else if (type === 'event') { toast(LR('toast.event', { t: '$ev.' + data.id + '.title' }), 'good', 'quest'); modalOrQueue(showEvent); }
  else if (type === 'day') toast(LR('toast.day', { n: data.day, inc: money(data.income), sal: money(data.salary) }), '');
  else if (type === 'toast') toast(L(data.k), data.kind);
  else if (type === 'ending') modalOrQueue(showEnding);
  else if (type === 'trained') { toast(L('city.trained', { role: L('role.' + data.role + '.name'), n: data.lvl }), 'good', 'up'); confettiSmall(); }
  else if (type === 'contract') { toast(L('city.ok_deal', { cash: money(data.cash), gems: data.gems }), 'good', 'gem'); confetti(120); sfx('floor'); }
  else if (type === 'ipo') toast(L('toast.ipo', { n: data.n }), 'good', 'crown');
  else if (type === 'bug') { sfx('blip'); updateSceneFx(); if (!lsGet('od2_bug_hint')) { lsSet('od2_bug_hint', '1'); toast(L('bug.hint'), 'bad', 'star'); } }
  else if (type === 'bugEscaped') { toast(L('bug.escaped', { n: fmt(data.loss) }), 'bad'); updateSceneFx(); }
  else if (type === 'idea') { sfx('pop'); updateSceneFx(); if (!lsGet('od2_idea_hint')) { lsSet('od2_idea_hint', '1'); toast(L('idea.hint'), 'good', 'star'); } }
};

/* ---------- network → UI ---------- */
UIH.onEco = (e) => {
  UI.ecoVer = (UI.ecoVer || 0) + 1;
  // the entry deposit just got confirmed: tell the player clearly, once per device
  const ver = isVerified();
  if (ver && UI.wasVer === false && !lsGet('od2_ver_seen')) {
    lsSet('od2_ver_seen', '1');
    modalOrQueue(() => {
      openModal(`<div class="center"><i class="vbadge huge">${I('check', 34)}</i><h2 class="h2">${L('ver.title')}</h2><p class="sub">${L('ver.text')}</p><button class="btn big glow wide" data-act="close">${L('ver.ok')}</button></div>`, { id: 'verified' });
      confetti(120); sfx('floor'); haptic('ok');
    });
  }
  if (ver) lsSet('od2_ver_seen', '1');
  UI.wasVer = ver;
  const el = $('#hudpts');
  if (el) countUp(el, e.pts, 900, fmtPts);
  const big = $('#bigpts');
  if (big) countUp(big, e.pts, 900, fmtPts);
};
UIH.onGain = (g) => {

  if (!el) return;

  floatText(r.left + r.width / 2, r.bottom + 4, '+' + fmtPts(g), 'pts');

  if (pill) { pill.classList.remove('flash'); void pill.offsetWidth; pill.classList.add('flash'); }

UIH.onState = () => { UI.lastSig = ''; };
UIH.onStatus = () => render(true);
UIH.onOffline = (sec, cash) => { if (cash >= 1) modalOrQueue(() => showOffline(sec, cash)); };
UIH.onChallenge = (ch) => showChallenge(ch);
UIH.onRefAct = () => { toast(L('toast.ref_act'), 'good', 'users'); confetti(100); loadHub('friends', true); };
UIH.onDropped = (err) => toast(L(err === 'clock' ? 'toast.clock' : 'toast.synced'), err === 'clock' ? 'bad' : '');
UIH.onFatal = () => openModal(`<div class="center">${I('info', 30)}<h2 class="h2">${L('boot.session')}</h2><p class="sub">${L('boot.session_t')}</p><button class="btn big" data-act="retry">${L('boot.retry')}</button></div>`, { sticky: true, id: 'fatal' });
/* ---------- main loop ---------- */
function frame(now) {
  // up to 1 s per frame: a slow phone keeps game time in step with real time (no jumps when the server corrects it)
  const dt = Math.min(1, Math.max(0, (now - (UI.last || now)) / 1000));
  UI.last = now;
  if (S) {
    UI.acc = (UI.acc || 0) + dt * (NET.mode === 'demo' ? NET.speed : 1);
    let n = 0;
    while (UI.acc >= TICK && n < 40) { UI.acc -= TICK; advanceTicks(S, 1); n++; }
    if (UI.tapFlash > 0) UI.tapFlash = Math.max(0, UI.tapFlash - dt);
    netPump(Date.now());
    UI.liveAcc += dt;
    // while the battle arena is open the office behind it is not redrawn (all the phone's power goes to the fight)
    if (UI.liveAcc >= 0.2 && !UI.pvp) { UI.liveAcc = 0; render(); live(); tutUpdate(); }
    // the office scene adapts to the phone: slower phones get fewer scene frames instead of a laggy UI
    UI.sceneAcc += dt;
    // not redrawn behind an open window (it covers them) or on other tabs; slower phones get fewer scene frames
    if (UI.sceneAcc >= (UI.sceneStep || 0.045) && !UI.pvp && !UI.modal && UI.tab === 'office' && !document.hidden) {
      UI.sceneAcc = 0;
      const t0 = performance.now();
      drawScene(now / 1000);
      const ms = performance.now() - t0;
      // one-off spikes (GC, a theme rebuild) don't count fully; the rate only changes with a margin, so it doesn't flip back and forth
      UI.sceneMs = UI.sceneMs === undefined ? ms : UI.sceneMs * 0.92 + Math.min(ms, 40) * 0.08;
      const m = UI.sceneMs, st = UI.sceneStep || 0.045;
      UI.sceneStep = st === 0.045 ? (m > 14 ? 0.066 : st) : st === 0.066 ? (m > 24 ? 0.1 : m < 10 ? 0.045 : st) : (m < 18 ? 0.066 : st);
    }
    UI.cityAcc = (UI.cityAcc || 0) + dt;
    if (UI.cityAcc >= 0.033 && !UI.modal && UI.tab === 'city' && !document.hidden) { UI.cityAcc = 0; cityDraw(now); }
    UI.towerAcc += dt;
    if (UI.towerAcc >= 0.25 && !UI.modal && UI.tab === 'empire' && !document.hidden) { UI.towerAcc = 0; drawTowerCv(now / 1000); }
  }
  requestAnimationFrame(frame);
}

/* ---------- input wiring ---------- */
function wireInput() {
  document.addEventListener('pointerdown', vfxRipple, { passive: true });
  // donation amount typed by hand: keep it without re-rendering (so the keyboard stays open)
  document.addEventListener('input', (e) => {
    if (!e.target || e.target.id !== 'donin') return;
    UI.donAmt = Number(e.target.value) || 0;
    const n = donAmount();
    const b = $('[data-act="donstars"]');
    if (b) b.textContent = '⭐ ' + L('don.give', { n: fmt(n) });
    const d = UI.hub.donate || {};
    const t = $('[data-act="donsol"]');
    if (t && d.sol) t.innerHTML = I('sol', 14) + ' ' + solDonAmount() + ' SOL';
    document.querySelectorAll('.don-chips .chip').forEach((c) => c.classList.toggle('on', c.dataset.act === 'donamt:' + n));
  });
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    if (el.closest('.ovl') === null && UI.modal && !$('#ovl').hidden) return;
    ensureAudio();
    musicSync();
    const parts = el.dataset.act.split(':');
    const f = ACT[parts[0]];
    if (f) f.apply(null, parts.slice(1));
  });
  // the work button reacts on pointerdown (fast tapping), keyboard via click with detail 0
  document.addEventListener('pointerdown', (e) => {
    const b = e.target.closest('#workbtn');
    if (b) { e.preventDefault(); onWorkDown(e); return; }
    if (e.target.id === 'scene' && e.isTrusted !== false) { ensureAudio(); onSceneTap(e); }
    if (e.target.id === 'citycv') { ensureAudio(); cityTap(e); }
  }, { passive: false });
  document.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && document.activeElement && document.activeElement.id === 'workbtn') { e.preventDefault(); onWorkDown(e); }
    if (e.key === 'Escape' && UI.modal) closeModal();
  });
  $('#ovl').addEventListener('click', (e) => { if (e.target.id === 'ovl') closeModal(); });
  document.addEventListener('visibilitychange', () => {
    musicSync();
    if (document.hidden) netFlush();
    else {
      UI.last = performance.now();
      // back from the background: the phone may have dropped the canvas pixels (a black office) — redraw at once
      sizeScene(); drawScene(UI.last / 1000);
      if (UI.gwBack && Date.now() - UI.gwBack < 10 * 60000) setTimeout(() => gwCheck(false), 800);
      if (NET.mode === 'online') setTimeout(() => netSync(), 300);
    }
  });
  window.addEventListener('pagehide', () => netFlush());
  window.addEventListener('resize', () => { sizeScene(); });
  if (TG && TG.BackButton) {
    try {
      TG.BackButton.onClick(() => {
        if (UI.modal) closeModal();
        else if (UI.pvp) pvClose();
        else if (UI.tab !== 'office') go('office');
      });
    } catch (e) {}
  }
}

/* ---------- boot ---------- */
function splash(text, err) {
  const sp = $('#splash');
  if (!sp) return;
  const st = $('.sp-status', sp);
  if (st) st.textContent = text || '';
  sp.classList.toggle('err', !!err);
}
async function boot() {
  if (TG) {
    try {
      TG.ready();
      TG.expand();
      if (TG.setHeaderColor) TG.setHeaderColor('#060a26');
      if (TG.setBackgroundColor) TG.setBackgroundColor('#040719');
      if (TG.disableVerticalSwipes) TG.disableVerticalSwipes();
      if (TG.onEvent) {
        const redraw = () => { UI.last = performance.now(); sizeScene(); drawScene(UI.last / 1000); };
        TG.onEvent('activated', redraw);
        TG.onEvent('viewportChanged', (e) => { if (!e || e.isStateStable !== false) redraw(); });
      }
    } catch (e) {}
  }
  const tgLang = TG && TG.initDataUnsafe && TG.initDataUnsafe.user && TG.initDataUnsafe.user.language_code;
  setLang(lsGet('od2_lang') || detectLang(tgLang));
  splash(L('boot.connecting'));
  vfxInit();
  wireInput();
  let res;
  try { res = await netBoot(BUILD.mode === 'demo'); } catch (e) { res = { ok: false, err: 'server' }; }
  if (!res.ok) {
    const sp = $('#splash');
    splash(L('boot.err_' + (res.err === 'no_telegram' ? 'tg' : res.err === 'region' ? 'region' : 'server')), true);
    const box = sp && $('.sp-actions', sp);
    if (box) {
      box.innerHTML = res.err === 'no_telegram' && NET.cfg && NET.cfg.bot
        ? `<button class="btn big glow" data-act="openbot">${L('boot.open_tg')}</button><a class="btn ghost" href="/site" style="margin-top:10px">About the project · OFFX</a>`
        : res.err === 'region' ? '' : `<button class="btn big" data-act="retry">${L('boot.retry')}</button>`;
    }
    return;
  }
  if (!lsGet('od2_lang') && NET.me && NET.me.lang) setLang(NET.me.lang);
  UI.booted = true;
  tutLoad();
  if (COACH.i < 0 && lsGet('od2_intro')) COACH.i = TUT.length; // players from before the tutorial existed
  render(true);
  const sp = $('#splash');
  if (sp) { sp.classList.add('out'); setTimeout(() => sp.remove(), 700); }
  requestAnimationFrame((t) => { UI.last = t; frame(t); });
  if (!lsGet('od2_intro') && S.stats.taps < 5) setTimeout(showWelcome, 450);
  else if (S.pending) setTimeout(() => modalOrQueue(showEvent), 700);
  if (NET.mode === 'online') { setTimeout(() => loadHub('tasks'), 1500); }
  setTimeout(pvCheckDuel, 1200);
  setTimeout(() => { if (checkinReady() && lsGet('od2_ci') !== String(Math.floor(Date.now() / 86400000))) modalOrQueue(showCheckin); }, 2500);
}

BUILD.mode = "auto"; BUILD.version = "1.4.0";
window.__ev = function (c) { return eval(c); };
boot();
})();
