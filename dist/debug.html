.pv-dots { display: flex; gap: 6px; } .pv-dots i { width: 14px; height: 14px; border-radius: 4px; background: rgba(255, 255, 255, 0.1); } .pv-dots i.on { background: var(--yel); box-shadow: 0 0 8px rgba(255, 210, 63, 0.7); }
.pv-find { font-size: 17px; }
.pv-online { display: flex; align-items: center; gap: 8px; justify-content: center; color: var(--mut); font-size: 12px; margin: 0; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--grn); box-shadow: 0 0 8px var(--grn); animation: softpulse 1.6s ease-in-out infinite; }
.pv-how, .pv-topl { padding: 12px 14px; border-radius: 16px; background: var(--well); border: 1px solid var(--line-soft); }
.pv-how h3, .pv-topl h3 { margin: 0 0 6px; font-size: 13px; color: var(--cy2); text-transform: uppercase; letter-spacing: 1px; display: flex; gap: 6px; align-items: center; }
.pv-how ol { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13px; color: #d9defa; }
.pv-topl .board li.me { background: rgba(63, 208, 255, 0.12); border-radius: 8px; }
/* search */
.st-search { justify-items: center; text-align: center; align-content: center; min-height: 90vh; }
.pv-radar { position: relative; width: 190px; height: 190px; display: grid; place-items: center; margin: 18px 0 6px; }
.pv-radar i { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(255, 63, 208, 0.7); opacity: 0; animation: radar 2.4s ease-out infinite; }
.pv-radar i:nth-child(2) { animation-delay: 0.8s; border-color: rgba(63, 208, 255, 0.7); } .pv-radar i:nth-child(3) { animation-delay: 1.6s; }
.pv-radar span { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: radial-gradient(circle, #ff3fd0, #5a1572); box-shadow: 0 0 30px rgba(255, 63, 208, 0.8); animation: softpulse 1.2s ease-in-out infinite; }
@keyframes radar { from { transform: scale(0.35); opacity: 0.9; } to { transform: scale(1); opacity: 0; } }
.pv-st-t { margin: 0; font-size: 18px; }
.pv-timer { font-size: 22px; color: var(--cy2); }
/* fight */
.st-fight { min-height: 100%; }
.pv-fight { position: relative; display: grid; gap: 10px; min-height: calc(100vh - 40px); align-content: start; overflow: hidden; }
.pv-ftop { display: flex; justify-content: space-between; align-items: center; }
.pv-kind { font-size: 12px; font-weight: 700; color: var(--mut); }
.pv-clock { font-size: 26px; color: #fff; text-shadow: 0 0 12px var(--cy); }
.pv-clock.hot { color: var(--red); text-shadow: 0 0 14px var(--red); animation: softpulse 0.5s ease-in-out infinite; }
.pv-row { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; padding: 12px; border-radius: 16px; background: var(--well); border: 1.5px solid rgba(63, 208, 255, 0.45); }
.pv-row.op { border-color: rgba(255, 63, 208, 0.5); }
.pv-who { display: grid; gap: 2px; min-width: 0; }
.pv-who b { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pv-who small { color: var(--mut); font-size: 11.5px; }
.pv-sc { grid-row: span 2; align-self: center; font-size: 20px; color: var(--cy2); text-shadow: 0 0 10px var(--cy); min-width: 3ch; text-align: right; font-variant-numeric: tabular-nums; }
.pv-row.op .pv-sc { color: var(--mag2); text-shadow: 0 0 10px var(--mag); }
.pv-bar { height: 14px; border-radius: 8px; background: rgba(0, 0, 0, 0.5); overflow: hidden; }
.pv-bar i { display: block; height: 100%; transform-origin: left; transform: scaleX(0); background: linear-gradient(90deg, #1a6f9f, #3fd0ff, #9ff4ff); transition: transform 0.12s linear; }
.pv-row.op .pv-bar i { background: linear-gradient(90deg, #9a1f86, #ff3fd0, #ff8ae6); }
.pv-vs { justify-self: center; font-size: 14px; color: var(--yel); text-shadow: 0 0 10px rgba(255, 210, 63, 0.8); margin: -4px 0; }
.pv-lead { text-align: center; font-weight: 800; font-size: 15px; min-height: 20px; }
.pv-lead.lead { color: var(--grn); } .pv-lead.behind { color: var(--red); } .pv-lead.tie { color: var(--yel); }
.pv-tap { justify-self: center; width: min(68vw, 250px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; align-content: center; gap: 4px; color: #fff; background: radial-gradient(circle at 50% 35%, #ff8ae6, #ff3fd0 45%, #6b0f5e); box-shadow: 0 0 0 6px rgba(255, 63, 208, 0.25), 0 0 40px rgba(255, 63, 208, 0.6), inset 0 -10px 0 rgba(0, 0, 0, 0.25); touch-action: manipulation; user-select: none; -webkit-user-select: none; margin-top: 4px; }
.pv-tap span { font-size: 24px; text-shadow: 0 3px 0 rgba(0, 0, 0, 0.35); }
.pv-tap small { font-weight: 800; opacity: 0.9; }
.pv-tap:disabled { filter: grayscale(0.7) brightness(0.6); }
.pv-tap.hit { animation: tapbump 0.12s ease-out; }
@keyframes tapbump { 50% { transform: scale(0.93); } }
.pv-plus { position: absolute; pointer-events: none; font-size: 13px; color: var(--yel); text-shadow: 0 0 8px rgba(255, 210, 63, 0.9), 0 2px 0 #000; animation: pvplus 0.65s ease-out forwards; }
@keyframes pvplus { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -54px); } }
.pv-emotes { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.pv-emotes button { width: 44px; height: 44px; border-radius: 12px; font-size: 22px; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line-soft); }
.pv-emotes button:active { transform: scale(0.9); }
.pv-emo { position: absolute; right: 14px; top: -14px; font-size: 30px; pointer-events: none; animation: emo 1.6s ease-out forwards; }
.pv-row.me .pv-emo { right: auto; left: 40%; }
@keyframes emo { 0% { opacity: 0; transform: scale(0.4); } 15% { opacity: 1; transform: scale(1.25); } 30% { transform: scale(1); } 80% { opacity: 1; transform: translateY(-8px); } 100% { opacity: 0; transform: translateY(-20px); } }
.pv-count { position: fixed; inset: 0; z-index: 2; display: grid; place-items: center; font-size: 64px; color: #fff; text-shadow: 0 0 20px var(--mag), 0 0 50px var(--mag); background: rgba(5, 7, 32, 0.55); pointer-events: none; }
.pv-count.pop { animation: cnt 0.6s ease-out; }
.pv-count.go { color: var(--grn); text-shadow: 0 0 20px var(--grn), 0 0 50px var(--grn); }
@keyframes cnt { from { transform: scale(1.8); opacity: 0; } 40% { opacity: 1; } to { transform: scale(1); } }
/* result */
.st-result { align-content: center; min-height: 90vh; }
.pv-res { display: grid; gap: 12px; justify-items: center; text-align: center; }
.pv-banner { font-size: 30px; padding: 14px 22px; color: #fff; animation: skyin 0.6s cubic-bezier(.2,1.3,.4,1) both; }
.pv-res.win .pv-banner { color: var(--yel); text-shadow: 0 0 16px var(--yel), 0 0 40px rgba(255, 210, 63, 0.7); }
.pv-res.lose .pv-banner { color: #ff9bb8; text-shadow: 0 0 16px var(--red); }
.pv-final { display: flex; align-items: center; gap: 14px; }
.pv-final div { display: grid; gap: 4px; min-width: 0; } .pv-final small { color: var(--mut); max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pv-final b { font-size: 24px; color: var(--cy2); } .pv-final div:last-child b { color: var(--mag2); }
.pv-gain { display: grid; gap: 8px; justify-items: center; padding: 12px 16px; border-radius: 16px; background: var(--well); border: 1px solid var(--line-soft); width: 100%; }
.pv-trg { font-weight: 800; font-size: 16px; } .pv-trg.up { color: var(--grn); } .pv-trg.down { color: #ff9bb8; }
.pv-rw { display: flex; gap: 10px; align-items: baseline; } .pv-rw b { font-size: 18px; }
.pv-res .btn { width: 100%; }
@keyframes skyin { from { opacity: 0; transform: translateY(18px) scale(0.92); } to { opacity: 1; transform: none; } }
.pv-invite { display: grid; gap: 10px; justify-items: center; text-align: center; }
.pv-inv-ic { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: radial-gradient(circle, #ff3fd0, #5a1572); box-shadow: 0 0 30px rgba(255, 63, 208, 0.7); }
.pv-invite .btn { width: 100%; }
@media (prefers-reduced-motion: reduce) { .pv-radar i, .pv-radar span, .live-dot, .pv-clock.hot { animation: none; } }
.pv-row .pv-who { grid-column: 1; grid-row: 1; }
.pv-row .pv-bar { grid-column: 1; grid-row: 2; align-self: center; }
.pv-row .pv-sc { grid-column: 2; grid-row: 1 / 3; }

/* ---------- office header: the studio's name ---------- */
.op-head { align-items: center; }
.op-studio { display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; padding: 5px 10px; border-radius: 10px; font-weight: 800; font-size: 14px; color: #fff; background: rgba(63, 208, 255, 0.08); border: 1px solid rgba(63, 208, 255, 0.35); }
.op-studio span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.op-studio .ico { color: var(--cy); flex: none; }
.op-studio i { font-style: normal; opacity: 0.6; font-size: 12px; }
.op-studio.empty { color: var(--yel); border-style: dashed; border-color: rgba(255, 210, 63, 0.55); background: rgba(255, 210, 63, 0.06); }
.st-m { display: grid; gap: 10px; }
.st-in { width: 100%; padding: 12px 14px; border-radius: 12px; font: 700 16px/1.2 var(--ui); color: #fff; background: rgba(3, 6, 34, 0.9); border: 1.5px solid rgba(63, 208, 255, 0.5); outline: none; }
.st-in:focus { border-color: var(--cy); box-shadow: 0 0 14px rgba(63, 208, 255, 0.35); }
.st-err { margin: -4px 0 0; min-height: 16px; font-size: 12.5px; color: var(--red); }
/* ---------- floor renovation ---------- */
.reno-total { font-size: 10px; color: var(--yel); padding: 6px 8px; border-radius: 8px; background: rgba(255, 210, 63, 0.08); border: 1px solid rgba(255, 210, 63, 0.3); white-space: nowrap; align-self: flex-start; }
.f-stars { display: inline-flex; gap: 1px; margin-left: 4px; font-size: 11px; vertical-align: 1px; }
.f-stars i { font-style: normal; color: rgba(255, 255, 255, 0.18); }
.f-stars i.on { color: var(--yel); text-shadow: 0 0 6px rgba(255, 210, 63, 0.8); }
.f-reno { display: block; margin-top: 2px; color: #ffe08a !important; font-size: 11.5px; }
.btn.reno { display: grid; justify-items: center; gap: 1px; line-height: 1.1; background: linear-gradient(180deg, #ffd23f, #c8841a); color: #2a1a00; box-shadow: 0 0 12px rgba(255, 210, 63, 0.35); }
.btn.reno span { font-size: 11px; font-weight: 900; }
.btn.reno:disabled { background: rgba(255, 210, 63, 0.15); color: rgba(255, 230, 160, 0.6); box-shadow: none; }
.f-max { font-size: 11px; color: var(--yel); text-shadow: 0 0 8px rgba(255, 210, 63, 0.9); padding: 6px 8px; border-radius: 8px; border: 1px solid rgba(255, 210, 63, 0.5); }
.floor.own .f-no { position: relative; overflow: hidden; }
.floor.own .f-no::after { content: ''; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent); transform: skewX(-20deg); animation: fsweep 3.2s ease-in-out infinite; }
.floor.lv3 .f-no, .floor.lv4 .f-no { box-shadow: 0 0 10px rgba(52, 227, 122, 0.45); }
.floor.lv5 { border-color: rgba(255, 210, 63, 0.6); box-shadow: 0 0 14px rgba(255, 210, 63, 0.18); }
.floor.lv5 .f-no { background: rgba(255, 210, 63, 0.25); color: var(--yel); box-shadow: 0 0 12px rgba(255, 210, 63, 0.6); }
@keyframes fsweep { 0%, 60% { transform: translateX(0) skewX(-20deg); } 100% { transform: translateX(400%) skewX(-20deg); } }
.reno-stars { display: flex; gap: 6px; justify-content: center; font-size: 26px; }
.reno-stars span { color: rgba(255, 255, 255, 0.15); transition: transform 0.3s; }
.reno-stars span.on { color: var(--yel); text-shadow: 0 0 10px rgba(255, 210, 63, 0.9); }
.reno-stars span.new { opacity: 0; transform: scale(2.4); }
.reno-stars.lit span.new { opacity: 1; transform: none; transition: transform 0.45s cubic-bezier(.2,1.6,.4,1), opacity 0.2s; }
.reno-legend { font-weight: 800; color: var(--yel); text-shadow: 0 0 12px rgba(255, 210, 63, 0.7); margin: 0; }
@media (prefers-reduced-motion: reduce) { .floor.own .f-no::after { animation: none; } }

/* ============================================================
   v3 skin: neon glass, living borders, city skyline, tab glow
   ============================================================ */
@property --neo-a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
/* hero panels get a slowly rotating neon edge */
.panel.officep, .panel.mkt:not(.mini), .panel.towerp, .panel.ipo, .panel.tokhero2, .panel.invite, .panel.ptsp, .panel.workp {
  border-color: transparent;
  background:
    linear-gradient(160deg, var(--panel-a), var(--panel-b)) padding-box,
    conic-gradient(from var(--neo-a), rgba(63, 208, 255, 0.85), rgba(255, 63, 208, 0.85), rgba(255, 210, 63, 0.7), rgba(46, 230, 107, 0.7), rgba(63, 208, 255, 0.85)) border-box;
  border-width: 1.5px; border-style: solid;
  animation: neoSpin 9s linear infinite;
}
.panel.mkt:not(.mini) { background: radial-gradient(120% 90% at 0% 0%, rgba(46, 230, 107, 0.14), transparent 60%) padding-box, linear-gradient(160deg, var(--panel-a), var(--panel-b)) padding-box, conic-gradient(from var(--neo-a), rgba(46, 230, 107, 0.9), rgba(34, 230, 255, 0.8), rgba(255, 63, 208, 0.6), rgba(46, 230, 107, 0.9)) border-box; }
@keyframes neoSpin { to { --neo-a: 360deg; } }
/* glass feel on every panel: a soft top sheen */
.panel { overflow: visible; }
.panel::after { content: ''; position: absolute; inset: 1px; border-radius: inherit; pointer-events: none; background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 28%); }
/* headings: brighter neon */
.h2 { color: #c4f8ff; text-shadow: 0 0 10px rgba(63, 208, 255, 0.55), 0 0 22px rgba(255, 63, 208, 0.18); }
/* tappable cards press in */
.panel[data-act] { cursor: pointer; transition: transform 0.12s; }
.panel[data-act]:active { transform: scale(0.98); }
/* tab bar: glowing pill under the active tab, icon hop on change */
#tabs .tab.on::after { content: ''; position: absolute; left: 28%; right: 28%; bottom: 2px; height: 3px; border-radius: 3px; background: linear-gradient(90deg, #3fd0ff, #ff3fd0); box-shadow: 0 0 10px #3fd0ff, 0 0 18px rgba(255, 63, 208, 0.6); animation: tabBar 0.35s cubic-bezier(0.2, 1.6, 0.4, 1); }
#tabs .tab.on .ico { animation: tabHop 0.45s cubic-bezier(0.2, 1.6, 0.4, 1); }
@keyframes tabBar { from { transform: scaleX(0); opacity: 0; } }
@keyframes tabHop { 40% { transform: translateY(-7px) scale(1.2); } }
/* the big WORK button breathes */
.btn.green.big:not(:disabled), .btn.big.glow:not(:disabled) { position: relative; }
/* city skyline at the bottom of the screen with lit windows */
#skyline { position: fixed; left: 0; right: 0; bottom: 0; height: 30vh; z-index: 0; pointer-events: none; image-rendering: pixelated; background-repeat: repeat-x; background-position: bottom center; background-size: auto 100%; opacity: 0.38; mask-image: linear-gradient(180deg, transparent, #000 35%); -webkit-mask-image: linear-gradient(180deg, transparent, #000 35%); }
/* floating neon motes */
#motes { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
#motes i { position: absolute; bottom: -10px; width: 3px; height: 3px; border-radius: 50%; background: #3fd0ff; box-shadow: 0 0 8px #3fd0ff; opacity: 0; animation: mote linear infinite; }
#motes i:nth-child(3n) { background: #ff3fd0; box-shadow: 0 0 8px #ff3fd0; }
#motes i:nth-child(4n) { background: #ffd23f; box-shadow: 0 0 8px #ffd23f; width: 2px; height: 2px; }
@keyframes mote { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: 0.8; } 90% { opacity: 0.6; } 100% { transform: translateY(-105vh) translateX(30px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #motes { display: none; } .panel { animation: none !important; } }
/* listing terms: what is free on listing day */
.vest { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 9px; }
.vest .v-h { display: flex; align-items: center; gap: 7px; font-size: 13px; }
.vest .v-h i { flex: none; width: 10px; height: 10px; border-radius: 3px; }
.vest .v-h b { flex: 1; min-width: 0; }
.vest .v-h .chip { flex: none; font-size: 11px; }
.vest .v-bar { height: 7px; margin: 5px 0 3px; border-radius: 4px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
.vest .v-bar i { display: block; height: 100%; border-radius: 4px; }
.listing .bul { margin: 10px 0 6px; }
/* SOL payment modal */
.sp-amt, .sp-to { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 10px; padding: 10px 12px; margin: 8px 0; border-radius: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(153, 69, 255, 0.35); }
.sp-amt small, .sp-to small { grid-column: 1 / -1; color: var(--ink2); font-size: 12px; }
.sp-amt b { font-size: 20px; color: #14f195; text-shadow: 0 0 10px rgba(20, 241, 149, 0.5); word-break: break-all; }

.vcard small { display: block; color: var(--ink2); font-size: 12px; line-height: 1.35; margin-top: 2px; }
.adrop .fund-h { display: flex; align-items: baseline; gap: 8px; margin: 6px 0; }

.don-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }

.mk-price { min-width: 0; flex-wrap: wrap; }

.panel.officep, .panel.mkt:not(.mini), .panel.towerp, .panel.ipo, .panel.tokhero2, .panel.invite, .panel.ptsp, .panel.workp { animation: none; --neo-a: 210deg; }

.btn::after { animation: none; will-change: auto; display: none; }
.btn.glow:not(:disabled)::after, .btn.big.gold::after { display: block; animation: shine2 5s ease-in-out infinite; will-change: transform; }
/* fewer, cheaper floating motes (no glow shadow) */
#motes i { box-shadow: none !important; }
#motes i:nth-child(n+9) { display: none; }
/* no animations while the app is in the background or for players who asked for less motion */
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.stats b s.was { color: var(--mut); font-weight: 600; font-size: 0.85em; text-decoration: line-through; opacity: 0.75; margin-right: 2px; }

function icoSVG(name, size, cls) {
  const rows = ICONS[name];
  if (!rows) return '';
  let rects = '';
  for (let y = 0; y < rows.length; y++) {
    const row = rows[y];
    let x = 0;
    while (x < row.length) {
      const ch = row[x];
      if (ch === '.') { x++; continue; }
      let x2 = x + 1;
      while (x2 < row.length && row[x2] === ch) x2++;
      const fill = ch === '#' ? 'currentColor' : ICON_PAL[ch];
      rects += `<rect x="${x}" y="${y}" width="${x2 - x}" height="1" fill="${fill}"/>`;
      x = x2;
    }
  }
  const px = size || 18;
  return `<svg class="ico ${cls || ''}" viewBox="0 0 11 11" width="${px}" height="${px}" shape-rendering="crispEdges" aria-hidden="true">${rects}</svg>`;
}

/* ---- src/i18n.js ---- */
/* ============================================================
   OFFICE DREAMS — i18n
   L('key', {param}) → text in the current language.
   Params that are strings starting with '$' are keys themselves
   (the engine stores '$role.prog.name' so the log is language-free).
   ============================================================ */
const LANGS = {};
const LANG_LIST = ['en', 'ru', 'uk'];
let LANG = 'en';

function setLang(code) {
  LANG = LANG_LIST.includes(code) ? code : 'en';
  if (typeof document !== 'undefined' && document.documentElement) document.documentElement.lang = LANG;
  return LANG;
}
function detectLang(tgCode) {
  const c = String(tgCode || (typeof navigator !== 'undefined' && navigator.language) || 'en').toLowerCase();
  if (c.startsWith('uk')) return 'uk';
  if (c.startsWith('ru') || c.startsWith('be') || c.startsWith('kk')) return 'ru';
  return 'en';
}
function hasKey(k) {
  return (LANGS[LANG] && LANGS[LANG][k] !== undefined) || (LANGS.en && LANGS.en[k] !== undefined);
}
function L(k, p) {
  let t = LANGS[LANG] && LANGS[LANG][k];
  if (t === undefined) t = LANGS.en && LANGS.en[k];
  if (t === undefined) return k;
  if (!p) return t;
  return t.replace(/\{(\w+)\}/g, (m, name) => {
    let v = p[name];
    if (v === undefined || v === null) return '';
    if (typeof v === 'string' && /^\$[a-z]/.test(v)) v = L(v.slice(1));
    return String(v);
  });
}

/* LR('key') → a random wording of the same message: 'key', 'key.v2', 'key.v3'…
   Never repeats the previous pick for that key. hold (ms) keeps the same pick for a while
   (for text that is re-rendered all the time, like the office bubble). */
const LR_LAST = {};
function LR(k, p, hold) {
  const d = LANGS[LANG] || LANGS.en || {};
  let n = 1; while (d[k + '.v' + (n + 1)] !== undefined) n++;
  if (n === 1) return L(k, p);
  const now = Date.now(), m = LR_LAST[k];
  let i;
  if (hold && m && now - m.at < hold) i = m.i;
  else { i = m ? Math.floor(Math.random() * (n - 1)) : Math.floor(Math.random() * n); if (m && i >= m.i) i++; LR_LAST[k] = { i, at: now }; }
  return L(i ? k + '.v' + (i + 1) : k, p);
}

  "tut.welcome": "👋 Hi! A quick 2-minute tour. The glowing frame shows where to tap — just follow it. Don’t need it? Tap “Skip tutorial”. You can replay it any time: ❓ Help → Tutorial.",
  "tut.mood": "😊 Team mood and ⭐ reputation. A happy team works faster. Tap these bars any time to see how to raise them.",
  "tut.giveaway": "🎁 Giveaways with prizes run when a sponsor joins us — we announce them in the channel and the bot. To take part: 1) get verified, 2) subscribe to the channel. Then just play — the most active win.",
  "tut.gw_new": "🎁 A giveaway is on! It runs while there is a sponsor. Get verified and subscribe to the channel — then just play: the most active players win.",
  "tut.cash": "💰 Money of your studio. It pays salaries, hires people, buys upgrades and new floors. Games and taps earn it.",
  "tut.gems": "💎 Gems are the rare currency: boosts, speed-ups and special items. You get them from quests, contracts and battles.",
  "tut.life": "🏢 Your office is alive! 💡 Catch ideas above people’s heads — a big boost. 🐞 Squash crawling bugs. 📞 When the phone rings — pick it up. Tap people to chat with them.",
  "tut.empire": "🏙 Empire: buy new floors — more room for staff, more money. Each floor can be renovated up to ★5.",
  "tut.airdrop": "🪙 What is an airdrop? The project gives its own token OFFX to players for free. A token is a digital coin on the Solana blockchain. The more points you earn, the bigger your share. Keep it or sell it — your choice; the price is set by the market, there are no guarantees.",
  "tut.wallet": "👛 To receive tokens and giveaway prizes you need a Solana wallet — a free app: Phantom or Solflare. Copy your wallet address and paste it here: Airdrop → Token → “Connect wallet”. Never share your secret phrase with anyone!",
  "tut.help": "❓ Forgot something? This button opens the full help and replays this tutorial. Tap your avatar (top left) for settings: music, sound, language.",
  "tut.genre": "Step 1. Pick the kind of game your studio will make. The one with ▲ is popular right now and sells ×1.5.",
  "tut.start": "Tap the glowing “Start project” button — your team starts making the game.",
  "tut.tap": "👆 Tap the big WORK button several times! Each tap moves the game forward and brings money.",
  "tut.energy": "⚡ This yellow bar is energy. Taps use it, and it refills by itself. Your team keeps working even when you don’t tap.",
  "tut.release": "This is your game in progress. At 100% it comes out and earns money every day — even while you are away.",
  "tut.hire": "👥 Hire your first employee ($140). Staff work on their own, so the game moves without your taps.",
  "tut.quests": "📋 Quests: tasks of the day and story events. Tap here every day — they give money, gems and points.",
  "tut.points": "🪙 These are your airdrop points. They grow from real play: releases, upgrades, quests, daily check-ins, friends. Points are not money.",
  "tut.token": "✅ Verification: a one-time $1 deposit (≈80 ⭐ Telegram Stars or SOL). It proves you are a real player and gives you a share of the 90,000,000 OFFX airdrop. The token price is set by the market.",
  "tut.friends": "👥 Invite friends with your link: you get a share of their points and bonuses.",
  "tut.done": "🎉 Done! Come back every day: collect the daily reward, finish quests and play a little. Good luck with your studio!",

  "tut.cash": "💰 Деньги студии. На них платишь зарплату, нанимаешь людей, покупаешь улучшения и этажи. Деньги приносят игры и нажатия.",
  "tut.gems": "💎 Кристаллы — редкая валюта: бусты, ускорения и особые предметы. Их дают квесты, заказы на бирже и битвы.",
  "tut.life": "🏢 Офис живой! 💡 Лови идеи над головами сотрудников — это большой рывок. 🐞 Дави ползающих багов. 📞 Звонит телефон — бери трубку. Нажимай на людей, чтобы поболтать.",
  "tut.empire": "🏙 Империя: покупай новые этажи — больше места для команды и больше денег. Каждый этаж можно отремонтировать до ★5.",
  "tut.airdrop": "🪙 Что такое аирдроп? Проект бесплатно раздаёт свой токен OFFX игрокам. Токен — это цифровая монета в блокчейне Solana. Чем больше у тебя очков — тем больше доля. Держать или продать — решаешь сам; цену определяет рынок, гарантий нет.",
  "tut.wallet": "👛 Чтобы получить токены и призы розыгрышей, нужен Solana-кошелёк — бесплатное приложение Phantom или Solflare. Скопируй адрес кошелька и вставь сюда: Аирдроп → Токен → «Подключить кошелёк». Никому не сообщай секретную фразу!",
  "tut.help": "❓ Что-то забыл? Эта кнопка открывает полную помощь и повтор обучения. Нажми на свою аватарку (слева вверху) — там настройки: музыка, звук, язык.",
  "tut.genre": "Шаг 1. Выбери, какую игру будет делать твоя студия. Жанр со значком ▲ сейчас популярен и продаётся ×1.5.",
  "tut.start": "Нажми светящуюся кнопку «Начать проект» — команда начнёт делать игру.",
  "tut.tap": "👆 Нажми большую кнопку РАБОТАТЬ несколько раз! Каждое нажатие двигает игру вперёд и приносит деньги.",
  "tut.energy": "⚡ Жёлтая полоска — энергия. Нажатия её тратят, а восстанавливается она сама. Команда работает, даже когда ты не нажимаешь.",
  "tut.release": "Это твоя игра в работе. На 100% она выходит и приносит деньги каждый день — даже когда тебя нет в игре.",
  "tut.hire": "👥 Найми первого сотрудника ($140). Сотрудники работают сами — игра движется без твоих нажатий.",
  "tut.quests": "📋 Квесты: задания дня и истории с выбором. Заглядывай сюда каждый день — дают деньги, кристаллы и очки.",
  "tut.points": "🪙 Это твои очки аирдропа. Они растут от реальной игры: релизы, улучшения, квесты, ежедневный вход, друзья. Очки — не деньги.",
  "tut.token": "✅ Верификация: разовый депозит $1 (≈80 ⭐ звёздами Telegram или в SOL). Он подтверждает, что ты живой игрок, и даёт долю в аирдропе 90 000 000 OFFX. Цену токена определяет рынок.",
  "tut.friends": "👥 Приглашай друзей по своей ссылке: тебе идёт часть их очков и бонусы.",
  "tut.done": "🎉 Готово! Заходи каждый день: забирай ежедневную награду, выполняй квесты и немного играй. Удачи твоей студии!",

  "tut.welcome": "👋 Привіт! Коротке знайомство на 2 хвилини. Рамка, що світиться, показує, куди натискати — просто йди за нею. Не потрібно? Натисни «Пропустити навчання». Повернути його можна завжди: ❓ Допомога → Навчання.",
  "tut.mood": "😊 Настрій команди та ⭐ репутація. Задоволена команда працює швидше. Натисни на ці смужки будь-коли — підкажемо, як їх підняти.",
  "tut.giveaway": "🎁 Розіграші з призами проходять, коли в нас є спонсор — про них оголошуємо в каналі та в боті. Щоб брати участь: 1) пройди верифікацію, 2) підпишись на канал. Далі просто грай — перемагають найактивніші.",
  "tut.gw_new": "🎁 Триває розіграш! Він проходить, поки є спонсор. Пройди верифікацію й підпишись на канал — далі просто грай: перемагають найактивніші.",
  "tut.cash": "💰 Гроші студії. Ними платиш зарплату, наймаєш людей, купуєш покращення й поверхи. Гроші приносять ігри та натискання.",
  "tut.gems": "💎 Кристали — рідкісна валюта: бусти, прискорення й особливі предмети. Їх дають квести, замовлення на біржі та битви.",
  "tut.life": "🏢 Офіс живий! 💡 Лови ідеї над головами працівників — це великий ривок. 🐞 Тисни багів, що повзають. 📞 Дзвонить телефон — бери слухавку. Натискай на людей, щоб поговорити.",
  "tut.empire": "🏙 Імперія: купуй нові поверхи — більше місця для команди й більше грошей. Кожен поверх можна відремонтувати до ★5.",
  "tut.airdrop": "🪙 Що таке аірдроп? Проєкт безкоштовно роздає свій токен OFFX гравцям. Токен — це цифрова монета в блокчейні Solana. Що більше в тебе балів — то більша частка. Тримати чи продати — вирішуєш сам; ціну визначає ринок, гарантій немає.",
  "tut.wallet": "👛 Щоб отримати токени й призи розіграшів, потрібен Solana-гаманець — безкоштовний застосунок Phantom або Solflare. Скопіюй адресу гаманця й встав сюди: Аірдроп → Токен → «Підключити гаманець». Нікому не повідомляй секретну фразу!",
  "tut.help": "❓ Щось забув? Ця кнопка відкриває повну допомогу й повтор навчання. Натисни на свою аватарку (зліва вгорі) — там налаштування: музика, звук, мова.",
  "tut.genre": "Крок 1. Обери, яку гру робитиме твоя студія. Жанр зі значком ▲ зараз популярний і продається ×1,5.",
  "tut.start": "Натисни кнопку «Почати проєкт», що світиться, — команда почне робити гру.",
  "tut.tap": "👆 Натисни велику кнопку ПРАЦЮВАТИ кілька разів! Кожне натискання рухає гру вперед і приносить гроші.",
  "tut.energy": "⚡ Жовта смужка — енергія. Натискання її витрачають, а відновлюється вона сама. Команда працює, навіть коли ти не натискаєш.",
  "tut.release": "Це твоя гра в роботі. На 100% вона виходить і приносить гроші щодня — навіть коли тебе немає в грі.",
  "tut.hire": "👥 Найми першого працівника ($140). Працівники працюють самі — гра рухається без твоїх натискань.",
  "tut.quests": "📋 Квести: завдання дня та історії з вибором. Заходь сюди щодня — дають гроші, кристали й бали.",
  "tut.points": "🪙 Це твої бали аірдропу. Вони ростуть від справжньої гри: релізи, покращення, квести, щоденний вхід, друзі. Бали — не гроші.",
  "tut.token": "✅ Верифікація: разовий депозит $1 (≈80 ⭐ зірками Telegram або в SOL). Він підтверджує, що ти живий гравець, і дає частку в аірдропі 90 000 000 OFFX. Ціну токена визначає ринок.",
  "tut.friends": "👥 Запрошуй друзів за своїм посиланням: тобі йде частина їхніх балів і бонуси.",

/* ---------- helpers ---------- */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const round2 = (v) => Math.round(v * 100) / 100;
function fmt(n) {
  n = Math.floor(n);
  if (n >= 1e9) return (n / 1e9).toFixed(2).replace(/\.?0+$/, '') + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'M';
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}
// deterministic PRNG (mulberry32) — state lives in s.rng
function rand(s) {
  s.rng = (s.rng + 0x6d2b79f5) >>> 0;
  let t = s.rng;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rnd = (s, a, b) => a + rand(s) * (b - a);
const pick = (s, arr) => arr[Math.floor(rand(s) * arr.length)];
const fail = (err) => ({ ok: false, err });
const OK = { ok: true };
function cleanName(str) {
  const t = String(str == null ? '' : str).replace(/[^\p{L}\p{N} .'!?\-]/gu, '').replace(/\s+/g, ' ').trim().slice(0, 22);
  return t;
}

/* ---------- derived values ---------- */
const floorOn = (s, id) => s.floors[id] > 0;
const hiredCount = (s) => ROLES.filter((r) => s.staff[r].lvl > 0).length;
const moodF = (m) => 0.7 + 0.3 * (m / 100);
// strength of a support role: level × mood factor (0 when not hired)
const roleK = (s, r) => (s.staff[r] && s.staff[r].lvl > 0 ? s.staff[r].lvl * moodF(s.staff[r].mood) : 0);
const roleLocked = (s, r) => !!(ROLE[r].need && !(s.floors[ROLE[r].need] > 0));
const qaBonus = (s) => 0.12 * roleK(s, 'qa');
const prodBonus = (s) => 0.04 * roleK(s, 'prod');
const sndBonus = (s) => 0.03 * roleK(s, 'snd');
const saleDecay = (s) => Math.min(0.8, SALE_DECAY + 0.01 * roleK(s, 'cm'));
const speedOf = (l) => 1 + 0.18 * (l - 1);
const legacyMult = (s) => 1 + 0.15 * s.legacy;
const renoLvl = (s, id) => (s.flv && s.flv[id]) || 0;
function renoBonus(s, k) {
  let b = 0;
  for (const id of FLOOR_ORDER) if (RENO[id].k === k) b += RENO[id].v * renoLvl(s, id);
  return b;
}
const renoStars = (s) => FLOOR_ORDER.reduce((n, id) => n + renoLvl(s, id), 0);
const renoCost = (s, id) => (renoLvl(s, id) >= RENO_MAX ? null : Math.round(RENO[id].base * RENO_COST[renoLvl(s, id)]));
function salaryOf(s, role, lvl) {
  const l = lvl === undefined ? s.staff[role].lvl : lvl;
  if (l <= 0) return 0;
  return Math.round(ROLE[role].sal * ECON.salK * Math.pow(1.3, l - 1) * (floorOn(s, 'f1') ? 0.9 : 1) * (1 - renoBonus(s, 'sal')));
}
function upCost(role, lvl) {
  return Math.round(ROLE[role].up * Math.pow(ECON.upGrowth, lvl - 1));
}
function youUpCost(lvl) {
  return Math.round(80 * Math.pow(ECON.upGrowth, lvl - 1));
}
function maxEnergy(s) {
  return 40 + 10 * (s.you.lvl - 1);
}
function energyRegen(s) {
  return 1.4 + (s.items.coffee ? 0.6 : 0);
}
function wpMult(s) {
  let m = 1;
  if (s.items.chairs) m *= 1.06;
  if (s.items.monitor2) m *= 1.1;
  if (floorOn(s, 'f4')) m *= 1.12;
  m *= 1 + renoBonus(s, 'wp');
  m *= 1 + prodBonus(s);
  if (s.buffs.turbo > 0) m *= 2;
  return m;
}
function wpRole(s, r) {
  const st = s.staff[r];
  if (st.lvl <= 0 || ROLE[r].wp === 0) return 0;
  let k = ROLE[r].wp * speedOf(st.lvl) * moodF(st.mood);
  if (floorOn(s, 'f2') && (r === 'art' || r === 'des')) k *= 1.1;
  return k * wpMult(s);
}
function wpTotal(s) {
  let sum = 0.35 * (1 + 0.08 * (s.you.lvl - 1)) * wpMult(s);
  for (const r of ['prog', 'art', 'des', 'snd']) sum += wpRole(s, r);
  return sum;
}
function tapPower(s) {
  const k = 1 + 0.18 * (s.you.lvl - 1);
  const boost = (s.items.monitor2 ? 1.2 : 1) * (s.buffs.turbo > 0 ? 1.5 : 1);
  return { pts: 3 * k * boost, cash: 1.4 * ECON.tapK * k * (1 + 0.05 * FLOOR_ORDER.filter((f) => floorOn(s, f)).length) * (1 + 0.1 * s.legacy) * (1 + renoBonus(s, 'tap')) };
}
function salaryTotal(s) {
  let t = 0;
  for (const r of ROLES) t += salaryOf(s, r);
  return t;
}
function salesMult(s, tier) {
  let m = 1 + s.rep / 1500;
  if (tier) m /= 1 + s.rep / TIERS[tier].fit;
  if (floorOn(s, 'f3')) m *= 1.2;
  if (floorOn(s, 'f5')) m *= 1.15;
  m *= 1 + renoBonus(s, 'sales');
  if (s.items.rack) m *= 1.06;
  if (s.items.lounge) m *= 1.04;
  const mk = s.staff.mkt;
  if (mk.lvl > 0) m *= 1 + 0.07 * mk.lvl * moodF(mk.mood);
  m *= 1 + sndBonus(s);
  return m * legacyMult(s);
}
function dailySalesRate(s) {
  let r = 0;
  for (const g of s.games) if (g.active) r += g.rate;
  return r;
}
function projectNeed(genre, tier) {
  return Math.round(GENRES[genre].pts * TIERS[tier].pts);
}
function tierUnlocked(s, tier) {
  return floorOn(s, TIERS[tier].need);
}
function effLevel(s, r) {
  const st = s.staff[r];
  const base = 0.5 * s.you.lvl;
  return st.lvl > 0 ? Math.max(base, st.lvl * (0.85 + 0.15 * (st.mood / 100))) : base;
}
function qualityFor(s, genre) {
  const g = GENRES[genre];
  let q = 0;
  for (const r of ['prog', 'art', 'des']) {
    const qr = clamp(0.12 + 0.088 * effLevel(s, r), 0, 1);
    q += g.w[r] * qr;
  }
  return q;
}
function scoreMult(score) {
  return clamp(Math.pow(score / 6, 1.9), 0.1, 3.5);
}
function expectedScore(s, genre) {
  const hot = s.trend.hot === genre ? 0.3 : 0;
  return clamp(3 + 7 * qualityFor(s, genre) + hot + qaBonus(s), 1, 10);
}
// language-independent rank id; UI shows L('rank.' + id)
function rankOf(s) {
  if (s.floors.f5) return 'owner';
  if (s.floors.f4) return 'director';
  if (s.floors.f2) return 'lead';
  if (s.stats.released > 0) return 'indie';
  return 'freelancer';
}
function dayMinutes(s) {
  return Math.floor((s.clock / DAY_SEC) * 720);
}
function clockText(s) {
  const m = 480 + dayMinutes(s);
  return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
}
function incomeEstimate(s) {
  return Math.max(s.income3, 40);
}
function newName(s, genre) {
  return pick(s, GENRES[genre].names);
}

/* ---------- the city: coffee shop, academy, contract board, game store ---------- */
const CITY = {
  cofCd: 900, // coffee break: +60% energy + team mood, every 15 min, for a small bill
  cofCost: (s) => Math.max(20, Math.round(incomeEstimate(s) * 0.12 / 10) * 10),
  promoCd: 1800, // store promo for the newest game, every 30 min
  trnSec: (lvl) => 600 + 300 * lvl, // academy course length (10 min at level 1 … 55 min at level 9)
  trnCost: (role, lvl) => Math.round(upCost(role, lvl) * 0.4), // a course is 60% cheaper than an upgrade, but takes time
  trnGems: 2, // finish a course right now
  ctrSec: 3600, // a contract must be shipped within an hour
  ctrCd: 300, // a new offer 5 min after the last one ended
  fndCd: 300, // something shiny on the street: one find every 5 min
  fndCash: (s) => Math.max(10, Math.round(incomeEstimate(s) * 0.05 / 5) * 5), // pocket money, about half a coffee
};
const cityOf = (s) => s.city || (s.city = { cof: 0, promo: 0, trn: null, ctr: null, offer: null, ctrNext: 0, done: 0 });
function coffeeBreak(s) {
  const c = cityOf(s);
  if (s.t < c.cof) return fail('cooldown');
  const cost = CITY.cofCost(s);
  if (s.cash < cost) return fail('cash');
  s.cash -= cost;
  c.cof = s.t + CITY.cofCd;
  s.energy = Math.min(maxEnergy(s), s.energy + maxEnergy(s) * 0.6);
  moodAll(s, 6);
  bump(s);
  emit('sfx', 'coin');
  return OK;
}
// a find on the street (a dropped coin, a lost wallet…): small cash, rarely a gem — never points
function streetFind(s) {
  const c = cityOf(s);
  if (s.t < (c.fnd || 0)) return fail('cooldown');
  c.fnd = s.t + CITY.fndCd;
  c.fndN = (c.fndN || 0) + 1;
  const gem = rand(s) < 1 / 15;
  if (gem) s.gems += 1; else s.cash += CITY.fndCash(s);
  bump(s);
  emit('find', { gem, cash: gem ? 0 : CITY.fndCash(s) });
  emit('sfx', gem ? 'pts' : 'coin');
  return OK;
}
function storePromo(s) {
  const c = cityOf(s);
  const g = s.games.find((x) => x.active);
  if (!g) return fail('no_game');
  if (s.t < c.promo) return fail('cooldown');
  const cost = promoCost(s);
  if (s.cash < cost) return fail('cash');
  s.cash -= cost;
  g.rate *= 1.35;
  c.promo = s.t + CITY.promoCd;
  addLog(s, 'log.promo', { name: g.name }, 'good');
  bump(s);
  emit('sfx', 'hit');
  return OK;
}
function promoCost(s) {
  return Math.round(Math.max(80, incomeEstimate(s) * 0.4) / 10) * 10;
}
function startTraining(s, role) {
  const c = cityOf(s), st = s.staff[role];
  if (!st || st.lvl <= 0) return fail('hire_first');
  if (st.lvl >= MAX_LVL) return fail('max');
  if (c.trn) return fail('trn_busy');
  const cost = CITY.trnCost(role, st.lvl);
  if (s.cash < cost) return fail('cash');
  s.cash -= cost;
  c.trn = { role, end: s.t + CITY.trnSec(st.lvl) };
  bump(s);
  emit('sfx', 'up');
  return OK;
}
function finishTraining(s, now) {
  const c = cityOf(s);
  if (!c.trn) return fail('unavailable');
  if (now) {
    if (s.gems < CITY.trnGems) return fail('gems');
    s.gems -= CITY.trnGems;
  }
  const st = s.staff[c.trn.role];
  const role = c.trn.role;
  c.trn = null;
  if (st && st.lvl > 0 && st.lvl < MAX_LVL) {
    st.lvl++;
    st.mood = Math.min(100, st.mood + 8);
    s.stats.ups++;
    addLog(s, 'log.trained', { role: '$role.' + role + '.name', lvl: st.lvl }, 'good');
    emit('trained', { role, lvl: st.lvl });
  }
  bump(s);
  checkGoals(s);
  return OK;
}
function bestTier(s) {
  let t = 'mini';
  for (const x of ['indie', 'big']) if (tierUnlocked(s, x)) t = x;
  return t;
}
function makeOffer(s) {
  const pool = GENRE_ORDER.filter((g) => g !== s.trend.cold);
  const genre = pick(s, pool), tier = bestTier(s);
  const min = clamp(Math.floor(expectedScore(s, genre)), 5, 9);
  const cash = Math.round(Math.max(300, incomeEstimate(s) * 3 * Math.sqrt(TIERS[tier].rev)) / 10) * 10;
  return { genre, tier, min, cash, gems: tier === 'mini' ? 1 : 2 };
}
function takeContract(s) {
  const c = cityOf(s);
  if (c.ctr) return fail('ctr_busy');
  if (!c.offer) return fail('unavailable');
  c.ctr = Object.assign({}, c.offer, { until: s.t + CITY.ctrSec });
  c.offer = null;
  bump(s);
  emit('sfx', 'coin');
  return OK;
}
function dropContract(s) {
  const c = cityOf(s);
  if (!c.ctr) return fail('unavailable');
  c.ctr = null;
  c.ctrNext = s.t + CITY.ctrCd;
  bump(s);
  return OK;
}
// a released game may fulfil the active contract
function checkContract(s, game) {
  const c = cityOf(s), k = c.ctr;
  if (!k || game.genre !== k.genre || game.score < k.min || TIER_ORDER.indexOf(game.tier) < TIER_ORDER.indexOf(k.tier)) return;
  giveCash(s, k.cash);
  giveGems(s, k.gems);
  s.rep = round2(s.rep + 1);
  s.stats.evs++;
  c.done++;
  c.ctr = null;
  c.ctrNext = s.t + CITY.ctrCd;
  addLog(s, 'log.contract', { cash: fmt(k.cash), gems: k.gems }, 'good');
  emit('contract', k);
}
function cityTick(s) {
  const c = cityOf(s);
  if (c.trn && s.t >= c.trn.end) finishTraining(s, false);
  if (c.ctr && s.t >= c.ctr.until) {
    c.ctr = null;
    c.ctrNext = s.t + CITY.ctrCd;
    if (!s.off) emit('toast', { k: 'toast.ctr_late', kind: 'bad' });
    bump(s);
  }
  if (!c.ctr && !c.offer && s.stats.released >= 1 && s.t >= c.ctrNext) { c.offer = makeOffer(s); bump(s); }
}

/* ---------- log (language-independent: key + params) ---------- */
function addLog(s, k, p, kind, ev) {
  const e = { day: s.day, k, p: p || {}, kind: kind || 'info' };
  if (ev) e.ev = ev;
  s.log.unshift(e);
  if (s.log.length > 40) s.log.length = 40;
}
function giveGems(s, n) {
  s.gems = Math.max(0, Math.round(s.gems + n));
}
function giveCash(s, amount) {
  s.cash += amount;
  if (amount > 0) s.earned += amount;
}

/* ---------- actions ---------- */
function doTap(s) {
  const cost = 2;
  if (s.energy < cost) return null;
  s.energy -= cost;
  const p = tapPower(s);
  giveCash(s, p.cash);
  s.dayIncome += p.cash;
  s.stats.taps++;
  if (s.project) {
    s.project.pts += p.pts;
    if (s.project.pts >= s.project.need) release(s);
  }
  return p;
}
function hire(s, role) {
  const st = s.staff[role];
  if (st.lvl > 0) return fail('owned');
  if (roleLocked(s, role)) return fail('locked');
  const price = ROLE[role].hire;
  if (s.cash < price) return fail('cash');
  s.cash -= price;
  st.lvl = 1;
  st.mood = 90;
  s.stats.ups++;
  addLog(s, 'log.hire', { role: '$role.' + role + '.name' }, 'good');
  bump(s);
  checkGoals(s);
  emit('sfx', 'up');
  return OK;
}
function upgradeStaff(s, role) {
  const st = s.staff[role];
  if (st.lvl <= 0) return fail('hire_first');
  if (st.lvl >= MAX_LVL) return fail('max');
  const price = upCost(role, st.lvl);
  if (s.cash < price) return fail('cash');
  s.cash -= price;
  st.lvl++;
  st.mood = Math.min(100, st.mood + 5);
  s.stats.ups++;
  bump(s);
  checkGoals(s);
  emit('sfx', 'up');
  return OK;
}
function upgradeYou(s) {
  if (s.you.lvl >= MAX_LVL) return fail('max');
  const price = youUpCost(s.you.lvl);
  if (s.cash < price) return fail('cash');
  s.cash -= price;
  s.you.lvl++;
  s.energy = Math.min(maxEnergy(s), s.energy + 10);
  s.stats.ups++;
  bump(s);
  checkGoals(s);
  emit('sfx', 'up');
  return OK;
}
function buyItem(s, id) {
  const it = ITEMS.find((i) => i.id === id);
  if (!it || s.items[id]) return fail('owned');
  if (s.cash < it.price) return fail('cash');
  s.cash -= it.price;
  s.items[id] = 1;
  s.stats.ups++;
  addLog(s, 'log.item', { item: '$item.' + id + '.name' }, 'good');
  bump(s);
  checkGoals(s);
  emit('sfx', 'up');
  return OK;
}
function nextFloor(s) {
  for (const id of FLOOR_ORDER) if (!floorOn(s, id)) return id;
  return null;
}
function buyFloor(s, id) {
  const f = FLOORS.find((x) => x.id === id);
  if (!f || floorOn(s, id)) return fail('owned');
  if (nextFloor(s) !== id) return fail('prev_floor');
  if (s.cash < f.price) return fail('cash');
  s.cash -= f.price;
  s.floors[id] = 1;
  s.stats.ups++;
  s.stats.flrW += f.fw;
  addLog(s, 'log.floor', { name: '$floor.' + id + '.name', sub: '$floor.' + id + '.sub' }, 'good');
  if (id === 'f5') {
    s.ending = true;
    emit('ending', null);
  }
  bump(s);
  checkGoals(s);
  emit('sfx', 'floor');
  return OK;
}
function renovate(s, id) {
  const f = FLOORS.find((x) => x.id === id);
  if (!f || !RENO[id]) return fail('unavailable');
  if (!floorOn(s, id)) return fail('locked');
  const cost = renoCost(s, id);
  if (cost === null) return fail('max');
  if (s.cash < cost) return fail('cash');
  if (!s.flv) s.flv = { b: 0, f1: 0, f2: 0, f3: 0, f4: 0, f5: 0 };
  s.cash -= cost;
  s.flv[id] = renoLvl(s, id) + 1;
  s.stats.ups++;
  s.stats.flrW += Math.max(2, Math.round(f.fw * 0.15));
  addLog(s, 'log.reno', { name: '$floor.' + id + '.name', n: s.flv[id] }, 'good');
  bump(s);
  checkGoals(s);
  emit('reno', { id, lvl: s.flv[id] });
  emit('sfx', 'floor');
  return OK;
}
function buyBoost(s, id) {
  const b = BOOSTS.find((x) => x.id === id);
  if (!b) return fail('unavailable');
  if (s.gems < b.price) return fail('gems');
  s.gems -= b.price;
  s.buffs[id] += DAY_SEC;
  bump(s);
  emit('sfx', 'up');
  return OK;
}
function startProject(s, genre, tier, name) {
  if (s.project) return fail('busy');
  if (!GENRES[genre] || !TIERS[tier]) return fail('unavailable');
  if (!tierUnlocked(s, tier)) return fail('locked');
  const nm = cleanName(name) || newName(s, genre);
  s.project = { genre, tier, name: nm, pts: 0, need: projectNeed(genre, tier), day: s.day };
  s.stats.started++;
  addLog(s, 'log.start', { name: nm }, 'info');
  bump(s);
  checkGoals(s);
  emit('sfx', 'up');
  return OK;
}
function setAuto(s, on) {
  s.auto = !!on;
  bump(s);
  return OK;
}
function release(s) {
  const p = s.project;
  if (!p) return;
  const g = GENRES[p.genre], t = TIERS[p.tier];
  const q = qualityFor(s, p.genre);
  const hot = s.trend.hot === p.genre, cold = s.trend.cold === p.genre;
  let score = 3 + 7 * q + rnd(s, -0.55, 0.55) + (hot ? 0.3 : 0) + qaBonus(s);
  score = Math.round(clamp(score, 1, 10) * 10) / 10;
  const trend = hot ? 1.5 : cold ? 0.75 : 1;
  const total = g.rev * t.rev * ECON.rev * scoreMult(score) * trend * salesMult(s, p.tier);
  const game = {
    id: s.stats.released + 1,
    name: p.name,
    genre: p.genre,
    tier: p.tier,
    score,
    total: Math.round(total),
    rate: total * (1 - SALE_DECAY),
    earned: 0,
    active: true,
    day: s.day,
  };
  s.games.unshift(game);
  if (s.games.length > 40) s.games.length = 40;
  s.stats.released++;
  s.stats.relW += t.w * clamp(score / 6, 0.3, 1.5);
  if (score > s.stats.best) s.stats.best = score;
  let repGain = Math.max(0, score - 5) * t.rep * (s.items.lamp ? 1.15 : 1);
  if (score < 4) repGain = -1;
  s.rep = Math.max(0, round2(s.rep + repGain));
  let gemGain = 0;
  if (score >= 9) {
    gemGain = 1;
    giveGems(s, 1);
  }
  addLog(s, 'log.release', { name: game.name, score: score.toFixed(1) }, score >= 7 ? 'good' : 'info');
  s.project = null;
  checkContract(s, game);
  bump(s);
  emit('release', { game, repGain, gemGain });
  emit('sfx', score >= 7 ? 'hit' : 'release');
  checkGoals(s);
  if (s.auto && tierUnlocked(s, p.tier)) {
    startProject(s, p.genre, p.tier, newName(s, p.genre));
  }
}

function catchIdea(s) {
  if (!s.idea || !s.project) return fail('unavailable');
  const p = s.project;
  const bonus = Math.round(Math.max(20, p.need * 0.06));
  const cash = Math.round(tapPower(s).cash * 12);
  s.idea = null;
  p.pts += bonus;
  giveCash(s, cash);
  s.dayIncome += cash;
  s.stats.ideas = (s.stats.ideas || 0) + 1;
  bump(s);
  emit('sfx', 'coin');
  if (p.pts >= p.need) release(s);
  return { ok: true, bonus, cash };
}

function squashBug(s) {
  if (!s.bug) return fail('unavailable');
  const cash = Math.round(tapPower(s).cash * 8);
  s.bug = null;
  giveCash(s, cash);
  s.dayIncome += cash;
  s.stats.bugs = (s.stats.bugs || 0) + 1;
  bump(s);
  return { ok: true, cash };
}

/* ---------- long-term loop: IPO (prestige) ---------- */
function canPrestige(s) {
  return floorOn(s, 'f5');
}
function prestige(s) {
  if (!canPrestige(s)) return fail('locked');
  const n = newState(s.rng);
  n.gems = s.gems + 3 + s.legacy;
  n.goals = s.goals;
  n.stats = s.stats;
  n.legacy = s.legacy + 1;
  n.dk = s.dk;
  n.dq = s.dq;
  n.sel = s.sel;
  n.settings = s.settings;
  n.endingSeen = true;
  n.t = s.t;
  n.tk = s.tk;
  n.city = Object.assign({}, cityOf(s), { trn: null, ctr: null, offer: null });
  n.rev = s.rev + 1;
  for (const k of Object.keys(s)) delete s[k];
  Object.assign(s, n);
  addLog(s, 'log.ipo', { n: s.legacy }, 'good');
  checkGoals(s);
  emit('sfx', 'floor');
  emit('ipo', { n: s.legacy });
  return OK;
}

/* ---------- goals (permanent quests) ---------- */
// rw: cash / gems / rep. pts = airdrop points weight (one-time, priced by the server)
const GOALS = [
  { id: 'tap10', rw: { cash: 30 }, pts: 2, test: (s) => s.stats.taps >= 10 },
  { id: 'proj1', rw: { cash: 60 }, pts: 3, test: (s) => s.stats.started >= 1 },
  { id: 'hire1', rw: { gems: 1 }, pts: 4, test: (s) => hiredCount(s) >= 1 },
  { id: 'rel1', rw: { cash: 120, gems: 1 }, pts: 8, test: (s) => s.stats.released >= 1 },
  { id: 'shop1', rw: { cash: 100 }, pts: 3, test: (s) => Object.values(s.items).some((v) => v) },
  { id: 'earn1k', rw: { gems: 1 }, pts: 6, test: (s) => s.earned >= 1000 },
  { id: 'team4', rw: { gems: 2 }, pts: 12, test: (s) => hiredCount(s) >= 4 },
  { id: 'score7', rw: { gems: 2, rep: 2 }, pts: 12, test: (s) => s.stats.best >= 7 },

const DAILY_ALL_PTS = 6;

function syncDay(s, dk) {

function claimDaily(s, id) {

  if (s.dq.done[id]) return fail('claimed');
  if (dailyProgress(s, d) < d.need) return fail('notyet');
  s.dq.done[id] = 1;

}

const EVENT_IDS = Object.keys(EVENTS);

function eventView(s) {
  if (!s.pending) return null;
  const def = EVENTS[s.pending.id];
  if (!def) return null;
  const v = s.pending.v || {};
  return {
    id: s.pending.id,
    k: 'ev.' + s.pending.id,
    p: def.tp(v),
    choices: def.choices.map((c, i) => {
      const need = c.need ? c.need(s, v) : 0;
      const needEnergy = c.needEnergy || 0;
      return {
        i,
        style: c.style,
        tags: c.tags,
        lp: c.lp ? c.lp(v) : {},
        disabled: !!((need && s.cash < need) || (needEnergy && s.energy < needEnergy)),
        need,
        needEnergy,
      };
    }),
  };
}
function spawnEvent(s, forceId) {
  if (s.pending) return;
  let id = forceId;
  if (!id) {
    const pool = EVENT_IDS.filter((e) => EVENTS[e].when(s) && !(s.evCool[e] > s.day));
    if (!pool.length) return;
    id = s.day === 2 && EVENTS.deadline.when(s) && !(s.evCool.deadline > 0) ? 'deadline' : pick(s, pool);
  }
  const def = EVENTS[id];
  s.pending = { id, v: def.vals(s) };
  s.evCool[id] = s.day + 6;
  s.nextEventDay = s.day + 2 + Math.floor(rand(s) * 2);
  bump(s);
  emit('event', eventView(s));
}
function chooseEvent(s, idx) {
  if (!s.pending) return fail('unavailable');
  const def = EVENTS[s.pending.id];
  const view = eventView(s);
  const ch = def.choices[idx];
  if (!ch || view.choices[idx].disabled) return fail('unavailable');
  const id = s.pending.id;
  const res = ch.run(s, s.pending.v || {});
  const rk = 'ev.' + id + '.r' + idx + (res._v || '');
  const p = Object.assign({}, res);
  delete p._v;
  addLog(s, rk, p, 'quest', id);
  s.lastOutcome = { id, i: idx, lp: view.choices[idx].lp, rk, p };
  s.pending = null;
  s.stats.evs++;
  bump(s);
  checkGoals(s);
  emit('sfx', 'coin');
  return { ok: true, outcome: s.lastOutcome };
}

/* ---------- time ---------- */
function endDay(s) {
  const total = s.off ? 0 : salaryTotal(s); // while the player is away the team is on paid leave: no payroll, no burnout
  let paid = 0;
  if (total > 0) {
    if (s.cash >= total) {
      s.cash -= total;
      paid = total;
      const base = 3 + (s.items.coffee ? 2 : 0) + (s.items.lounge ? 3 : 0) + (s.items.chairs ? 1 : 0);
      for (const r of ROLES) if (s.staff[r].lvl > 0) s.staff[r].mood = clamp(s.staff[r].mood + base - (s.staff[r].mood > 92 ? 2 : 0), 0, 100);
    } else {
      paid = s.cash;
      s.cash = 0;
      if (!s.off) {
        moodAll(s, -22);
        addLog(s, 'log.salary_short', {}, 'bad');
        emit('toast', { k: 'toast.salary_short', kind: 'bad' });
      }
    }
  }
  // CEO-floor dividends (in-game cash)
  if (floorOn(s, 'f5')) giveCash(s, Math.round(Math.max(50, s.income3 * 0.1)));
  for (const g of s.games) {
    if (!g.active) continue;
    g.rate *= saleDecay(s);
    if (g.rate < 1) g.active = false;
  }
  s.income3 = s.income3 === 0 ? s.dayIncome : s.income3 * 0.6 + s.dayIncome * 0.4;
  const report = { day: s.day, income: s.dayIncome, salary: paid };
  if (!s.off) emit('day', report);
  addLog(s, 'log.day', { day: s.day, income: fmt(s.dayIncome), salary: fmt(paid) }, 'day');
  s.dayIncome = 0;
  s.day++;
  if (rand(s) < 0.5) {
    const hot = pick(s, GENRE_ORDER);
    let cold = pick(s, GENRE_ORDER);
    if (cold === hot) cold = GENRE_ORDER[(GENRE_ORDER.indexOf(hot) + 1) % GENRE_ORDER.length];
    s.trend = { hot, cold };
  }
  if (!s.off && !s.pending && s.day >= s.nextEventDay) spawnEvent(s);
  bump(s);
}
function tick(s, dt) {
  s.t += dt;
  s.tk += dt / TICK;
  s.clock += dt;
  s.energy = Math.min(maxEnergy(s), s.energy + energyRegen(s) * dt);
  for (const k in s.buffs) if (s.buffs[k] > 0) s.buffs[k] = Math.max(0, s.buffs[k] - dt);
  // ideas: while the team works, now and then someone gets an idea the player can catch
  if (s.idea) {
    s.idea.ttl -= dt;
    if (s.idea.ttl <= 0 || !s.project) s.idea = null;
  } else if (!s.off && s.project && hiredCount(s) > 0) {
    s.ideaCd -= dt;
    if (s.ideaCd <= 0) {
      const hired = ROLES.filter((r) => s.staff[r].lvl > 0);
      s.idea = { role: pick(s, hired), ttl: 12 };
      s.ideaCd = 25 + rand(s) * 20;
      emit('idea', s.idea);
    }
  }
  // bugs: crawl across the floor; if nobody squashes one, it eats a bit of the project
  if (s.bug) {
    s.bug.ttl -= dt;
    if (s.bug.ttl <= 0 || !s.project) {
      if (s.bug.ttl <= 0 && s.project && !s.off) {
        const loss = Math.round(s.project.need * 0.02);
        s.project.pts = Math.max(0, s.project.pts - loss);
        emit('bugEscaped', { loss });
      }
      s.bug = null;
    }
  } else if (!s.off && s.project && s.stats.released >= 1) {
    s.bugCd -= dt;
    if (s.bugCd <= 0) {
      s.bug = { ttl: 10, lane: Math.floor(rand(s) * 3) };
      s.bugCd = 45 + rand(s) * 40;
      emit('bug', s.bug);
    }
  }
  if (s.project) {
    s.project.pts += wpTotal(s) * dt;
    if (s.off) s.project.pts = Math.min(s.project.pts, s.project.need - 1); // the team waits for you to ship
    else if (s.project.pts >= s.project.need) release(s);
  }
  const hype = s.buffs.hype > 0 ? 2 : 1;
  const inv = s.buffs.invest > 0 ? 0.85 : 1;
  for (const g of s.games) {
    if (!g.active) continue;
    const inc = ((g.rate * dt) / DAY_SEC) * hype * inv;
    s.cash += inc;
    s.earned += inc;
    g.earned += inc;
    s.dayIncome += inc;
  }
  if (s.clock >= DAY_SEC) {
    s.clock -= DAY_SEC;
    endDay(s);
  }
  if ((Math.round(s.tk) & 3) === 0) { checkGoals(s); cityTick(s); } // once per game second, identical on client and server
}
// live play: integer number of fixed ticks (identical on client and server)
function advanceTicks(s, n) {
  for (let i = 0; i < n; i++) tick(s, TICK);
}
// seconds => ticks (rounded)
function advance(s, seconds) {
  advanceTicks(s, Math.round(seconds / TICK));
  checkGoals(s);
}
// away from the game: coarse 1 s steps, no events, no mood penalties
function advanceOffline(s, seconds) {
  const sec = Math.floor(clamp(seconds, 0, OFFLINE_CAP));
  s.off = 1;
  for (let i = 0; i < sec; i++) tick(s, 1);
  s.off = 0;
  checkGoals(s);
  return sec;
}

const ACTIONS = {

/* ============================================================
   OFFICE DREAMS — sync client (pure logic, no DOM, no fetch)
   Keeps the local prediction and the action log in step with the
   authoritative server state. Used by the browser and by the tests.
   ============================================================ */
function createSyncClient(S, EN) {
  const c = {
    S,
    seq: 0,
    queue: [], // [[dTicks, action, ...args]] not yet sent
    lastTk: S.tk, // tick of the last queued action (or of the last sync point)
    inflight: null,
    stats: { adopts: 0, same: 0, stale: 0, replayFails: 0 },
  };
  // run a player action locally (prediction) and log it for the server
  c.act = function (type, ...args) {
    const r = EN.applyAction(c.S, [type].concat(args));
    if (r.ok) {
      c.queue.push([Math.round(c.S.tk - c.lastTk), type].concat(args));
      c.lastTk = c.S.tk;
    }
    return r;
  };
  c.pending = function () {
    return c.queue.length;
  };
  // build the request body (null while a request is in flight)
  c.prepare = function () {
    if (c.inflight) return null;
    const tail = Math.round(c.S.tk - c.lastTk);
    const body = { seq: c.seq, batch: c.queue, tail, ck: EN.stateHash(c.S) };
    c.inflight = { batch: c.queue, tail, sentTk: c.S.tk };
    c.queue = [];
    c.lastTk = c.S.tk;
    return body;
  };
  // the request never produced a usable answer: put everything back
  c.fail = function () {
    const inf = c.inflight;
    if (!inf) return;
    c.inflight = null;
    if (c.queue.length) c.queue[0][0] += inf.tail;
    else c.lastTk = inf.sentTk - inf.tail;
    c.queue = inf.batch.concat(c.queue);
  };
  function adopt(stateObj) {
    const keep = { sel: c.S.sel, settings: c.S.settings };
    const ns = EN.deserialize(stateObj);
    ns.sel = keep.sel || ns.sel;
    ns.settings = keep.settings || ns.settings;
    return ns;
  }
  // server answer. Returns {state: true} when c.S was replaced.
  c.apply = function (resp) {
    const inf = c.inflight;
    c.inflight = null;
    if (!resp || typeof resp !== 'object') return { state: false };
    if (resp.seq !== undefined) c.seq = resp.seq;
    if (resp.ok === false) {
      if (resp.state) {
        // stale / clock violation: the server wins, pending actions are dropped
        c.S = adopt(resp.state);
        c.queue = [];
        c.lastTk = c.S.tk;
        c.stats.stale++;
        return { state: true, dropped: true, err: resp.err };
      }
      if (inf) { c.inflight = inf; c.fail(); }
      return { state: false, err: resp.err };
    }
    if (resp.state) {
      const ns = adopt(resp.state);
      const flightTail = Math.round(c.S.tk - c.lastTk);
      c.stats.replayFails += EN.replay(ns, c.queue, flightTail);
      c.S = ns;
      c.lastTk = ns.tk - flightTail;
      c.stats.adopts++;
      return { state: true };
    }
    c.stats.same++;
    return { state: false };
  };
  return c;
}

  { id: 'valley', words: [['STARTUP', 'yel'], ['SCALE', 'grn'], ['CLOUD', 'cyan'], ['AI', 'org']], tint: '#ffb347', k: 0.14 },
  { id: 'orbit', words: [['ORBIT', 'cyan'], ['STARS', 'white'], ['MOON', 'yel'], ['MARS', 'red']], tint: '#4ca3ff', k: 0.2 },

let ERA = null;
const eraIndex = (legacy) => Math.min(3, Math.max(0, legacy | 0));
const wordsNow = () => (ERA ? ERA.words : THEME.words);
function applyEra(legacy) {
  ERA = ERAS[eraIndex(legacy)];

  PAL.wallR = mixC(PAL.wallR, t, k); PAL.wallL = mixC(PAL.wallL, t, k * 0.85);

}
// what you see through the window in each location (ly = 0 at the bottom of the glass)
function eraWindow(lx, ly, gh, sky, col) {
  const id = ERA.id;
  if (id === 'orbit') {
    let c = mixC(C('#02030f'), C('#0b1240'), ly / gh);
    if (hash01(lx * 131 + ly * 17) < 0.06) c = mixC(c, PAL.white, 0.5 + hash01(lx + ly * 7) * 0.5);
    // the Earth rising at the bottom, with an atmosphere rim and day/night side
    const ex = 34, ey = -20, r = 30, d = Math.hypot(lx - ex, ly - ey);
    if (d < r + 2.5 && d >= r) c = mixC(c, C('#7ad8ff'), 0.8 - (d - r) * 0.28);
    else if (d < r) {
      const n = hash01(Math.floor(lx / 3) * 13 + Math.floor(ly / 2) * 7) + 0.4 * Math.sin(lx * 0.31 + ly * 0.5);
      c = n > 0.85 ? C('#2ea05a') : n > 0.7 ? C('#3fb86a') : C('#1f5fd0');
      if (hash01(lx * 7 + ly * 29) < 0.12) c = mixC(c, PAL.white, 0.7);
      c = shadeC(c, 0.55 + 0.45 * clampN((lx - ex + r) / (2 * r), 0, 1));
    }
    // the Moon, high on the right
    const mx = 60, my = 25, md = Math.hypot(lx - mx, ly - my);
    if (md < 5) c = md < 4 ? mixC(C('#d8d4ee'), C('#9a94c8'), hash01(lx * 3 + ly * 5) * 0.5) : mixC(c, C('#d8d4ee'), 0.4);
    return c;
  }

    // a pink dusk over Mt. Fuji behind the city
    let c = mixC(col, C('#ff6f91'), 0.28);
    const fuji = 22 - Math.abs(lx - 46) * 0.62;
    if (ly < fuji) { c = ly > fuji - 4 ? C('#f6e8ff') : mixC(C('#3a2a6a'), C('#5a3a8a'), ly / 22); }
    return c;
  }

  for (const px of [12, 39, 63]) {
    const dx = lx - px;
    if (dx === 0 && ly < hill + 13 && ly >= hill - 1) c = C('#6b4a2a');
    if (ly > hill + 10 && ly < hill + 15 && Math.abs(dx) < 6 - Math.abs(ly - hill - 12.5) * 1.6) c = C('#2e8a3a');

  return c;
}
const pc = (v) => (typeof v === 'string' && v[0] !== '#' ? PAL[v] : C(v));
function themeTier(floors) {
  if (!floors) return 0;
  for (let i = 5; i >= 1; i--) if (floors['f' + i]) return i;
  return 0;
}
function applyTheme(tier) {
  THEME = THEMES[clampN(tier | 0, 0, 5)];
  const T = THEME;
  PAL.wallR = C(T.wallR); PAL.wallL = C(T.wallL);
  PAL.floorA = C(T.floorA); PAL.floorB = C(T.floorB); PAL.grid = C(T.grid);

/* ---------- sky ---------- */
const SKY_KEYS = [
  [0.0, C('#3a2f7a'), C('#ff8a6b'), 0.55],
  [0.2, C('#4d8fe8'), C('#ffc59a'), 0.18],
  [0.45, C('#3fa7ff'), C('#c4ecff'), 0.04],
  [0.75, C('#5a2fa8'), C('#ff6f91'), 0.4],
  [1.0, C('#0b0f33'), C('#262d86'), 0.92],
];
function skyAt(f) {
  f = clampN(f, 0, 1);
  for (let i = 0; i < SKY_KEYS.length - 1; i++) {
    const a = SKY_KEYS[i], b = SKY_KEYS[i + 1];
    if (f <= b[0]) {
      const t = (f - a[0]) / (b[0] - a[0]);
      return { top: mixC(a[1], b[1], t), bot: mixC(a[2], b[2], t), dens: a[3] + (b[3] - a[3]) * t, night: f > 0.82 ? (f - 0.82) / 0.18 : 0 };
    }
  }
  const l = SKY_KEYS[SKY_KEYS.length - 1];
  return { top: l[1], bot: l[2], dens: l[3], night: 1 };
}

/* skyline (window-local columns) */
const WIN = { k0: 30, k1: 102, v0: 18, v1: 50 };
const SKYLINE = (() => {
  const w = WIN.k1 - WIN.k0 + 1;
  const far = new Array(w).fill(0), near = new Array(w).fill(0), farId = new Array(w).fill(0), nearId = new Array(w).fill(0);
  let x = 0, id = 1, s = 11;
  const rnd = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
  while (x < w) {
    const bw = 5 + Math.floor(rnd() * 7), bh = 8 + Math.floor(rnd() * 14);
    for (let i = 0; i < bw && x + i < w; i++) { far[x + i] = bh; farId[x + i] = id; }
    x += bw; id++;
  }
  x = 0;
  while (x < w) {
    const bw = 6 + Math.floor(rnd() * 8), bh = 3 + Math.floor(rnd() * 12);
    for (let i = 0; i < bw && x + i < w; i++) { near[x + i] = bh; nearId[x + i] = id; }
    x += bw; id++;
  }
  return { far, near, farId, nearId };
})();

function windowPixel(kx, v, sky) {
  const lx = kx - WIN.k0, ly = v - WIN.v0; // ly 0 at bottom of window
  const gh = WIN.v1 - WIN.v0; // glass height
  const y01 = 1 - ly / gh;
  let col = mixC(sky.top, sky.bot, clampN(y01 * 1.05, 0, 1));
  if (ERA && ERA.id !== 'tokyo') return eraWindow(lx, ly, gh, sky, col);
  if (ERA) col = eraWindow(lx, ly, gh, sky, col);
  // stars
  if (sky.night > 0 && hash01(lx * 131 + ly * 17) < 0.035 * sky.night && ly > 16) col = mixC(col, PAL.white, 0.8);
  const fh = SKYLINE.far[lx] - THEME.view, nh = SKYLINE.near[lx] - THEME.view * 1.3;
  if (ly < fh + 6) {
    if (ly < fh + 6 && ly <= fh + 5 && ly < fh + 6 && ly < fh + 6) {
      /* far layer lives from 0..fh+6 */
    }
  }
  const farTop = fh + 5, nearTop = nh + 2;
  if (ly < farTop) {
    let bc = mixC(sky.bot, C('#2a2468'), 0.72);
    const wx = lx % 3 === 1, wy = ly % 3 === 1;
    if (wx && wy && ly > 1 && ly < farTop - 1 && hash01(lx * 31 + ly * 7 + SKYLINE.farId[lx] * 3) < sky.dens * 0.55) {
      const h = hash01(lx * 5 + ly * 9 + 3);
      bc = mixC(bc, h < 0.5 ? PAL.yel : h < 0.8 ? PAL.cyan : PAL.mag, 0.55);
    }
    col = bc;
  }
  if (ly < nearTop) {
    let bc = C('#0c0e2c');
    if (ly === nearTop - 1) bc = C('#1a1d4d');
    const wx = lx % 3 === 0, wy = ly % 3 === 1;
    if (wx && wy && ly > 0 && ly < nearTop - 1 && hash01(lx * 17 + ly * 11 + SKYLINE.nearId[lx] * 5) < sky.dens) {
      const h = hash01(lx * 3 + ly * 13 + 1);
      bc = h < 0.55 ? PAL.yel : h < 0.8 ? PAL.cyan : PAL.mag;
    }
    col = bc;
  }
  return col;
}

/* ---------- wall helpers ---------- */
function wallXY(side, k, v) {
  const yf = SCN.OY + ((k + 1) >> 1);
  return side === 'R' ? [SCN.OX + k, yf - v] : [SCN.OX - 1 - k, yf - v];
}
function wallPx(B, side, k, v, c) {
  const p = wallXY(side, k, v);
  B.px(p[0], p[1], c);
}
function wallBlend(B, side, k, v, c, a) {
  const p = wallXY(side, k, v);
  B.blend(p[0], p[1], c, a);
}
function wallGlyphs(B, side, k0, v0, str, col, glowCol) {
  // on the left wall columns run right-to-left, so mirror the text to keep it readable
  const tw = textWidth(str);
  const kx = (cx) => (side === 'L' ? k0 + (tw - 1 - cx) : k0 + cx);
  eachGlyphPixel(str, (cx, ry) => {
    const v = v0 + (4 - ry);
    if (glowCol) {
      wallBlend(B, side, kx(cx) - 1, v, glowCol, 0.28);
      wallBlend(B, side, kx(cx) + 1, v, glowCol, 0.28);
      wallBlend(B, side, kx(cx), v + 1, glowCol, 0.28);
      wallBlend(B, side, kx(cx), v - 1, glowCol, 0.28);
    }
  });
  eachGlyphPixel(str, (cx, ry) => wallPx(B, side, kx(cx), v0 + (4 - ry), col));
}

function drawWalls(B, f) {
  const sky = skyAt(f);
  const H = SCN.WALL;
  for (const side of ['R', 'L']) {
    const base = side === 'R' ? PAL.wallR : PAL.wallL;
    const strip = PAL[side === 'R' ? THEME.stripR : THEME.stripL];
    for (let k = 0; k < 108; k++) {
      for (let v = 0; v <= H + 1; v++) {
        let col;
        if (v >= H) col = mixC(base, PAL.white, 0.22);
        else if (v >= H - 1) col = C('#0a0c28');
        else if (v >= H - 3) col = strip;
        else if (v < 2) col = C('#141745');
        else if (v < 15) col = shadeC(base, 0.82);
        else if (v === 15) col = mixC(base, PAL.white, 0.14);
        else col = base;
        if (v >= 15 && v < H - 3 && k % 36 === 0) col = shadeC(col, 0.86);
        if (v >= H - 8 && v < H - 3) col = mixC(col, strip, 0.1 * (1 - (H - 4 - v) / 6));
        wallPx(B, side, k, v, col);
      }
    }
  }
  // window on right wall
  for (let k = WIN.k0 - 2; k <= WIN.k1 + 2; k++) {
    for (let v = WIN.v0 - 3; v <= WIN.v1 + 1; v++) {
      let col = null;
      const inGlass = k >= WIN.k0 + 2 && k <= WIN.k1 - 2 && v >= WIN.v0 + 1 && v <= WIN.v1 - 2;
      const inFrame = k >= WIN.k0 && k <= WIN.k1 && v >= WIN.v0 - 1 && v <= WIN.v1;
      if (inGlass) {
        col = windowPixel(k, v - 1, sky);
        const mull = (k - WIN.k0 - 2) % 23 === 22 || (k - WIN.k0 - 2) % 23 === 0;
        if (mull && k > WIN.k0 + 3) col = C('#0b0d2b');
        // soft glass shine
        if (((k + v * 2) % 29) < 2) col = mixC(col, PAL.white, 0.1);
      } else if (inFrame) col = C('#0b0d2b');
      else if (v >= WIN.v0 - 3 && v < WIN.v0 - 1 && k >= WIN.k0 - 2 && k <= WIN.k1 + 2) col = mixC(PAL.wallR, PAL.white, 0.3); // sill
      if (col !== null) wallPx(B, 'R', k, v, col);
    }
  }
  // window light spill onto the wall (soft)
  // neon sign on left wall
  {
    const k0 = 22, k1 = 60, v0 = 12, v1 = 52;
    for (let k = k0; k <= k1; k++)
      for (let v = v0; v <= v1; v++) {
        const edge = k === k0 || k === k1 || v === v0 || v === v1;
        wallPx(B, 'L', k, v, edge ? C('#3c3f94') : C('#0b0d2b'));
      }
    const words = wordsNow().map((w, i) => [w[0], pc(w[1]), 46 - i * 8]);
    for (const w of words) {
      const tw = textWidth(w[0]);
      const kk = k0 + 1 + Math.floor((k1 - k0 - 1 - tw) / 2);
      wallGlyphs(B, 'L', kk, w[2] - 1, w[0], w[1], w[1]);
    }
  }
  // poster on right wall near corner
  {
    const k0 = 8, k1 = 24, v0 = 22, v1 = 44;
    for (let k = k0; k <= k1; k++)
      for (let v = v0; v <= v1; v++) {
        const edge = k === k0 || k === k1 || v === v0 || v === v1;
        const t = (v - v0) / (v1 - v0);
        const pp = THEME.poster;
        let col = mixC(C(pp[0]), C(pp[1]), t);
        if (!edge && v < v0 + 9 && Math.hypot(k - 16, v - (v0 + 7)) < 4.2) col = C(pp[2]); // sun
        if (!edge && v < v0 + 6 && v > v0 + 3 && (k + v) % 2 === 0 && Math.hypot(k - 16, v - (v0 + 7)) < 5) col = C('#ff8a3d');
        if (!edge && v >= v0 + 1 && v <= v0 + 7 && ((k * 7 + 3) % 5) === 0 && v < v0 + 4 + (k % 3)) col = C('#1a0f4d');

  {
    const kc = 82, vc = 38;
    for (let dk = -6; dk <= 6; dk++)

        const d = Math.hypot(dk, dv);
        if (d <= 6.2) wallPx(B, 'L', kc + dk, vc + dv, d > 5 ? C('#e8e8ff') : C('#10133a'));
      }
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      wallPx(B, 'L', kc + Math.round(Math.sin(a) * 4.2), vc + Math.round(Math.cos(a) * 4.2), PAL.cyan);
    }

}

function drawWallDeco(B) {
  const d = THEME.deco;
  const box = (k0, k1, v0, v1, fill, edge) => {
    for (let k = k0; k <= k1; k++) for (let v = v0; v <= v1; v++) wallPx(B, 'L', k, v, k === k0 || k === k1 || v === v0 || v === v1 ? edge : fill);
  };
  if (d === 'binders') {
    // accounting: a shelf of colourful binders and a rising chart
    box(92, 106, 16, 30, C('#0c2a30'), C('#e8f6ff'));
    const cols = [PAL.grn, PAL.cyan, PAL.yel, PAL.org, PAL.blu, PAL.mag];
    for (let i = 0; i < 6; i++) for (let v = 18; v <= 27 - (i % 2); v++) { wallPx(B, 'L', 94 + i * 2, v, cols[i]); }
    box(92, 106, 34, 50, C('#f2fff9'), C('#2a6a66'));
    const pts = [[94, 37], [97, 39], [100, 38], [103, 44], [105, 47]];
    for (let i = 0; i < pts.length - 1; i++) {
      const [ka, va] = pts[i], [kb, vb] = pts[i + 1];
      for (let k = ka; k <= kb; k++) wallPx(B, 'L', k, Math.round(va + ((vb - va) * (k - ka)) / (kb - ka)), PAL.grn);
    }
  } else if (d === 'palette') {
    // design: colour swatches + a painting
    box(92, 106, 36, 50, C('#fff8ec'), C('#ffd23f'));
    for (let k = 93; k <= 105; k++) for (let v = 37; v <= 49; v++) {
      const h = Math.hypot(k - 99, v - 43);
      if (h < 5) wallPx(B, 'L', k, v, h < 2.5 ? PAL.mag : PAL.cyan);
      else if (v < 40) wallPx(B, 'L', k, v, PAL.yel);
    }
    const sw = [PAL.red, PAL.org, PAL.yel, PAL.grn, PAL.cyan, PAL.blu, PAL.mag];
    sw.forEach((c, i) => { for (let v = 18; v <= 30; v++) { wallPx(B, 'L', 92 + i * 2, v, c); wallPx(B, 'L', 93 + i * 2, v, c); } });
  } else if (d === 'tv') {
    // marketing: a big screen with growth bars and a heart
    box(90, 107, 18, 48, C('#0a0c24'), C('#3a3f5a'));
    const bars = [6, 10, 8, 15, 21];
    bars.forEach((h, i) => { for (let v = 21; v < 21 + h; v++) { wallPx(B, 'L', 93 + i * 3, v, PAL.org); wallPx(B, 'L', 94 + i * 3, v, PAL.org); } });
    const heart = ['.11.11.', '1111111', '1111111', '.11111.', '..111..', '...1...'];
    heart.forEach((row, r) => [...row].forEach((ch, c) => { if (ch === '1') wallPx(B, 'L', 92 + c, 45 - r, PAL.red); }));
  } else if (d === 'invader') {
    // game dev: a pixel space invader poster
    box(91, 107, 16, 50, C('#03140f'), C('#2ee66b'));
    const inv = ['..1.....1..', '...1...1...', '..1111111..', '.11.111.11.', '11111111111', '1.1111111.1', '1.1.....1.1', '...11.11...'];
    inv.forEach((row, r) => [...row].forEach((ch, c) => { if (ch === '1') wallPx(B, 'L', 94 + c, 42 - r, PAL.grn); }));
    for (let k = 93; k <= 105; k += 2) wallPx(B, 'L', k, 22, PAL.cyan);
  } else if (d === 'trophy') {
    // CEO: a golden trophy in a frame and a gold-framed company portrait
    box(91, 107, 16, 50, C('#120e1c'), C('#ffd23f'));
    const cup = ['1111111', '1111111', '.11111.', '..111..', '...1...', '...1...', '..111..', '.11111.'];
    cup.forEach((row, r) => [...row].forEach((ch, c) => { if (ch === '1') wallPx(B, 'L', 96 + c, 44 - r, r < 2 ? C('#fff1a8') : PAL.yel); }));
    wallPx(B, 'L', 95, 43, PAL.yel); wallPx(B, 'L', 94, 42, PAL.yel); wallPx(B, 'L', 103, 43, PAL.yel); wallPx(B, 'L', 104, 42, PAL.yel);
    for (let k = 93; k <= 105; k++) wallPx(B, 'L', k, 24, PAL.yel);
  }
}

function drawFloor(B) {
  const N = SCN.N;
  // slab thickness
  const L = P(0, N, 0), Bt = P(N, N, 0), Rr = P(N, 0, 0);
  const T = 7;
  B.poly([L, Bt, [Bt[0], Bt[1] + T], [L[0], L[1] + T]], PAL.slab);
  B.poly([Bt, Rr, [Rr[0], Rr[1] + T], [Bt[0], Bt[1] + T]], shadeC(PAL.slab, 0.78));
  B.line(L[0], L[1] + 1, Bt[0], Bt[1] + 1, PAL.slabEdge);
  B.line(Bt[0], Bt[1] + 1, Rr[0], Rr[1] + 1, mixC(PAL.slabEdge, PAL.mag, 0.5));
  const kind = THEME.floor;
  if (kind === 'wood') {
    // parquet planks running along gx, staggered seams
    for (let j = 0; j < N * 3; j++) {
      const off = (j % 3) * 0.33;
      for (let i = -1; i < N; i++) {
        const a = Math.max(0, i + off), b = Math.min(N, i + 1 + off);
        if (b <= a) continue;
        const h = hash01(i * 13 + j * 7);
        isoQuad(B, a, j / 3, b, (j + 1) / 3, 0, mixC(PAL.floorA, PAL.floorB, h));
        const p = P(a, j / 3, 0), q = P(a, (j + 1) / 3, 0);
        B.line(p[0], p[1], q[0], q[1], PAL.grid);
      }
      const p = P(0, j / 3, 0), q = P(N, j / 3, 0);
      B.line(p[0], p[1], q[0], q[1], mixC(PAL.grid, PAL.floorA, 0.4));
    }
    return;
  }
  for (let i = 0; i < N; i++)
    for (let j = 0; j < N; j++) {
      let col = (i + j) & 1 ? PAL.floorA : PAL.floorB;
      if (kind === 'carpet') col = mixC(PAL.floorA, C('#000000'), hash01(i * 5 + j * 11) * 0.12);
      isoQuad(B, i, j, i + 1, j + 1, 0, col);
    }
  if (kind === 'carpet') {
    // soft fibre speckle, no grid
    for (let n = 0; n < 900; n++) {
      const gx = hash01(n * 3 + 1) * N, gy = hash01(n * 7 + 2) * N;
      const p = P(gx, gy, 0);
      B.blend(p[0], p[1], hash01(n) < 0.5 ? PAL.white : C('#000000'), 0.07);
    }
    return;
  }
  const gcol = kind === 'metal' ? mixC(PAL.floorB, PAL.grid, 0.35) : kind === 'marble' ? PAL.grid : mixC(PAL.floorB, PAL.grid, 0.55);
  for (let i = 0; i <= N; i++) {
    const a = P(i, 0, 0), b = P(i, N, 0), c = P(0, i, 0), d = P(N, i, 0);
    B.line(a[0], a[1], b[0], b[1], gcol);
    B.line(c[0], c[1], d[0], d[1], gcol);
  }
  if (kind === 'marble') {
    // thin grey veins across the stone
    for (let v = 0; v < 14; v++) {
      let gx = hash01(v * 5 + 3) * N, gy = hash01(v * 9 + 1) * N;
      for (let s = 0; s < 22; s++) {
        const p = P(gx, gy, 0);
        B.blend(p[0], p[1], C('#8a83b0'), 0.35);
        gx += 0.09 + (hash01(v * 31 + s) - 0.5) * 0.08; gy += (hash01(v * 17 + s * 3) - 0.5) * 0.12;
      }
    }
  } else if (kind === 'metal') {
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
      for (const [a, b] of [[0.15, 0.15], [0.85, 0.15], [0.15, 0.85], [0.85, 0.85]]) { const p = P(i + a, j + b, 0); B.px(p[0], p[1], C('#3a4560')); }
      if ((i * 3 + j) % 7 === 0) { const p = P(i + 0.5, j + 0.5, 0); B.glow(p[0], p[1], 5, PAL.grn, 0.12); }
    }
  }
}

function screenContent(B, plane, a0, a1, fixed, z0, z1, col, t, seed, kind) {
  const line = plane === 'GY' ? lineGY : lineGX;
  const step = Math.floor(t * 2.2);
  const span = a1 - a0;
  if (kind === 'mkt') {
    // bars
    for (let i = 0; i < 5; i++) {
      const hgt = 1.5 + hash01(seed * 7 + i * 13 + step) * (z1 - z0 - 3);
      const x0 = a0 + 0.08 + i * (span / 5.2), x1 = x0 + span / 8;
      if (plane === 'GY') faceGY(B, x0, x1, fixed, z0 + 0.6, z0 + 0.6 + hgt, i % 2 ? col : PAL.cyan);
      else faceGX(B, x0, x1, fixed, z0 + 0.6, z0 + 0.6 + hgt, i % 2 ? col : PAL.cyan);
    }
    return;
  }
  const rows = Math.max(2, Math.floor((z1 - z0) / 2));
  for (let i = 0; i < rows; i++) {
    const z = z1 - 1.2 - i * 2;
    if (z < z0 + 0.4) break;
    const len = (0.25 + hash01(seed * 11 + i * 17 + step * 3) * 0.7) * (span - 0.1);
    const ind = kind === 'prog' ? ((i + step) % 3) * 0.1 : 0;
    const c = kind === 'art' ? (i % 2 ? col : PAL.cyan) : kind === 'des' ? (i % 3 === 0 ? PAL.white : col) : i % 3 === 0 ? mixC(col, PAL.white, 0.5) : col;
    line(B, a0 + 0.05 + ind, a0 + 0.05 + ind + len, fixed, z, c);
  }
}

/* ============================================================
   HD characters (drawn at ×2 on the upscaled buffer): more pixels for faces, hair, clothes
   and motion. Each role has its own look: the coder in a hoodie, the artist with a bun
   and a pencil, the designer in headphones, the marketer with a ponytail and a blazer.
   ============================================================ */
// seated legs as small iso boxes (drawn with PS = 2): thighs on the seat, shins down to the floor, sneakers;
// dir = the way the person faces in grid units ([0,-1] right-wall desks, [-1,0] left-wall desks, [1,0] player)
const PANTS = { prog: '#4a6fd0', art: '#7a52b8', des: '#5a6a8a', mkt: '#3f58b0', you: '#3e4fa0', npc: '#262b66' };
function drawLegsHD(B, cx, cy, dir, pants, t, seed, tap) {
  // drawn in screen space from iso points: hip → knee → ankle, tapered limbs with a knee highlight,
  // rounded sneakers with a sole; PS is 2 while this runs
  const pc0 = C(pants), pHi = mixC(pc0, PAL.white, 0.22), pLo = shadeC(pc0, 0.62);
  const shoe = C('#f4f2ff'), shoeLo = C('#b8b2e6'), sole = C('#2a2e72'), lace = C('#ff3fd0');
  const [dx, dy] = dir, px = -dy, py = dx;
  const seg = (a, b, w0, w1, col, edge) => {
    const vx = b[0] - a[0], vy = b[1] - a[1], L = Math.hypot(vx, vy) || 1, nx = -vy / L, ny = vx / L;
    B.poly([[a[0] + nx * w0, a[1] + ny * w0], [b[0] + nx * w1, b[1] + ny * w1], [b[0] - nx * w1, b[1] - ny * w1], [a[0] - nx * w0, a[1] - ny * w0]], col);
    if (edge) B.poly([[a[0] + nx * w0, a[1] + ny * w0], [b[0] + nx * w1, b[1] + ny * w1], [b[0] + nx * (w1 - 1.4), b[1] + ny * (w1 - 1.4)], [a[0] + nx * (w0 - 1.4), a[1] + ny * (w0 - 1.4)]], edge);
    B.ell(b[0], b[1], w1, w1, col);
  };
  for (const side of [1, -1]) { // far leg first
    const o = side * 0.12, ox = cx + px * o, oy = cy + py * o;
    const tapZ = tap && side === -1 && Math.floor(t * 6 + seed) % 2 ? 1 : 0;
    const hip = P(ox, oy, 9.6), knee = P(ox + dx * 0.44, oy + dy * 0.44, 9.4), ankle = P(ox + dx * 0.5, oy + dy * 0.5, 1.6 + tapZ);
    const toe = P(ox + dx * 0.72, oy + dy * 0.72, 0.9 + tapZ), heel = P(ox + dx * 0.44, oy + dy * 0.44, 0.9 + tapZ);
    const far = side === 1, base = far ? shadeC(pc0, 0.82) : pc0;
    seg(hip, knee, 4.2, 3.8, base, far ? null : pHi);           // thigh
    seg(knee, ankle, 3.6, 2.8, far ? pLo : shadeC(pc0, 0.9), null); // shin
    B.ell(knee[0], knee[1] - 1, 2.2, 1.6, far ? base : pHi);       // knee highlight
    // sneaker: rounded toe box, sole, a lace stripe
    const mx = (heel[0] + toe[0]) / 2, my = (heel[1] + toe[1]) / 2;
    B.ell(mx, my + 1.5, Math.abs(toe[0] - heel[0]) / 2 + 3.4, 2.4, sole);
    B.ell(mx, my, Math.abs(toe[0] - heel[0]) / 2 + 3, 2.6, far ? shoeLo : shoe);
    B.ell(toe[0], toe[1], 2.6, 2.2, far ? shoeLo : shoe);
    B.line(Math.round(ankle[0] - 1), Math.round(ankle[1] + 1), Math.round(mx), Math.round(my - 1), lace);
  }
}
const HD_ROLE = { prog: 'hoodie', art: 'bun', des: 'phones', mkt: 'blazer' };
function hdShade(c, k) { return shadeC(c, k); }
function drawWorkerHD(B, X, Y, look, role, typing, t, seed, mood) {
  const kind = HD_ROLE[role] || 'hoodie';
  const sh = look.shirt, s1 = hdShade(sh, 0.78), s2 = hdShade(sh, 0.58), hl = mixC(sh, PAL.white, 0.28);
  const hair = look.hair, h1 = hdShade(hair, 0.72), h2 = mixC(hair, PAL.white, 0.3), skin = look.skin, sk1 = hdShade(skin, 0.8);
  const tk = typing ? Math.floor(t * 9 + seed) % 2 : 0;
  const breathe = Math.sin(t * 1.7 + seed) > 0.75 ? 1 : 0;
  const by = Y - breathe; // whole upper body rises a little when breathing
  // upper arms + elbows (hands are in front of the body, on the keyboard)
  B.rect(X - 13, by - 21, 4, 11, s1); B.rect(X + 9, by - 21, 4, 11, s2);
  B.ell(X - 11, by - 9 + tk, 2.5, 2, s2); B.ell(X + 11, by - 9 + (1 - tk), 2.5, 2, s2);
  // torso with rounded shoulders
  B.poly([[X - 10, by - 23], [X + 10, by - 23], [X + 9, by - 4], [X - 9, by - 4]], sh);
  B.ell(X - 9, by - 21, 3.5, 3, sh); B.ell(X + 9, by - 21, 3.5, 3, s1);
  B.poly([[X + 4, by - 23], [X + 10, by - 23], [X + 9, by - 4], [X + 4, by - 4]], s1);
  B.rect(X - 9, by - 24, 7, 1, hl); B.rect(X - 10, by - 22, 1, 6, hl);
  B.rect(X, by - 19, 1, 12, s2); // spine fold
  B.rect(X - 9, by - 6, 18, 2, s2); // waist
  if (kind === 'hoodie') {
    B.ell(X, by - 23, 7.5, 3.5, s2); B.ell(X, by - 23.5, 5.5, 2, s1);
    B.rect(X - 2, by - 16, 5, 1, hdShade(sh, 0.5)); // pocket seam
  } else if (kind === 'bun') {
